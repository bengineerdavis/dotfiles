# Worker budget for this machine — per contributor, per machine, never committed.
#
# Copy this file to .agent-budget.toml and edit the value; or let a session
# write it when it asks. A session that finds no .agent-budget.toml will ask
# rather than run a writer unbudgeted — that ask is the forcing function, so
# nobody is surprised with the bill.
#
# This file is project-scoped: it lives in the repo, is gitignored, and dies
# with the repo. Delete it and nothing outside the checkout remembers it.

# Max concurrent execution sessions on this machine — the tasks' writers.
# 0 = serial work, higher = more parallel; the slider decides how linear
# the task list runs. Read-only research and review are unbudgeted.
#
# Sizing, per machine — derive your own, measured not guessed:
#   conservative = floor(cores / 4); never above floor(cores / 2).
#   A session that runs local models counts against memory first — when
#   ollama is resident, lower this number rather than trusting the cores.
workers = 1
