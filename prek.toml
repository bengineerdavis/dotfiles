#:schema https://www.schemastore.org/prek.json
# Configuration file for `prek`, a git hook framework written in Rust.
# See https://prek.j178.dev for more information.
#
# Converted from .pre-commit-config.yaml by `prek util yaml-to-toml` on
# 2026-11-08; the YAML comments below were carried over by hand because the
# converter does not preserve them. Validate with `prek validate-config prek.toml`.
#
# The three Git stages used below each need a shim installed; without
# `default_install_hook_types` prek installs only `pre-commit`.

default_install_hook_types = [
  "pre-commit",
  "pre-push",
  "commit-msg",
]

# 1. Lint and format all Python (config: [tool.ruff] in pyproject.toml).
#    Pinned to the same ruff the machine runs (mise: 0.16.9).
#    types_or: the runner passes every staged file to a hook by default, and
#    ruff parses explicit paths as Python regardless of extension — a .sh
#    script fails ruff-check with invalid-syntax (measured 2026-10-04
#    committing executable_run-role.sh: 1 EXE001 plus 24 invalid-syntax
#    diagnostics). Selecting the input in the hook is ruff's documented
#    integration pattern.
#
#    Note on what types_or matches here: the runner's tags come from identify,
#    whose shebang detection requires the exec bit. Chezmoi sources carry the
#    exec bit in the executable_ name prefix and are mode 644 on disk, so
#    identify tags every bin/ script non-executable — the extensionless Python
#    scripts under home/bin/ are NOT matched by this filter. Their ruff
#    coverage is owned by the test suite, not by these hooks.
[[repos]]
repo = "https://github.com/astral-sh/ruff-pre-commit"
rev = "v0.16.9"

[[repos.hooks]]
id = "ruff-check"
types_or = ["python", "pyi"]

[[repos.hooks]]
id = "ruff-format"
types_or = ["python", "pyi"]

# 1b. Type checking (config: [tool.pyrefly] in pyproject.toml). System
#     install keeps CLI/IDE/hook on one pyrefly version; pyrefly checks project
#     state, not files, so pass_filenames is false by upstream design.
[[repos]]
repo = "https://github.com/facebook/pyrefly-pre-commit"
rev = "1.3.2"

[[repos.hooks]]
id = "pyrefly-check"
name = "Pyrefly (type checking)"
language = "system"
pass_filenames = false

# 2. Lint all shell scripts found anywhere in the repo.
[[repos]]
repo = "https://github.com/shellcheck-py/shellcheck-py"
rev = "v0.10.0.1"

[[repos.hooks]]
id = "shellcheck"
types = ["shell"]

# 2. Discover and run BATS tests for any staged shell script.
#    Convention: <subdir>/foo.sh → tests/foo.bats
#    Scripts with no matching .bats file are flagged by the runner.
[[repos]]
repo = "local"

[[repos.hooks]]
id = "bats"
name = "BATS — shell script tests"
language = "script"
entry = "scripts/run-bats.sh"
types = ["shell"]
exclude = '''
(?x)^(
  tests/|                       # test files are not subjects
  scripts/run-bats\.sh          # the runner itself
)$'''
# bin/ is chezmoi payload under home/bin/. scripts/ stays repo-only.
files = "^((home/)?bin|scripts)/"
# runner pulls staged files itself via git
pass_filenames = false
stages = ["pre-commit", "pre-push"]

# 2b. Local documentation links. The runner selects tracked Markdown
#     explicitly; Lychee's URL `exclude` does not exclude input documents.
[[repos]]
repo = "local"

[[repos.hooks]]
id = "docs-links-local"
name = "Documentation links — changed files (offline)"
language = "system"
entry = "python3 scripts/check-docs-links.py --changed"
files = '\.(md|mdx)$'
types = ["file"]
stages = ["pre-commit"]

[[repos.hooks]]
id = "docs-links-full"
name = "Documentation links — full corpus (offline)"
language = "system"
entry = "python3 scripts/check-docs-links.py"
pass_filenames = false
stages = ["pre-push"]

# 2d. Branch sync: a push whose branch no longer merges with main lands a
#     conflict on whoever merges next. Checking here makes it the pusher's
#     problem, while the fix is still small.
[[repos.hooks]]
id = "branch-sync"
name = "Branch sync — the branch still merges with main"
language = "system"
entry = "python3 scripts/check-branch-sync.py"
pass_filenames = false
always_run = true
stages = ["pre-push"]

# 2e. roborev's push flush, folded in so one owner covers pre-push.
#     roborev installs its own shim for this stage, which runs the flush and
#     nothing else — so every hook this file declares at pre-push was
#     configured but unreachable, including docs-links-full above. Carrying
#     the flush as an entry here keeps one owner for the stage. The trailing
#     "|| true" matches roborev's own shim: a daemon that is down must not
#     block a push.
[[repos.hooks]]
id = "roborev-flush"
name = "roborev - flush pending reviews before push"
language = "system"
entry = "sh -c 'command -v roborev >/dev/null 2>&1 && roborev post-commit --flush-push || true'"
pass_filenames = false
always_run = true
stages = ["pre-push"]

# 3. Message length must be proportional to the change it describes.
#    Thresholds come from the commit-hygiene skill, not from this repo's
#    history — see scripts/check_commit_proportionality.py for why that
#    distinction matters, and --calibrate to re-derive them.
[[repos]]
repo = "local"

[[repos.hooks]]
id = "commit-proportionality"
name = "commit message proportional to the change"
language = "system"
entry = "python3 scripts/check_commit_proportionality.py"
stages = ["commit-msg"]
pass_filenames = true

# 4. Queue integrity: backlog/ must stay machine-readable. The loader shadows
#    a duplicate id silently (core/repository.py), so a stale session
#    resurrecting an old task file name makes a real task invisible with no
#    error anywhere (observed twice 2026-10-27/28 — DOT-246). These tests fail
#    the commit instead.
[[repos]]
repo = "local"

[[repos.hooks]]
id = "queue-integrity"
name = "Queue integrity — backlog/ stays machine-readable"
language = "system"
entry = "uv run --frozen pytest tests/backlog -q"
files = "^backlog/"
# the tests inspect the tree themselves
pass_filenames = false