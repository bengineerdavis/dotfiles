repos:
  # 1. Lint and format all Python (config: [tool.ruff] in pyproject.toml).
  #    Pinned to the same ruff the machine runs (mise: 0.16.9).
  #    types_or: pre-commit passes every staged file to a hook by default, and
  #    ruff parses explicit paths as Python regardless of extension — a .sh
  #    script fails ruff-check with invalid-syntax (measured 2026-10-04
  #    committing executable_run-role.sh: 1 EXE001 plus 24 invalid-syntax
  #    diagnostics). Selecting the input in the hook is ruff's documented
  #    integration pattern.
  #
  #    Note on what types_or matches here: pre-commit's tags come from
  #    identify, whose shebang detection requires the exec bit. Chezmoi
  #    sources carry the exec bit in the executable_ name prefix and are
  #    mode 644 on disk, so identify tags every bin/ script non-executable —
  #    the extensionless Python scripts are NOT matched by this filter. Their
  #    ruff coverage is owned by the test suite (see TASKS.md), not by these
  #    hooks.
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.9
    hooks:
      - id: ruff-check
        types_or: [python, pyi]
      - id: ruff-format
        types_or: [python, pyi]

  # 1b. Type checking (config: [tool.pyrefly] in pyproject.toml). System
  #     install keeps CLI/IDE/hook on one pyrefly version; pass_filenames is
  #     false by upstream design - pyrefly checks project state, not files.
  - repo: https://github.com/facebook/pyrefly-pre-commit
    rev: 1.3.2
    hooks:
      - id: pyrefly-check
        name: Pyrefly (type checking)
        language: system

  # 2. Lint all shell scripts found anywhere in the repo
  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.10.0.1
    hooks:
      - id: shellcheck
        # Match bash/sh scripts anywhere — by extension or shebang
        types: [shell]

  # 2. Discover and run BATS tests for any staged shell script
  #    Convention: <subdir>/foo.sh → tests/foo.bats
  #    Scripts with no matching .bats file are flagged by the runner.
  - repo: local
    hooks:
      - id: bats
        name: BATS — shell script tests
        language: script
        entry: scripts/run-bats.sh
        types: [shell]
        exclude: >-
          (?x)^(
            tests/|                       # test files are not subjects
            scripts/run-bats\.sh          # the runner itself
          )$
        # bin/ at either payload root: root bin/ today, home/bin/ after
        # the .chezmoiroot move (TASKS.md § Planned, payload move step 3).
        files: ^((home/)?bin|scripts)/
        pass_filenames: false # runner pulls staged files itself via git
        stages: [pre-commit, pre-push]

  # 3. Message length must be proportional to the change it describes.
  #    Thresholds come from the commit-hygiene skill, not from this repo's
  #    history — see scripts/check_commit_proportionality.py for why that
  #    distinction matters, and --calibrate to re-derive them.
  - repo: local
    hooks:
      - id: commit-proportionality
        name: commit message proportional to the change
        language: system
        entry: python3 scripts/check_commit_proportionality.py
        stages: [commit-msg]
        pass_filenames: true
