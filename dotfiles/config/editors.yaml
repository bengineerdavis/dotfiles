# editors.yaml — the shared editor-extension catalogue.
#
# The data half of the system-config subscription model (adopted 2026-09-17;
# see TASKS-RESOLVED.md). Topics never read topics. An editor topic declares
# `topic_subscribes: [editors]` in its topic.yml; the parent playbook
# validates the catalogue, resolves the subscriber's slice, and injects it;
# the topic installs what it was handed and reports. Unresolvable verdicts
# fail at the playbook layer, before anything installs.
#
# Threshold for earning a NEW file in dotfiles/config/ — all four must hold:
#   1. A distinct domain of shared truth exists — a new *kind*, not more of
#      the same.
#   2. A subscriber exists or its wiring is queued — a topic declares
#      topic_subscribes to it. No speculative catalogues.
#   3. The truth is domain-owned, not topic-private — one topic's private
#      wants stay in that topic's own defaults.
#   4. It cannot join an existing catalogue without mixing domains —
#      different schema or semantics earns a new file, not a key bolted
#      into someone else's.
# Fold-back: when a catalogue's last subscriber goes, the file goes with it.
#
# Schema (per entry):
#   id        extension id, exactly as the editors' CLIs spell it
#   why       required; what it is for. "Review:" marks a drafted why the
#             author has not confirmed yet
#   editors   optional; absent = every subscriber (shared by default).
#             Structural exclusion: the playbook does not hand the entry
#             to editors outside this list
#   verdicts  per-consumer availability, dated. visual-studio-code "ok" is
#             by construction — this set is what that editor has installed.
#             cursor verdicts come from the Open VSX sweep of 2026-09-17.
#             A verdict is the dated evidence for the editors: scope, not a
#             second switch
#
# editor_extensions_ignored: extensions the installs will produce or refuse
# but which are NOT catalogue entries — expected extras (substituted builds)
# and documented non-installations. An id-diff drift report must expect
# these or they read as drift forever.
#
# Probe evidence: apps/cursor/CHANGELOG.md known_issues (Anysphere
# substitution, CLI facts — measured 2026-09-17).

