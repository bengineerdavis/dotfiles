# tasks.yaml - Ansible tasks to set up Starship prompt and Fira Code Nerd Font on macOS

---
# Starship topic tasks (Holman + Ansible, macOS only)
# - Installs starship and Fira Code Nerd Font
# - Optionally generates apps/starship/starship.toml from the nerd-font-symbols preset
# - Records that choice in preset_choice.yml (do not edit manually)
# - Symlinks ~/.config/starship.toml -> ~/dotfiles/apps/starship/starship.toml

- name: Set home path
  set_fact:
    home: "{{ lookup('env', 'HOME') }}"
  # Normalize $HOME into a fact so all later tasks use the same base path.

- name: Install Starship via Homebrew (macOS only)
  homebrew:
    name: starship
    state: present
  when: ansible_facts['system'] == "Darwin"
  # Ensure the starship binary is installed before we reference it anywhere.

- name: Install Fira Code Nerd Font via Homebrew Cask (macOS only)
  homebrew_cask:
    name: font-fira-code-nerd-font
    state: present
  when: ansible_facts['system'] == "Darwin"
  # Install the Fira Code Nerd Font so starship’s Nerd Font symbols render correctly.

- name: Verify Fira Code font installation (macOS only)
  command: "sh -c 'fc-list :family | grep -iq \"Fira Code\"'"
  register: font_check
  changed_when: false
  ignore_errors: true
  when: ansible_facts['system'] == "Darwin"
  # Quietly check that Fira Code is visible to fontconfig.
  # Never fails the play; we use font_check.rc later for messages.

- name: Create Starship config directory (macOS only)
  file:
    path: "{{ home }}/.config"
    state: directory
    mode: "0755"
  when: ansible_facts['system'] == "Darwin"
  # Make sure ~/.config exists before creating ~/.config/starship.toml.

# --- Preset generation & preference tracking ---------------------------------
# Controls how apps/starship/starship.toml is created and updated.
# If starship.toml is missing in ~/dotfiles/apps/starship, we can offer to generate
# it from the nerd-font-symbols preset. We also write preset_choice.yml to remember
# that this file came from that preset and when. You generally should NOT edit
# preset_choice.yml manually; it’s meant as automation state.

- name: Check if repo starship.toml exists
  stat:
    path: "{{ home }}/dotfiles/apps/starship/starship.toml"
  register: repo_starship
  when: ansible_facts['system'] == "Darwin"
  # Detect whether you already have a tracked apps/starship/starship.toml in the repo.

- name: Check if preset preference file exists
  stat:
    path: "{{ home }}/dotfiles/apps/starship/preset_choice.yml"
  register: preset_choice
  when: ansible_facts['system'] == "Darwin"
  # Detect existing preset_choice.yml (our state file).

- name: Ask whether to generate starship.toml from nerd-font-symbols preset
  pause:
    prompt: "No dotfiles/apps/starship/starship.toml found. Generate it from 'nerd-font-symbols' preset? [y/N]"
  register: preset_answer
  when:
    - ansible_facts['system'] == "Darwin"
    - not repo_starship.stat.exists
  # Interactive prompt: only runs if starship.toml is missing in the repo.

- name: Generate starship.toml from nerd-font-symbols preset
  command: >
    sh -c 'mkdir -p "{{ home }}/dotfiles/apps/starship" &&
           cd "{{ home }}/dotfiles/apps/starship" &&
           starship preset nerd-font-symbols -o starship.toml'
  when:
    - ansible_facts['system'] == "Darwin"
    - not repo_starship.stat.exists
    - preset_answer.user_input | default('n') | lower == 'y'
  # If you answered "y", this runs the preset command and writes
  # dotfiles/apps/starship/starship.toml into your repo checkout.

- name: Save preset choice
  copy:
    dest: "{{ home }}/dotfiles/apps/starship/preset_choice.yml"
    content: |
      # -------------------------------------------------------------------
      # This file is auto-generated by the "starship" Ansible topic.
      #
      # Purpose:
      #   - Record which Starship preset was used to generate
      #     apps/starship/starship.toml.
      #   - Record when that generation last occurred.
      #
      # Why you generally should NOT edit this file by hand:
      #   - It is treated as automation state.
      #   - The Ansible tasks assume the structure below.
      #   - If you want to change presets or refresh from the preset,
      #     re-run the starship topic and answer the prompts instead.
      #
      # Safe ways to change behavior:
      #   - To regenerate starship.toml from the same preset:
      #       re-run the starship topic and choose to refresh.
      #   - To switch to a different preset:
      #       update the Ansible tasks, then re-run and regenerate.
      #
      # If you manually edit this file:
      #   - Your edits may be overwritten by future Ansible runs.
      #   - Your edits may be ignored if they don’t match what the tasks expect.
      # -------------------------------------------------------------------
      preset: nerd-font-symbols   # Name of the Starship preset used.
      last_updated: "{{ ansible_date_time.iso8601 }}"  # When starship.toml was generated.
  when:
    - ansible_facts['system'] == "Darwin"
    - not repo_starship.stat.exists
    - preset_answer.user_input | default('n') | lower == 'y'
  # This is the only place preset_choice.yml is created/updated.

# Optional: allow updating preset even if starship.toml already exists.

- name: Ask whether to refresh starship.toml from preset (if already exists)
  pause:
    prompt: "dotfiles/apps/starship/starship.toml exists. Refresh it from 'nerd-font-symbols' preset? [y/N]"
  register: preset_refresh_answer
  when:
    - ansible_facts['system'] == "Darwin"
    - repo_starship.stat.exists
  # Lets you opt in to overwriting your existing config with the current preset.

- name: Refresh starship.toml from nerd-font-symbols preset
  command: >
    sh -c 'cd "{{ home }}/dotfiles/apps/starship" &&
           starship preset nerd-font-symbols -o starship.toml'
  when:
    - ansible_facts['system'] == "Darwin"
    - repo_starship.stat.exists
    - preset_refresh_answer.user_input | default('n') | lower == 'y'
  # If you say "y" here, your repo’s starship.toml is regenerated from the preset.

# --- Symlink into ~/.config --------------------------------------------------

- name: Symlink starship.toml from dotfiles repo (macOS only)
  file:
    src: "{{ home }}/dotfiles/apps/starship/starship.toml"
    dest: "{{ home }}/.config/starship.toml"
    state: link
    force: true
    follow: false
  when: ansible_facts['system'] == "Darwin"
  # This is the link Starship actually reads:
  #   ~/.config/starship.toml -> ~/dotfiles/apps/starship/starship.toml

- name: Confirm Starship symlink and Fira Code readiness (macOS only)
  debug:
    msg: "✅ Starship config linked from dotfiles/apps/starship/starship.toml and Fira Code detected."
  when: ansible_facts['system'] == "Darwin" and font_check.rc == 0
  # Friendly confirmation that:
  # - The symlink is in place.
  # - Fira Code was detected by fc-list.

- name: Warn if Fira Code font not detected (macOS only)
  debug:
    msg: "⚠️ Fira Code font not detected. Ensure it's installed and selected in your terminal profile."
  when: ansible_facts['system'] == "Darwin" and font_check.rc != 0
  # If the font check failed, we don’t break the run; we just warn.
