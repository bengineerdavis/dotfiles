---
# apps/uv/tests/topic-metadata.yaml asserts the topic.yml contract the
# parent playbook and the future topic CLI rely on. Same shape as
# apps/1password's.

- name: "Test uv topic metadata"
  hosts: localhost
  connection: local
  gather_facts: false
  become: false

  vars:
    uv_topic_file: "{{ playbook_dir }}/../topic.yml"

  tasks:
    - name: "Load topic.yml"
      ansible.builtin.slurp:
        src: "{{ uv_topic_file }}"
      register: uv_topic_raw

    - name: "Parse topic.yml"
      ansible.builtin.set_fact:
        uv_topic: "{{ uv_topic_raw.content | b64decode | from_yaml }}"

    - name: "Assert required keys are present and valid"
      ansible.builtin.assert:
        that:
          - uv_topic.topic_name == 'uv'
          - uv_topic.topic_tier == 'app'
          - "'Debian' in uv_topic.topic_os"
          - "'Darwin' in uv_topic.topic_os"
          - "'uv' in uv_topic.topic_provides"
          - uv_topic.topic_requires | length == 0
        success_msg: "PASS: uv topic metadata is valid"
        fail_msg: |
          FAIL: topic metadata invalid:
          {{ uv_topic | to_nice_json }}
