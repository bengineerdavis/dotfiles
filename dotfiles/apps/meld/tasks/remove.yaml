# ── Linux (apt) ─────────────────────────────────────────────────────────────────
# - name: "Remove meld via apt (Linux)"
#   ansible.builtin.apt:
#     name: meld
    state: absent
  become: true
  when: ansible_facts['os_family'] == 'Debian'

