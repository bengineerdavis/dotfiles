---
# apps/visual-studio-code/tasks/install.yaml
# Install the cask, then the editor's extension slice from the shared
# catalogue. The slice read here is the INTERIM contract (author direction
# 2026-09-17): a role-relative direct read of dotfiles/config/editors.yaml.
# The subscription machinery queued in TASKS.md § Planned replaces this read
# with topic_subscribes + an injected var, and that switch must be a no-op
# on a converged machine.

# ── macOS (Homebrew Cask) ─────────────────────────────────────────────────────
- name: "Install visual-studio-code via Homebrew Cask (macOS)"
  community.general.homebrew_cask:
    name: visual-studio-code
    state: present
    install_options: "appdir={{ user_appdir }}"
  when: ansible_facts['os_family'] == 'Darwin'

# ── Editor extensions from the shared catalogue ──────────────────────────────
- name: "Guard: the editors catalogue exists"
  ansible.builtin.stat:
    path: "{{ vscode_catalogue_path }}"
  register: vscode_catalogue_stat

- name: "Fail with the fix when the catalogue is missing"
  ansible.builtin.fail:
    msg: >-
      {{ vscode_catalogue_path }} not found. The shared editors catalogue is
      expected at dotfiles/config/editors.yaml in this checkout — restore it
      or re-clone. Nothing has been installed or changed.
  when: not vscode_catalogue_stat.stat.exists

- name: "Guard: the code CLI resolves"
  ansible.builtin.command: code --version
  changed_when: false

- name: "Load the editors catalogue"
  ansible.builtin.include_vars:
    file: "{{ vscode_catalogue_path }}"
    name: vscode_catalogue

- name: "Resolve this editor's slice of the catalogue"
  ansible.builtin.set_fact:
    # The parens matter: without them the trailing reject binds only to the
    # extras term (Jinja filters bind tighter than the + operator) and the
    # ignored list would not filter the shared slice.
    vscode_extension_ids: >-
      {{ ( vscode_catalogue.editor_extensions
           | rejectattr('editors', 'defined')
           | map(attribute='id') | list
         + (vscode_catalogue.editor_extensions
            | selectattr('editors', 'defined')
            | selectattr('editors', 'contains', 'visual-studio-code')
            | map(attribute='id') | list)
         + (vscode_extra_extensions | map(attribute='id') | list) )
         | reject('in', vscode_ignored_extensions) | list }}

- name: "List installed extensions (empty output is a valid state)"
  ansible.builtin.command: code --list-extensions
  changed_when: false
  register: vscode_installed_list

- name: "Compute the missing installs"
  ansible.builtin.set_fact:
    vscode_extension_missing: >-
      {{ vscode_extension_ids
         | difference(vscode_installed_list.stdout_lines | default([], true)) }}

- name: "Install the missing extensions"
  ansible.builtin.command: "code --install-extension {{ item }}"
  loop: "{{ vscode_extension_missing }}"
  register: vscode_install_results
  # The task only runs on ids the list step did not find, so running it at
  # all is the change. Failures are collected and raised once, below.
  changed_when: true
  failed_when: false

- name: "Collect the unresolved installs"
  ansible.builtin.set_fact:
    vscode_extension_failures: >-
      {{ vscode_install_results.results | default([], true)
         | selectattr('rc', 'defined')
         | selectattr('rc', 'ne', 0)
         | map(attribute='item') | list }}

- name: "Report the verdict per entry"
  ansible.builtin.debug:
    msg: >-
      {{ item }}:
      {{- ' FAILED' if item in vscode_extension_failures
         else ('installed' if item in vscode_extension_missing
               else 'already present') }}
  loop: "{{ vscode_extension_ids }}"
  loop_control:
    label: "{{ item }}"
  changed_when: false

- name: "Fail once, naming every unresolved install"
  ansible.builtin.fail:
    msg: >-
      {{ vscode_extension_failures | length }} extension(s) failed to
      install: {{ vscode_extension_failures | join(', ') }}. Check the
      dated verdicts in dotfiles/config/editors.yaml — a missing Open VSX
      entry needs an editors: scope or an ignored verdict, decided by the
      author. Installs that succeeded are kept.
  when: vscode_extension_failures | length > 0
