# apps/visual-studio-code/tasks/remove.yaml
# Explicit uninstall tasks. Never run as part of provision or install.
# Only invoked via --tags remove.
# Mirror the install.yaml structure — one block per package manager.

# ── macOS (Homebrew Cask) ───────────────────────────────────────────────────
- name: "Remove visual-studio-code via Homebrew Cask (macOS)"
  community.general.homebrew_cask:
    name: visual-studio-code
    state: absent
  when: ansible_facts['os_family'] == 'Darwin'

# ── Linux (apt) ──────────────────────────────────────────────────────────────
- name: "Remove visual-studio-code via apt (Linux)"
  ansible.builtin.apt:
    name: code
    state: absent
  become: true
  when: ansible_facts['os_family'] == 'Debian'
