# apps/clamav/tasks/install.yaml
# Package installation and the state clamav needs to actually run.
# Do NOT put upgrade logic here — signature refresh is owned by upgrade.yaml.
#
# Note on convention: docs/CONVENTIONS.md says config belongs to chezmoi. This topic
# renders its own config anyway, because clamd.conf and freshclam.conf live under
# {{ clamav_brew_prefix }}/etc — outside $HOME, where chezmoi does not reach — and the
# scan script must stay byte-consistent with them (see the socket note in README.md).
# Every artefact created here has a matching teardown in remove.yaml.
---
# ── macOS (Homebrew) ──────────────────────────────────────────────────────────
- name: "Install clamav via Homebrew (macOS)"
  community.general.homebrew:
    name: clamav
    state: present
  become: false
  when: ansible_facts['os_family'] == 'Darwin'

# ── Linux (apt) ───────────────────────────────────────────────────────────────
# `clamav` only — deliberately NOT `clamav-daemon`.
#
# That package runs an always-on system clamd, which is the opposite of what this
# topic does: it starts clamd for a scan and stops it afterwards to hand back the
# ~1.3 GB of resident signature data (step 5 of the scan script). Installing both
# would leave a second daemon holding that memory around the clock.
#
# The `clamav` package still ships clamd, clamdscan, clamscan and freshclam, so
# only the always-on service is skipped, not the tooling.
- name: "Install clamav via apt (Debian)"
  ansible.builtin.apt:
    name: clamav
    state: present
    update_cache: true
  become: true
  when: ansible_facts['os_family'] == 'Debian'

# fangfrisch is NOT installed here. apps/mise declares `"pipx:fangfrisch" = "latest"`
# in files/config.toml and owns the binary. This topic owns only its configuration and
# invocation, which are clamav-specific.
- name: "Verify the fangfrisch shim mise provides is present"
  ansible.builtin.stat:
    path: "{{ clamav_fangfrisch_bin }}"
  register: clamav_fangfrisch_stat

- name: "Warn when fangfrisch is missing"
  ansible.builtin.debug:
    msg: >-
      fangfrisch was not found at {{ clamav_fangfrisch_bin }}. Third-party signature
      feeds (urlhaus, sanesecurity, interserver) will not refresh. Run the mise topic,
      or `mise install`, then re-run this topic.
  when: not clamav_fangfrisch_stat.stat.exists

# ── Directories ───────────────────────────────────────────────────────────────
- name: "Create the clamav automation directory"
  ansible.builtin.file:
    path: "{{ clamav_automation_dir }}"
    state: directory
    mode: "0700"

- name: "Ensure the signature database directory exists"
  ansible.builtin.file:
    path: "{{ clamav_db_dir }}"
    state: directory
    mode: "0755"

# ── Configuration ─────────────────────────────────────────────────────────────
- name: "Render freshclam.conf"
  ansible.builtin.template:
    src: freshclam.conf.j2
    dest: "{{ clamav_etc_dir }}/freshclam.conf"
    mode: "0644"

- name: "Render clamd.conf"
  ansible.builtin.template:
    src: clamd.conf.j2
    dest: "{{ clamav_etc_dir }}/clamd.conf"
    mode: "0644"
  register: clamav_clamd_conf

- name: "Render fangfrisch.conf"
  ansible.builtin.template:
    src: fangfrisch.conf.j2
    dest: "{{ clamav_fangfrisch_conf }}"
    mode: "0600"

# force: false is the point — this file records findings you have reviewed and accepted,
# so re-running the role must never overwrite it. It ships empty: nothing is pre-accepted
# on your behalf, and the first run will list every current finding for explicit review.
- name: "Install the findings baseline (once; never overwritten)"
  ansible.builtin.template:
    src: baseline.tsv.j2
    dest: "{{ clamav_baseline }}"
    mode: "0600"
    force: false

# ── Scan script and schedule ──────────────────────────────────────────────────
- name: "Install the daily maintenance script"
  ansible.builtin.template:
    src: daily_scan.sh.j2
    dest: "{{ clamav_scan_script }}"
    mode: "0755"

- name: "Install the clamav launchd agent"
  ansible.builtin.template:
    src: com.user.clamscan.plist.j2
    dest: "{{ clamav_agent_plist }}"
    mode: "0644"
  register: clamav_agent_file
  when: ansible_facts['os_family'] == 'Darwin'

# A rendered plist needs a full bootout/bootstrap cycle, not a reload — launchd caches
# the parsed job. Same pattern as apps/ollama.
- name: "Reload the clamav launchd agent"
  ansible.builtin.shell: |
    launchctl bootout gui/$(id -u)/{{ clamav_agent_label }} 2>/dev/null || true
    launchctl bootstrap gui/$(id -u) "{{ clamav_agent_plist }}"
    launchctl enable gui/$(id -u)/{{ clamav_agent_label }}
  args:
    executable: /bin/bash
  changed_when: true
  when:
    - ansible_facts['os_family'] == 'Darwin'
    - clamav_agent_file.changed

# ── Linux (systemd user timer) ────────────────────────────────────────────────
# A user timer, matching the per-user launchd agent: the scan covers your files
# and runs as you. See apps/lynis for the same pattern.
- name: "Create the systemd user unit directory"
  ansible.builtin.file:
    path: "{{ clamav_systemd_user_dir }}"
    state: directory
    mode: "0755"
  when: ansible_facts['os_family'] == 'Debian'

- name: "Install the clamav systemd service and timer"
  ansible.builtin.template:
    src: "{{ item.src }}"
    dest: "{{ item.dest }}"
    mode: "0644"
  loop:
    - { src: clamav-scan.service.j2, dest: "{{ clamav_service_unit }}" }
    - { src: clamav-scan.timer.j2, dest: "{{ clamav_timer_unit }}" }
  register: clamav_units
  when: ansible_facts['os_family'] == 'Debian'

# systemd caches parsed units, so an edited template needs a reload before enable
# sees it — the counterpart to the bootout/bootstrap cycle above.
- name: "Reload the systemd user daemon"
  ansible.builtin.systemd:
    daemon_reload: true
    scope: user
  when:
    - ansible_facts['os_family'] == 'Debian'
    - clamav_units.changed

- name: "Enable and start the clamav scan timer"
  ansible.builtin.systemd:
    name: clamav-scan.timer
    enabled: true
    state: started
    scope: user
  when: ansible_facts['os_family'] == 'Debian'

# The distro's own always-on daemon would hold the signature memory this topic
# exists to release, and apt may have pulled it in as a recommend. Report rather
# than disable it: stopping another package's service is outside this topic's
# ownership, and the user may want it deliberately.
- name: "Check whether the distro clamav-daemon service is active"
  ansible.builtin.command:
    cmd: systemctl is-active clamav-daemon
  register: clamav_distro_daemon
  changed_when: false
  failed_when: false
  when: ansible_facts['os_family'] == 'Debian'

- name: "Warn that the distro clamav-daemon is running alongside this topic"
  ansible.builtin.debug:
    msg: >-
      clamav-daemon is active. This topic starts and stops its own clamd per scan
      to release ~1.3 GB of signature memory, so an always-on system daemon
      defeats that. If you did not want it:
      sudo systemctl disable --now clamav-daemon
  when:
    - ansible_facts['os_family'] == 'Debian'
    - (clamav_distro_daemon.stdout | default('')) | trim == 'active'

- name: "Note that the timer needs lingering to fire without a login session"
  ansible.builtin.debug:
    msg: >-
      clamav-scan.timer is a systemd *user* timer. Without lingering it only
      fires while you are logged in. For an unattended host run:
      sudo loginctl enable-linger {{ ansible_facts['env']['USER'] }}
  when: ansible_facts['os_family'] == 'Debian'

# ── One-time repair of the unmanaged setup ────────────────────────────────────
# The previous hand-rolled script pointed its SHUTDOWN at /tmp/clamd.socket, which
# never existed, so clamd was never stopped and sat resident for weeks holding ~1.3 GB.
# If such a process is still running against the old socket, stop it once here; from now
# on daily_scan.sh shuts down the daemon it started.
- name: "Check for a clamd left resident by the unmanaged setup"
  ansible.builtin.command: pgrep -x clamd
  register: clamav_stale_clamd
  changed_when: false
  failed_when: false

- name: "Stop the stale clamd so its resident signature memory is released"
  ansible.builtin.shell: |
    if [ -S "{{ clamav_socket }}" ]; then
      printf 'SHUTDOWN\n' | nc -U "{{ clamav_socket }}" >/dev/null 2>&1 || true
    fi
    sleep 2
    pkill -x clamd 2>/dev/null || true
  args:
    executable: /bin/bash
  changed_when: true
  when:
    - clamav_stale_clamd.rc == 0
    - clamav_clamd_conf.changed

# ── Signatures ────────────────────────────────────────────────────────────────
- name: "Check whether a signature database is already present"
  ansible.builtin.stat:
    path: "{{ clamav_db_dir }}/daily.cld"
  register: clamav_daily_cld

- name: "Check for the packaged daily.cvd as an alternative"
  ansible.builtin.stat:
    path: "{{ clamav_db_dir }}/daily.cvd"
  register: clamav_daily_cvd

# Without signatures clamd refuses to start at all, so seed them on a fresh machine.
# Routine refresh belongs to upgrade.yaml.
- name: "Seed the signature database (first install only)"
  ansible.builtin.command: "{{ clamav_brew_prefix }}/bin/freshclam --quiet"
  register: clamav_seed
  changed_when: clamav_seed.rc == 0
  failed_when: clamav_seed.rc not in [0, 1]
  when:
    - not clamav_daily_cld.stat.exists
    - not clamav_daily_cvd.stat.exists
