# tasks.yaml

# put all of the non-dotfile configuration and setup work to be done for this app here. 
# This file will be included in the main playbook.yaml file, so you can use all 
# of the same Ansible modules and features as you would in a normal playbook.

- name: Ensure ghostty is installed via Homebrew cask
  community.general.homebrew_cask:
    name: ghostty
    state: present

- name: Check for ghostty config directory
  ansible.builtin.stat:
    path: "{{ ansible_facts['env']['HOME'] }}/.config/ghostty"
  register: ghostty_config_dir

- name: Create ghostty config directory if absent
  ansible.builtin.file:
    path: "{{ ansible_facts['env']['HOME'] }}/.config/ghostty"
    state: directory
    mode: "0755"
    owner: "{{ ansible_facts['user_id'] | default(ansible_facts['env']['USER']) }}"
  when: not ghostty_config_dir.stat.exists

- name: Ensure default config file exists in dotfiles
  ansible.builtin.file:
    path: "{{ ansible_facts['env']['HOME'] }}/dotfiles/apps/ghostty/config"
    state: touch
    mode: "0644"
    modification_time: preserve
    access_time: preserve
  # This ensures we don't overwrite an existing config, just create it if missing

- name: Symlink ghostty config from dotfiles
  ansible.builtin.file:
    src: "{{ ansible_facts['env']['HOME'] }}/dotfiles/apps/ghostty/config"
    dest: "{{ ansible_facts['env']['HOME'] }}/.config/ghostty/config"
    state: link
    force: yes
    owner: "{{ ansible_facts['user_id'] | default(ansible_facts['env']['USER']) }}"

