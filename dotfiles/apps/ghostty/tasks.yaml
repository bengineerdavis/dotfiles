#     name:  # {{ put package name here}}
#     state: present

- name: Ensure ghostty is installed via Homebrew cask
  community.general.homebrew_cask:
    name: ghostty
    state: present

- name: Check for ghostty config directory
  stat:
    path: "{{ ansible_facts['env']['HOME'] }}/.config/ghostty"
  register: ghostty_config_dir

- name: Create ghostty config directory if absent
  file:
    path: "{{ ansible_facts['env']['HOME'] }}/.config/ghostty"
    state: directory
    mode: "0755"
    owner: "{{ ansible_facts['user_id'] | default(ansible_facts['env']['USER']) }}"
  when: not ghostty_config_dir.stat.exists

- name: Check for ghostty config file
  stat:
    path: "{{ ansible_facts['env']['HOME'] }}/.config/ghostty/config"
  register: ghostty_config_file

- name: Create ghostty config file if absent
  file:
    path: "{{ ansible_facts['env']['HOME'] }}/.config/ghostty/config"
    state: touch
    mode: "0644"
    owner: "{{ ansible_facts['user_id'] | default(ansible_facts['env']['USER']) }}"
  when: not ghostty_config_file.stat.exists