# apps/rancher-desktop/tasks/path-management.yaml
#
# Shared by install.yaml and upgrade.yaml so the two cannot drift. Both need it:
# install sets the strategy the first time, and an UPDATE re-applies Rancher's
# rc-file injection, so the upgrade pass has to re-assert it.
#
# Two steps, in this order and not the other:
#   1. set pathManagementStrategy = manual   (stop the cause)
#   2. remove the blocks already injected    (clean up the effect)
#
# Stripping first would be pointless while the app is running with `rcfiles`:
# Rancher re-injects on launch, so the cleanup would be undone before anyone
# noticed. See defaults/main.yaml for why `manual` is the wanted value.
#
# Ownership: ~/.zshrc belongs to chezmoi, and this topic does not write it. What
# it removes is a block Rancher itself emitted, bounded by Rancher's own markers,
# as a direct consequence of this topic installing the cask. Cleaning up state
# your own install triggered is not a second owner — it is the CRUD invariant in
# docs/TOPICS.md applied honestly.

- name: "Rancher: read the current pathManagementStrategy"
  ansible.builtin.slurp:
    src: "{{ rancher_settings_json }}"
  register: rancher_settings_raw
  failed_when: false
  when: ansible_facts['os_family'] == 'Darwin'

- name: "Rancher: resolve the current strategy (absent settings file is fine)"
  ansible.builtin.set_fact:
    rancher_current_strategy: >-
      {{ (rancher_settings_raw.content | default('') | b64decode | from_json)
         .get('application', {}).get('pathManagementStrategy', 'unknown')
         if (rancher_settings_raw.content is defined) else 'unknown' }}
  when: ansible_facts['os_family'] == 'Darwin'

- name: "Rancher: report the strategy this run found"
  ansible.builtin.debug:
    msg: >-
      pathManagementStrategy is '{{ rancher_current_strategy }}'
      (want '{{ rancher_path_management_strategy }}').
      {{ "Nothing to do." if rancher_current_strategy == rancher_path_management_strategy
         else "Will set it via rdctl, Rancher's own CLI." }}
  when: ansible_facts['os_family'] == 'Darwin'

- name: "Rancher: check for rdctl"
  ansible.builtin.stat:
    path: "{{ rancher_rdctl }}"
  register: rancher_rdctl_stat
  when: ansible_facts['os_family'] == 'Darwin'

# rdctl talks to the running app's API, which is also what makes it the correct
# tool: the app persists the change itself, so nothing here races its writer.
- name: "Rancher: set pathManagementStrategy via rdctl"
  ansible.builtin.command:
    cmd: >-
      {{ rancher_rdctl }} set
      --application.path-management-strategy {{ rancher_path_management_strategy }}
  register: rancher_rdctl_set
  failed_when: false
  changed_when: rancher_rdctl_set.rc == 0
  when:
    - ansible_facts['os_family'] == 'Darwin'
    - rancher_rdctl_stat.stat.exists | default(false)
    - rancher_current_strategy != rancher_path_management_strategy

# rdctl exits non-zero when the app is not running. That is not a failure worth
# stopping the play for — the strategy is still wrong, so say so and let the
# next run (or a launch of the app) settle it. Silence here would mean the block
# quietly comes back and nobody knows why.
- name: "Rancher: report that rdctl could not reach the app"
  ansible.builtin.debug:
    msg: >-
      [rancher] Could not set pathManagementStrategy — rdctl exited
      {{ rancher_rdctl_set.rc }}. rdctl needs Rancher Desktop to be RUNNING,
      because it talks to the app's API. Launch Rancher Desktop and re-run
      `--tags install` (or `--tags upgrade`). Until then Rancher will keep
      re-injecting its PATH block into your shell rc files on every launch.
      stderr: {{ rancher_rdctl_set.stderr | default('') | trim }}
  when:
    - ansible_facts['os_family'] == 'Darwin'
    - rancher_rdctl_set is defined
    - rancher_rdctl_set.rc is defined
    - rancher_rdctl_set.rc != 0

- name: "Rancher: report that rdctl is not installed yet"
  ansible.builtin.debug:
    msg: >-
      [rancher] rdctl not found at {{ rancher_rdctl }} — Rancher Desktop has not
      completed its first launch. Open the app once, then re-run this topic to
      set pathManagementStrategy and stop the rc-file injection.
  when:
    - ansible_facts['os_family'] == 'Darwin'
    - not (rancher_rdctl_stat.stat.exists | default(false))

# ── Remove the blocks Rancher already wrote ─────────────────────────────────
# blockinfile with Rancher's exact markers, so only Rancher's own output is
# touched and the surrounding file is left byte-for-byte alone. Idempotent: a
# file without the markers is unchanged.
#
# Runs regardless of whether the strategy change succeeded. If it did, this is
# the final cleanup; if it did not, this still removes today's duplicate and the
# report above explains why it will return.
- name: "Rancher: strip the injected PATH block from shell rc files"
  ansible.builtin.blockinfile:
    path: "{{ ansible_facts['env']['HOME'] }}/{{ item }}"
    marker: "### MANAGED BY RANCHER DESKTOP {mark} (DO NOT EDIT)"
    marker_begin: "START"
    marker_end: "END"
    state: absent
  loop: "{{ rancher_rc_files }}"
  loop_control:
    label: "~/{{ item }}"
  register: rancher_rc_stripped
  # A file that does not exist is not a problem — Rancher only writes the rc
  # files for shells you actually have.
  failed_when: false
  when:
    - ansible_facts['os_family'] == 'Darwin'
    - rancher_strip_rc_blocks | bool

- name: "Rancher: report which rc files were cleaned"
  ansible.builtin.debug:
    msg: >-
      [rancher] Removed Rancher's injected PATH block from
      {{ (rancher_rc_stripped.results | default([]) | selectattr('changed', 'defined')
          | selectattr('changed') | map(attribute='item') | list) | join(', ') }}.
      ~/.rd/bin stays on PATH via files/zsh/path.zsh, which this topic owns.
  when:
    - ansible_facts['os_family'] == 'Darwin'
    - rancher_strip_rc_blocks | bool
    - (rancher_rc_stripped.results | default([]) | selectattr('changed', 'defined')
       | selectattr('changed') | list | length) > 0
