# apps/rancher-desktop/tasks/remove.yaml
# Explicit uninstall tasks. Never run as part of provision or install.
# Only invoked via --tags remove.
# Mirror the install.yaml structure — one block per package manager.

# ── PATH ownership teardown ──────────────────────────────────────────────────
# Runs BEFORE the cask is removed, while rdctl and the app still exist.
#
# We remove the injected blocks but deliberately do NOT restore
# pathManagementStrategy to Rancher's `rcfiles` default. The CRUD invariant in
# docs/TOPICS.md says teardown reverses what install created, and this is the
# reasoned exception: setting `rcfiles` on the way out would invite Rancher to
# re-inject PATH blocks into six shell rc files for an app that is being
# uninstalled — actively worse than leaving the setting alone. The setting also
# lives in Rancher's own config, which goes away with the app.
- name: "Rancher: strip any injected PATH block from shell rc files"
  ansible.builtin.blockinfile:
    path: "{{ ansible_facts['env']['HOME'] }}/{{ item }}"
    marker: "### MANAGED BY RANCHER DESKTOP {mark} (DO NOT EDIT)"
    marker_begin: "START"
    marker_end: "END"
    state: absent
  loop: "{{ rancher_rc_files }}"
  loop_control:
    label: "~/{{ item }}"
  failed_when: false
  when: ansible_facts['os_family'] == 'Darwin'

# ── macOS (Homebrew Cask) ─────────────────────────────────────────────────────
- name: "Remove Rancher Desktop via Homebrew Cask (macOS)"
  community.general.homebrew_cask:
    name: rancher
    state: absent
  when: ansible_facts['os_family'] == 'Darwin'

# ── Linux (apt, OPTIONAL playground) ──────────────────────────────────────────
# Teardown for the optional Linux install above. Not gated by the enable flag —
# removal is always allowed. Run with -K to supply the sudo password.
- name: "Remove Rancher Desktop (Linux playground)"
  when: ansible_facts['os_family'] == 'Debian'
  become: true
  block:
    - name: "Linux: uninstall rancher-desktop package"
      ansible.builtin.apt:
        name: rancher-desktop
        state: absent

    - name: "Linux: drop Rancher Desktop OBS apt repository"
      ansible.builtin.apt_repository:
        repo: >-
          deb [signed-by=/usr/share/keyrings/isv-rancher-stable-archive-keyring.gpg]
          https://download.opensuse.org/repositories/isv:/Rancher:/stable/deb/ ./
        filename: isv-rancher-stable
        state: absent

    - name: "Linux: drop Rancher Desktop OBS signing key"
      ansible.builtin.file:
        path: /usr/share/keyrings/isv-rancher-stable-archive-keyring.gpg
        state: absent
