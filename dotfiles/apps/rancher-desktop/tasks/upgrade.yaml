# apps/rancher-desktop/tasks/upgrade.yaml
# Topic-level upgrade tasks. Refresh state this topic owns.
#
# The cask binary itself is refreshed by apps/homebrew's `brew upgrade` pass, so
# nothing here installs anything. What this pass exists for is the one piece of
# state a brew upgrade actively UNDOES: a Rancher Desktop update re-applies its
# rc-file PATH injection, putting the "### MANAGED BY RANCHER DESKTOP" block
# back into every shell rc file it recognises.
#
# So the strategy has to be re-asserted after every update, not just at install.
# That is the whole reason this file is not a no-op like most app-tier topics.
#
# Idempotent: safe to re-run. No confirmation needed.
# Do NOT put install or remove logic here.

- name: "Rancher: re-assert PATH ownership after an update"
  ansible.builtin.import_tasks: path-management.yaml
