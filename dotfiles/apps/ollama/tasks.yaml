# tasks.yaml

# put all of the non-dotfile configuration and setup work to be done for this app here. 
# This file will be included in the main playbook.yaml file, so you can use all 
# of the same Ansible modules and features as you would in a normal playbook.
#
# The end-result is all the steps outside of what's defined in the .zsh files are completed
# by this file, when run, the app will work immediately out of the box.


# --- OS / hardware requirements ------------------------------------------------

- name: Fail if macOS version is below 14 (Sonoma)
  ansible.builtin.fail:
    msg: >
      Ollama requires macOS 14 (Sonoma) or newer. Current version: {{ ansible_facts['distribution_version'] }}.
  when:
    - ansible_facts['os_family'] == "Darwin"
    - (ansible_facts['distribution_major_version'] | int) < 14
  tags: ollama_requirements

- name: Fail if not running on Apple Silicon or Intel macOS
  ansible.builtin.fail:
    msg: >
      Ollama requires Apple M‑series (recommended) or Intel x86 macOS.
      Detected architecture: {{ ansible_facts['architecture'] }}.
  when:
    - ansible_facts['os_family'] == "Darwin"
    - ansible_facts['architecture'] not in ["arm64", "x86_64"]
  tags: ollama_requirements


# --- Resource checks (RAM + disk) ---------------------------------------------

- name: Warn if memory may limit model sizes
  ansible.builtin.debug:
    msg: >
      WARNING: This Mac has {{ (ansible_facts['memtotal_mb'] / 1024) | round(1) }} GB RAM.
      8–12 GB is best for 3–8B models; 16 GB+ recommended for 13B+ models.
      Consider starting with 7–8B models on 8 GB systems.
  when:
    - ansible_facts['os_family'] == "Darwin"
    - (ansible_facts['memtotal_mb'] | int) < 16384
  tags: ollama_resources

- name: Check free disk space (home volume) in KB
  ansible.builtin.shell: |
    df -k "{{ ansible_facts['env']['HOME'] }}" | awk 'NR==2 {print $4}'
  register: ollama_free_kb
  changed_when: false
  when: ansible_facts['os_family'] == "Darwin"
  tags: ollama_resources

- name: Set fact for free disk space in MB
  ansible.builtin.set_fact:
    ollama_free_mb: "{{ (ollama_free_kb.stdout | int) / 1024 }}"
  when: ansible_facts['os_family'] == "Darwin"
  tags: ollama_resources

- name: Warn when less than 20 GB free for models
  ansible.builtin.debug:
    msg: >
      WARNING: Only {{ ollama_free_mb | int }} MB free on the volume
      containing {{ ansible_facts['env']['HOME'] }}. Consider freeing space before
      pulling larger Ollama models (they can consume tens of GB).
  when:
    - ansible_facts['os_family'] == "Darwin"
    - ollama_free_mb | int < 20000      # < ~20 GB
    - ollama_free_mb | int >= 10000     # between ~10 GB and 20 GB
  tags: ollama_resources

- name: Strong warning when less than 10 GB free for models
  ansible.builtin.debug:
    msg: >
      STRONG WARNING: Only {{ ollama_free_mb | int }} MB free on the volume
      containing {{ ansible_facts['env']['HOME'] }}. This is likely insufficient for
      medium/large Ollama models; expect pull failures or aggressive eviction.
  when:
    - ansible_facts['os_family'] == "Darwin"
    - ollama_free_mb | int < 10000      # < ~10 GB
  tags: ollama_resources


# --- Install Ollama GUI app via Homebrew cask (includes CLI) ------------------

- name: Ensure Ollama GUI app is installed via Homebrew cask
  community.general.homebrew_cask:
    name: ollama          # or ollama-app, depending on your tap
    state: present
  become: false
  when: ansible_facts['os_family'] == "Darwin"
  tags: ollama_gui

- name: Check that Ollama.app exists in /Applications
  ansible.builtin.stat:
    path: "/Applications/Ollama.app"
  register: ollama_app_stat
  when: ansible_facts['os_family'] == "Darwin"
  tags: ollama_gui

- name: Show warning when GUI app is missing after cask install
  ansible.builtin.debug:
    msg: >
      WARNING: Ollama GUI app not found at /Applications/Ollama.app.
      Verify the Homebrew cask install or where the app bundle was placed.
  when:
    - ansible_facts['os_family'] == "Darwin"
    - not ollama_app_stat.stat.exists
  tags: ollama_gui

# When the GUI app starts, it checks if `ollama` is in PATH and,
# if not, will prompt to create /usr/local/bin/ollama.[web:16][web:74]

- name: Check ollama CLI is available
  ansible.builtin.command: ollama --version
  register: ollama_version_check
  changed_when: false
  failed_when: false         # warn-only, do not fail play
  when: ansible_facts['os_family'] == "Darwin"
  tags: ollama_health

- name: Warn if ollama CLI is not usable
  ansible.builtin.debug:
    msg: >
      WARNING: ollama CLI did not respond correctly. Make sure you've launched
      Ollama.app at least once so it can create /usr/local/bin/ollama, or
      add a manual symlink from the app bundle to your PATH.[web:16][web:74]
  when:
    - ansible_facts['os_family'] == "Darwin"
    - ollama_version_check.rc is defined
    - ollama_version_check.rc != 0
  tags: ollama_health

- name: Ensure local Zsh completions directory exists
  ansible.builtin.file:
    path: "{{ ansible_facts['env']['HOME'] }}/.zsh_completions"
    state: directory
    mode: "0755"
  when: ansible_facts['os_family'] == "Darwin"
  tags: ollama_zsh

# --- Zsh completion setup -----------------------------------------------------

- name: Ensure Ollama app topic directory exists
  ansible.builtin.file:
    path: "{{ ansible_facts['env']['HOME'] }}/dotfiles/apps/ollama"
    state: directory
    mode: "0755"
  when: ansible_facts['os_family'] == "Darwin"
  tags: ollama_zsh

- name: Ensure local Zsh completions directory exists
  ansible.builtin.file:
    path: "{{ ansible_facts['env']['HOME'] }}/.zsh_completions"
    state: directory
    mode: "0755"
  when: ansible_facts['os_family'] == "Darwin"
  tags: ollama_zsh

- name: Download latest Ollama Zsh completion to temporary path
  ansible.builtin.get_url:
    url: "https://gist.githubusercontent.com/obeone/9313811fd61a7cbb843e0001a4434c58/raw/_ollama.zsh"
    dest: "/tmp/_ollama.zsh"
    mode: "0644"
    force: true
  when: ansible_facts['os_family'] == "Darwin"
  tags: ollama_zsh

- name: Compute checksum of temporary Ollama completion file
  ansible.builtin.stat:
    path: "/tmp/_ollama.zsh"
    checksum_algorithm: sha256
  register: ollama_completion_stat
  when: ansible_facts['os_family'] == "Darwin"
  tags: ollama_zsh

- name: Install or update Ollama Zsh completion under dotfiles topic
  ansible.builtin.get_url:
    url: "https://gist.githubusercontent.com/obeone/9313811fd61a7cbb843e0001a4434c58/raw/_ollama.zsh"
    dest: "{{ ansible_facts['env']['HOME'] }}/dotfiles/apps/ollama/_ollama_zsh_completion"
    mode: "0644"
    checksum: "sha256:{{ ollama_completion_stat.stat.checksum }}"
  when: ansible_facts['os_family'] == "Darwin"
  tags: ollama_zsh

- name: Symlink Ollama completion into ~/.zsh_completions as _ollama
  ansible.builtin.file:
    src: "{{ ansible_facts['env']['HOME'] }}/dotfiles/apps/ollama/_ollama_zsh_completion"
    dest: "{{ ansible_facts['env']['HOME'] }}/.zsh_completions/_ollama"
    state: link
  when: ansible_facts['os_family'] == "Darwin"
  tags: ollama_zsh


# --- Key paths / facts (for logging & future tasks) ---------------------------

- name: Set Ollama path facts
  ansible.builtin.set_fact:
    ollama_home_dir: "{{ ansible_facts['env']['HOME'] }}/.ollama"
    ollama_logs_dir: "{{ ansible_facts['env']['HOME'] }}/.ollama/logs"
    ollama_cli_default: "/usr/local/bin/ollama"
  when: ansible_facts['os_family'] == "Darwin"
  tags: ollama_paths

- name: Ensure Ollama logs directory exists (for later log collection)
  ansible.builtin.file:
    path: "{{ ollama_logs_dir }}"
    state: directory
    mode: "0755"
  when: ansible_facts['os_family'] == "Darwin"
  tags: ollama_paths


# --- macOS service integration (launch agent) ---------------------------------

- name: Check for Ollama launch agent plist
  ansible.builtin.stat:
    path: "{{ ansible_facts['env']['HOME'] }}/Library/LaunchAgents/com.ollama.ollama.plist"
  register: ollama_launch_agent
  when: ansible_facts['os_family'] == "Darwin"
  tags: ollama_service

- name: Warn if Ollama launch agent plist is missing
  ansible.builtin.debug:
    msg: >
      WARNING: Expected launch agent
      {{ ansible_facts['env']['HOME'] }}/Library/LaunchAgents/com.ollama.ollama.plist
      not found. Ollama may not auto-start on login; verify the install or
      create a launch agent manually.
  when:
    - ansible_facts['os_family'] == "Darwin"
    - not ollama_launch_agent.stat.exists
  tags: ollama_service

- name: Try to bootstrap Ollama launchd agent for current user
  ansible.builtin.shell: |
    launchctl bootstrap gui/$(id -u) "{{ ansible_facts['env']['HOME'] }}/Library/LaunchAgents/com.ollama.ollama.plist"
  args:
    executable: /bin/bash
  register: ollama_bootstrap_result
  failed_when: false        # do not fail the play on bootstrap error
  changed_when: false
  when:
    - ansible_facts['os_family'] == "Darwin"
    - ollama_launch_agent.stat.exists
  tags: ollama_service

- name: Warn if bootstrapping Ollama launchd agent failed
  ansible.builtin.debug:
    msg: >
      WARNING: Failed to bootstrap Ollama launch agent via launchctl.
      stdout: {{ ollama_bootstrap_result.stdout | default('') }}
      stderr: {{ ollama_bootstrap_result.stderr | default('') }}
  when:
    - ansible_facts['os_family'] == "Darwin"
    - ollama_launch_agent.stat.exists
    - ollama_bootstrap_result.rc is defined
    - ollama_bootstrap_result.rc != 0
  tags: ollama_service

- name: Try to enable Ollama launchd agent at login
  ansible.builtin.shell: |
    launchctl enable gui/$(id -u)/com.ollama.ollama
  args:
    executable: /bin/bash
  register: ollama_enable_result
  failed_when: false        # do not fail the play on enable error
  changed_when: false
  when:
    - ansible_facts['os_family'] == "Darwin"
    - ollama_launch_agent.stat.exists
  tags: ollama_service

- name: Warn if enabling Ollama launchd agent failed
  ansible.builtin.debug:
    msg: >
      WARNING: Failed to enable Ollama launch agent at login.
      stdout: {{ ollama_enable_result.stdout | default('') }}
      stderr: {{ ollama_enable_result.stderr | default('') }}

