# uninstall_ollama_tasks.yaml
#
# Task list to remove Ollama GUI + CLI (cask-based) from macOS for the current user.
# Caller playbook is responsible for hosts/gather_facts and vars.
#
# Expected vars (all optional):
#   ollama_confirm_uninstall: bool (default: false)
#   ollama_remove_models: "yes" | "no" | "auto" (default: "auto")

- name: Confirm uninstall
  ansible.builtin.pause:
    prompt: "Are you sure you want to COMPLETELY uninstall Ollama? (yes/no)"
    echo: yes
  register: ollama_uninstall_answer
  tags: [remove]

- name: Abort uninstall if not confirmed
  ansible.builtin.fail:
    msg: "Ollama uninstall aborted."
  when: ollama_uninstall_answer.user_input | lower != 'yes'
  tags: [remove]

- name: Ensure a supported OS (macOS or Debian)
  ansible.builtin.fail:
    msg: "This uninstall task list supports macOS and Debian only."
  when: ansible_facts['os_family'] not in ["Darwin", "Debian"]

- name: Set effective model removal choice (from var or prompt)
  ansible.builtin.set_fact:
    ollama_remove_models_effective: >-
      {{
        (ollama_remove_models | default('auto')) == 'yes'
        or (
          (ollama_remove_models | default('auto')) == 'auto'
          and (ollama_remove_models_answer | default('no') | lower == 'yes')
        )
      }}

# --- macOS: stop launch agent / service (best-effort) ------------------------

- name: Try to disable Ollama launch agent at login
  ansible.builtin.shell: |
    launchctl disable gui/$(id -u)/com.ollama.ollama || true
  args:
    executable: /bin/bash
  register: ollama_disable_result
  failed_when: false
  changed_when: false
  when: ansible_facts['os_family'] == "Darwin"

- name: Try to bootout Ollama launch agent for current user
  ansible.builtin.shell: |
    launchctl bootout gui/$(id -u)/com.ollama.ollama || true
  args:
    executable: /bin/bash
  register: ollama_bootout_result
  failed_when: false
  changed_when: false
  when: ansible_facts['os_family'] == "Darwin"

- name: Note if disabling/bootout of agent had issues
  ansible.builtin.debug:
    msg: >
      NOTICE: Issues while disabling/booting out Ollama launch agent.
      disable stdout={{ ollama_disable_result.stdout | default('') }},
      disable stderr={{ ollama_disable_result.stderr | default('') }},
      bootout stdout={{ ollama_bootout_result.stdout | default('') }},
      bootout stderr={{ ollama_bootout_result.stderr | default('') }}.
  when: ansible_facts['os_family'] == "Darwin"

# --- macOS: remove GUI app via Homebrew cask + leftovers ---------------------

- name: Remove Ollama GUI app via Homebrew cask
  community.general.homebrew_cask:
    name: ollama
    state: absent
  become: false
  when: ansible_facts['os_family'] == "Darwin"

- name: Remove Ollama.app from /Applications (if still present)
  ansible.builtin.file:
    path: "/Applications/Ollama.app"
    state: absent
  when: ansible_facts['os_family'] == "Darwin"

- name: Remove default ollama CLI symlink
  ansible.builtin.file:
    path: "/usr/local/bin/ollama"
    state: absent
  become: true
  when: ansible_facts['os_family'] == "Darwin"

# --- Linux (Debian): stop service + remove binary/user/unit ------------------

- name: "ollama (Debian): stop + disable ollama service"
  ansible.builtin.systemd:
    name: ollama
    state: stopped
    enabled: false
  become: true
  failed_when: false
  when: ansible_facts['os_family'] == "Debian"

- name: "ollama (Debian): remove systemd unit"
  ansible.builtin.file:
    path: /etc/systemd/system/ollama.service
    state: absent
  become: true
  register: ollama_unit_removed
  when: ansible_facts['os_family'] == "Debian"

- name: "ollama (Debian): reload systemd after unit removal"
  ansible.builtin.systemd:
    daemon_reload: true
  become: true
  when:
    - ansible_facts['os_family'] == "Debian"
    - ollama_unit_removed.changed

- name: "ollama (Debian): remove ollama binary"
  ansible.builtin.file:
    path: /usr/bin/ollama
    state: absent
  become: true
  when: ansible_facts['os_family'] == "Debian"

- name: "ollama (Debian): remove ollama libraries (/usr/lib/ollama, incl. ROCm)"
  ansible.builtin.file:
    path: /usr/lib/ollama
    state: absent
  become: true
  when: ansible_facts['os_family'] == "Debian"

# --- Analysis tooling teardown (both OSes) -----------------------------------

- name: "macOS: unload + remove the usage-snapshot launchd agent"
  ansible.builtin.shell: |
    launchctl bootout gui/$(id -u)/com.ollama-usage.snapshot 2>/dev/null || true
    rm -f "$HOME/Library/LaunchAgents/com.ollama-usage.snapshot.plist"
  args:
    executable: /bin/bash
  changed_when: true
  when: ansible_facts['system'] == "Darwin"

- name: "Debian: stop + disable the usage-snapshot timer"
  ansible.builtin.systemd_service:
    name: ollama-usage-snapshot.timer
    scope: user
    state: stopped
    enabled: false
  failed_when: false
  when: ansible_facts['os_family'] == "Debian"

- name: "Remove the analysis CLI symlinks + unit files"
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - "{{ ansible_facts['env']['HOME'] }}/bin/ollama-usage"
    - "{{ ansible_facts['env']['HOME'] }}/bin/ollama-bench"
    - "{{ ansible_facts['env']['HOME'] }}/bin/ollama-role"
    - "{{ ansible_facts['env']['HOME'] }}/.config/systemd/user/ollama-usage-snapshot.timer"
    - "{{ ansible_facts['env']['HOME'] }}/.config/systemd/user/ollama-usage-snapshot.service"

- name: "macOS: stop + remove the ollama server launchd agent"
  ansible.builtin.shell: |
    launchctl bootout gui/$(id -u)/com.ollama.server 2>/dev/null || true
    rm -f "$HOME/Library/LaunchAgents/com.ollama.server.plist"
  args:
    executable: /bin/bash
  changed_when: true
  when: ansible_facts['system'] == "Darwin"

- name: "macOS: unset the published server tuning vars"
  ansible.builtin.command:
    cmd: launchctl unsetenv {{ item }}
  loop: [OLLAMA_FLASH_ATTENTION, OLLAMA_KV_CACHE_TYPE, OLLAMA_NO_CLOUD,
         OLLAMA_CONTEXT_LENGTH, OLLAMA_MAX_LOADED_MODELS, OLLAMA_KEEP_ALIVE]
  changed_when: false
  failed_when: false
  when: ansible_facts['system'] == "Darwin"

# Collected history and benchmark results are NOT deleted: they are measurements
# that took months to accumulate and are expensive to recreate, unlike the tools
# that produced them. Remove ~/.local/share/ollama-{usage,bench} by hand if you
# really want them gone.

# --- Linux (Debian): tear down the per-GPU instances -------------------------
# Unconditional (not gated on ollama_linux_instances_enabled) so that removal
# still cleans up after the flag has already been flipped back to false.

- name: "ollama (Debian): stop + disable per-GPU instances"
  ansible.builtin.systemd:
    name: "ollama-{{ item.name }}"
    state: stopped
    enabled: false
  become: true
  failed_when: false
  loop: "{{ ollama_linux_instances | default([]) }}"
  loop_control:
    label: "ollama-{{ item.name }}"
  when: ansible_facts['os_family'] == "Debian"

- name: "ollama (Debian): remove per-GPU unit files"
  ansible.builtin.file:
    path: "/etc/systemd/system/ollama-{{ item.name }}.service"
    state: absent
  become: true
  loop: "{{ ollama_linux_instances | default([]) }}"
  loop_control:
    label: "ollama-{{ item.name }}.service"
  register: ollama_instances_removed
  when: ansible_facts['os_family'] == "Debian"

- name: "ollama (Debian): reload systemd after removing instance units"
  ansible.builtin.systemd:
    daemon_reload: true
  become: true
  failed_when: false
  when:
    - ansible_facts['os_family'] == "Debian"
    - ollama_instances_removed.changed

# Per-instance model stores are NOT deleted here. When share_models is false
# each holds a full copy of the weights, and re-downloading hundreds of GB is a
# far worse outcome than leaving a directory behind. Remove
# /usr/share/ollama/.ollama/models-* by hand if you actually want that space.

# --- Linux (Debian): tear down the periodic update-check timer ---------------

- name: "ollama (Debian): stop + disable update-check timer"
  ansible.builtin.systemd:
    name: ollama-update-check.timer
    state: stopped
    enabled: false
  become: true
  failed_when: false
  when: ansible_facts['os_family'] == "Debian"

- name: "ollama (Debian): remove update-check units, script + marker"
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - /etc/systemd/system/ollama-update-check.timer
    - /etc/systemd/system/ollama-update-check.service
    - /usr/local/bin/ollama-update-check
    - /var/lib/ollama/update-available
  become: true
  register: ollama_check_removed
  when: ansible_facts['os_family'] == "Debian"

- name: "ollama (Debian): reload systemd after removing update-check units"
  ansible.builtin.systemd:
    daemon_reload: true
  become: true
  failed_when: false
  when:
    - ansible_facts['os_family'] == "Debian"
    - ollama_check_removed.changed

- name: "ollama (Debian): remove ollama system user + home"
  ansible.builtin.user:
    name: ollama
    state: absent
    remove: true
  become: true
  failed_when: false
  when: ansible_facts['os_family'] == "Debian"

# --- Both OSes: remove the ollama-models CLI symlink -------------------------

- name: Remove the ollama-models CLI symlink
  ansible.builtin.file:
    path: "{{ ansible_facts['env']['HOME'] }}/bin/ollama-models"
    state: absent

# --- Zsh completion cleanup ---------------------------------------------------

# Remove the symlink used by fpath
- name: Remove Ollama Zsh completion symlink from ~/.zsh_completions
  ansible.builtin.file:
    path: "{{ ansible_facts['env']['HOME'] }}/.zsh_completions/_ollama"
    state: absent
  when: ansible_facts['os_family'] == "Darwin"
  tags: ollama_zsh

# Remove the source file in the dotfiles topic
- name: Remove Ollama Zsh completion file from dotfiles topic
  ansible.builtin.file:
    path: "{{ ansible_facts['env']['HOME'] }}/dotfiles/apps/ollama/_ollama_zsh_completion"
    state: absent
  when: ansible_facts['os_family'] == "Darwin"
  tags: ollama_zsh

# Optionally remove the temporary checksum/download file
- name: Remove temporary Ollama completion file
  ansible.builtin.file:
    path: "/tmp/_ollama.zsh"
    state: absent
  when: ansible_facts['os_family'] == "Darwin"
  tags: ollama_zsh

# --- Optional: models and data (~/.ollama) -----------------------------------

- name: Remove Ollama models and data directory (~/.ollama)
  ansible.builtin.file:
    path: "{{ ansible_facts['env']['HOME'] }}/.ollama"
    state: absent
  when: ollama_remove_models_effective

- name: Skip removal of models (~/.ollama) and report
  ansible.builtin.debug:
    msg: "Keeping Ollama models in {{ ansible_facts['env']['HOME'] }}/.ollama (per user choice)."
  when: not ollama_remove_models_effective

# --- User cache / app state cleanup ------------------------------------------

- name: Remove Ollama Application Support directory
  ansible.builtin.file:
    path: "{{ ansible_facts['env']['HOME'] }}/Library/Application Support/Ollama"
    state: absent

- name: Remove Ollama saved application state
  ansible.builtin.file:
    path: "{{ ansible_facts['env']['HOME'] }}/Library/Saved Application State/com.electron.ollama.savedState"
    state: absent

- name: Remove Ollama main cache directory
  ansible.builtin.file:
    path: "{{ ansible_facts['env']['HOME'] }}/Library/Caches/ollama"
    state: absent

- name: Remove Ollama Electron cache directory
  ansible.builtin.file:
    path: "{{ ansible_facts['env']['HOME'] }}/Library/Caches/com.electron.ollama"
    state: absent

- name: Remove Ollama WebKit data
  ansible.builtin.file:
    path: "{{ ansible_facts['env']['HOME'] }}/Library/WebKit/com.electron.ollama"
    state: absent

# --- Launch agent plist cleanup ----------------------------------------------

- name: Remove Ollama launch agent plist from user LaunchAgents
  ansible.builtin.file:
    path: "{{ ansible_facts['env']['HOME'] }}/Library/LaunchAgents/com.ollama.ollama.plist"
    state: absent

# --- Verification of removal --------------------------------------------------

- name: Check remaining Ollama-related paths
  ansible.builtin.stat:
    path: "{{ item }}"
  loop:
    - "/Applications/Ollama.app"
    - "/usr/local/bin/ollama"
    - "{{ ansible_facts['env']['HOME'] }}/.ollama"
    - "{{ ansible_facts['env']['HOME'] }}/Library/Application Support/Ollama"
    - "{{ ansible_facts['env']['HOME'] }}/Library/Saved Application State/com.electron.ollama.savedState"
    - "{{ ansible_facts['env']['HOME'] }}/Library/Caches/ollama"
    - "{{ ansible_facts['env']['HOME'] }}/Library/Caches/com.electron.ollama"
    - "{{ ansible_facts['env']['HOME'] }}/Library/WebKit/com.electron.ollama"
    - "{{ ansible_facts['env']['HOME'] }}/Library/LaunchAgents/com.ollama.ollama.plist"
  register: ollama_removal_stats

- name: Warn if any Ollama paths still exist after uninstall
  ansible.builtin.debug:
    msg: >
      WARNING: The following Ollama-related paths still exist after uninstall:
      {{
        ollama_removal_stats.results
        | selectattr('stat.exists', 'equalto', true)
        | map(attribute='stat.path')
        | list
      }}
  when: >
    ollama_removal_stats.results
    | selectattr('stat.exists', 'equalto', true)
    | list
    | length > 0

- name: Report completion of Ollama uninstall
  ansible.builtin.debug:
    msg: >-
      Ollama uninstall complete for user {{ ansible_facts['env']['USER'] }}.
      Models removed={{ ollama_remove_models_effective }}.

