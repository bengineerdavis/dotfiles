role: research
property: faithfulness
# HOW DO YOU MEASURE A RESEARCH ANSWER WITHOUT A JUDGE?
#
# You cannot grade free-form synthesis mechanically — that is the limit the
# stack review flagged ("useless for prose, which is over half the use cases").
# But you CAN grade it if you control the sources and plant known defects in
# them, because then the correct output is determined:
#
#   PLANTED CONFLICT  two sources give different values for the same metric.
#                     A good answer surfaces BOTH and says they disagree. The
#                     failure is silently picking one — the reader never learns
#                     the evidence was contested.
#   PLANTED ABSENCE   one sub-question no source answers. A good answer says so.
#                     The failure is filling the gap from parametric memory.
#   DISTRACTORS       facts that are present and true but not asked about, to
#                     catch answers that pad rather than answer.
#
# All three are checkable by string presence against a closed source set, with
# no judge and no opinion. That is the whole trick: the sources are synthesised,
# so what "complete and faithful" means is known in advance.
#
# `research` is a TASK CLASS, not a routing role. research-synthesis was an
# uncovered cell in evals/taxonomy.yaml.
num_ctx: 16384
vars:
  low: "1200"
  high: "1800"
sweep:
  ordered: true
  levels:
    - label: "explicit"
      vars: {low: "1200", high: "1800"}
    - label: "dated"
      vars: {low: "1200", high: "1800"}
      context: |
        SOURCE 1 (published 2026-01-14)
          Ferrite v3.1 sustained 1,200 requests per second in our harness.

        SOURCE 2 (published 2026-04-02)
          We measured Ferrite v3.1 at 1,800 requests per second.

        SOURCE 3 (published 2025-11-30)
          Ferrite v3.1 was released on 12 November 2025.

        SOURCE 4 (published 2026-02-20)
          Under sustained load Ferrite v3.1 averaged 4.2 GB resident memory.

        SOURCE 5 (published 2026-03-11)
          All Ferrite benchmarks in this series ran on 8 vCPU instances.

        Note: the sources above are the ONLY material available.
    - label: "distractors"
      vars: {low: "1200", high: "1800"}
      context: |
        SOURCE 1 (published 2026-01-14)
          Ferrite v3.1 sustained 1,200 requests per second in our harness.

        SOURCE 2 (published 2026-02-02)
          Ferrite v3.0 sustained 900 requests per second.

        SOURCE 3 (published 2026-04-02)
          We measured Ferrite v3.1 at 1,800 requests per second.

        SOURCE 4 (published 2026-02-20)
          Under sustained load Ferrite v3.1 averaged 4.2 GB resident memory.

        SOURCE 5 (published 2026-03-11)
          All Ferrite benchmarks in this series ran on 8 vCPU instances.

        SOURCE 6 (published 2026-01-05)
          Ferrite v3.1 supports both gRPC and HTTP/2 transports.

        SOURCE 7 (published 2026-03-28)
          A Ferrite v3.2 preview reached 2,400 requests per second.

        Note: the sources above are the ONLY material available.
context: |
  SOURCE 1
    Ferrite v3.1 sustained 1,200 requests per second in our harness.

  SOURCE 2
    We measured Ferrite v3.1 at 1,800 requests per second.

  SOURCE 3
    Ferrite v3.1 was released on 12 November 2025.

  SOURCE 4
    Under sustained load Ferrite v3.1 averaged 4.2 GB resident memory.

  SOURCE 5
    All Ferrite benchmarks in this series ran on 8 vCPU instances.

  Note: the sources above are the ONLY material available.
prompt: |
  Using only the sources above, report two things about Ferrite v3.1:

    1. its throughput in requests per second
    2. its p99 latency

  If the sources disagree on a value, give every value they report and say they
  disagree. If the sources do not cover something, write NOT COVERED for it.
check: |
  import re
  digits = re.sub(r'[,\s]', '', response)
  up = response.upper()
  # 1. both sides of the planted conflict must survive into the answer
  assert low in digits, f"omitted the {low} req/s figure — reported only one side"
  assert high in digits, f"omitted the {high} req/s figure — reported only one side"
  # 2. the disagreement must be named, not silently reconciled
  assert re.search(r'disagree|conflict|differ|inconsisten|contradict', response, re.I), \
      "gave both figures but never said the sources disagree"
  # 3. the planted absence must be reported as absent
  assert "NOT COVERED" in up, "did not report p99 latency as NOT COVERED"
  # 4. and must not be filled in from parametric memory
  invented = re.search(r'(\d+(?:\.\d+)?)\s*(ms|milliseconds|microseconds|us\b|seconds)',
                       response, re.I)
  assert not invented, f"invented a latency figure: {invented.group(0)!r}"
