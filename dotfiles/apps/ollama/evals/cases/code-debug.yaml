role: code
property: correctness
# `coding-debug` was an uncovered cell in evals/taxonomy.yaml despite being real
# work. Reviewing code is the single largest task type in the log (45%), and
# diagnosing a failure is its harder sibling.
#
# The model is given a short function and a concrete failing call, and must name
# the line that is wrong. Naming a line is mechanically checkable where "explain
# the bug" would need a judge.
#
# VERIFIED BY EXECUTION, which is the strongest verification in this suite: the
# verifier runs the buggy function and asserts it really fails the stated call,
# then applies the one-line fix and asserts it passes. So the bug is real, it is
# on the declared line, and fixing that line is sufficient.
#
# Difficulty axis: how local the defect is. An off-by-one is visible in the line
# itself; the wrong-return is visible only by comparing to the rest of the
# function; the mutation bug requires knowing what iteration does when the
# collection changes underneath it.
num_ctx: 16384
vars:
  expected: 3
sweep:
  ordered: true
  levels:
    - label: "off-by-one"
      vars: {expected: 3}
    - label: "wrong-return"
      vars: {expected: 8}
      context: |
        1  def merge_counts(a, b):
        2      out = dict(a)
        3      for key, value in b.items():
        4          if key in out:
        5              out[key] = out[key] + value
        6          else:
        7              out[key] = value
        8      return a

        Calling merge_counts({"x": 1}, {"x": 2, "y": 3}) should return
        {"x": 3, "y": 3} but returns {"x": 1}.
    - label: "mutation"
      # BOTH lines are defensible: the unsafe call is on 4, but the
      # conventional fix is on 2 (iterate over a copy). Verified by
      # execution that either edit repairs it, so either answer counts.
      vars: {expected: [2, 4]}
      context: |
        1  def drop_expired(entries, now):
        2      for e in entries:
        3          if e["expires"] <= now:
        4              entries.remove(e)
        5      return entries

        Calling drop_expired([{"expires": 1}, {"expires": 1}, {"expires": 9}], 5)
        should return [{"expires": 9}] but returns
        [{"expires": 1}, {"expires": 9}].
context: |
  1  def last_n(items, n):
  2      out = []
  3      for i in range(len(items) - n, len(items) + 1):
  4          out.append(items[i])
  5      return out

  Calling last_n([1, 2, 3, 4, 5], 2) should return [4, 5] but raises IndexError.
prompt: |
  Exactly one line contains the bug. Which line number?

  Reply with only: ANSWER: <line number>
check: |
  import re
  m = re.search(r'ANSWER:\s*\**\s*(\d+)', response, re.I)
  if not m:
      nums = re.findall(r'\b(\d+)\b', response)
      assert nums, f"named no line: {' '.join(response.split())[:120]!r}"
      got = int(nums[-1])
  else:
      got = int(m.group(1))
  want = expected if isinstance(expected, list) else [expected]
  assert got in want, (f"named line {got}, the bug is on line "
                       + (" or ".join(map(str, want)) if len(want) > 1 else str(want[0])))
