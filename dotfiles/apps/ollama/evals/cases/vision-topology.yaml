          - {kind: line, from: [105, 120], to: [165, 60], width: 3}
          - {kind: line, from: [105, 120], to: [165, 185], width: 3}
          - {kind: line, from: [255, 55], to: [315, 55], width: 3}
          - {kind: line, from: [255, 185], to: [315, 185], width: 3, color: red}
          - {kind: text, at: [262, 195], text: "DOWN", size: 12, color: red}
          - {kind: line, from: [405, 185], to: [455, 185], width: 3}
    - label: "redundant"
      vars: {expected: "queue, worker"}
      image:
        size: [560, 290]
        background: white
        shapes:
          - {kind: rect, at: [15, 120], size: [90, 40], fill: none, outline: black, width: 2}
          - {kind: text, at: [28, 133], text: "gateway", size: 14}
          - {kind: rect, at: [165, 35], size: [90, 40], fill: none, outline: black, width: 2}
          - {kind: text, at: [188, 48], text: "auth", size: 14}
          - {kind: rect, at: [165, 200], size: [90, 40], fill: none, outline: black, width: 2}
          - {kind: text, at: [192, 213], text: "api", size: 14}
          - {kind: rect, at: [325, 105], size: [90, 40], fill: none, outline: black, width: 2}
          - {kind: text, at: [348, 118], text: "cache", size: 14}
          - {kind: rect, at: [325, 220], size: [90, 40], fill: none, outline: black, width: 2}
          - {kind: text, at: [350, 233], text: "queue", size: 14}
          - {kind: rect, at: [460, 105], size: [90, 40], fill: none, outline: black, width: 2}
          - {kind: text, at: [483, 118], text: "search", size: 14}
          - {kind: rect, at: [460, 220], size: [90, 40], fill: none, outline: black, width: 2}
