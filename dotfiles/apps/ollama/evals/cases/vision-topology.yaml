role: vision
property: correctness
# MULTIMODAL REASONING, not multimodal perception. The earlier vision cases ask
# the model to count shapes — real, but it only tests whether the model looked.
# This asks it to READ A DIAGRAM AND THEN REASON OVER IT: follow reachability
# from the gateway, treat red DOWN links as severed, and report what is cut off.
# The answer cannot be obtained from the prompt text alone, so the image is
# load-bearing rather than decorative.
#
# It is also the multimodal form of support-elimination, which makes it the
# closest thing here to reading an architecture diagram during an incident.
#
# Difficulty axis:
#   one-hop   a leaf is cut off directly
#   chain     the cut is upstream, so a node BEHIND the failed node also dies
#   redundant a second path rescues one node — the trap is reporting it as down
num_ctx: 16384
vars:
  expected: "db"
sweep:
  ordered: true
  levels:
    - label: "one-hop"
      vars: {expected: "db"}
    - label: "chain"
      vars: {expected: "cache, search"}
      image:
        size: [560, 250]
        background: white
        shapes:
          - {kind: rect, at: [15, 100], size: [90, 40], fill: none, outline: black, width: 2}
          - {kind: text, at: [28, 113], text: "gateway", size: 14}
          - {kind: rect, at: [165, 35], size: [90, 40], fill: none, outline: black, width: 2}
          - {kind: text, at: [188, 48], text: "auth", size: 14}
          - {kind: rect, at: [165, 165], size: [90, 40], fill: none, outline: black, width: 2}
          - {kind: text, at: [192, 178], text: "api", size: 14}
