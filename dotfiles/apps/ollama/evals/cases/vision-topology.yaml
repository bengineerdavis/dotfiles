image:
  size: [430, 240]
  background: white
  shapes:
    - {kind: rect, at: [15, 100], size: [90, 40], fill: none, outline: black, width: 2}
    - {kind: text, at: [28, 113], text: "gateway", size: 14}
    - {kind: rect, at: [165, 35], size: [90, 40], fill: none, outline: black, width: 2}
    - {kind: text, at: [188, 48], text: "auth", size: 14}
    - {kind: rect, at: [165, 165], size: [90, 40], fill: none, outline: black, width: 2}
    - {kind: text, at: [192, 178], text: "api", size: 14}
    - {kind: rect, at: [315, 35], size: [90, 40], fill: none, outline: black, width: 2}
    - {kind: text, at: [346, 48], text: "db", size: 14}
    - {kind: rect, at: [315, 165], size: [90, 40], fill: none, outline: black, width: 2}
    - {kind: text, at: [338, 178], text: "cache", size: 14}
    - {kind: line, from: [105, 120], to: [165, 60], width: 3}
    - {kind: line, from: [105, 120], to: [165, 185], width: 3}
    - {kind: line, from: [255, 55], to: [315, 55], width: 3, color: red}
    - {kind: text, at: [262, 25], text: "DOWN", size: 12, color: red}
    - {kind: line, from: [255, 185], to: [315, 185], width: 3}
prompt: |
  The diagram shows services and the links between them. A link drawn in red and
  marked DOWN is broken and cannot carry traffic. All other links work. Traffic
  enters at the gateway.

  Which services can no longer be reached from the gateway? Reply with only:
  ANSWER: <names, comma-separated, alphabetical>
check: |
  import re
  NAMES = ("gateway", "auth", "api", "db", "cache", "search", "queue", "worker")
  seg = response
  m = re.search(r'ANSWER:\s*(.+)', response, re.I)
  if m:
      seg = m.group(1)
  got = sorted(set(n.lower() for n in re.findall(
      r'\b(' + "|".join(NAMES) + r')\b', seg, re.I)))
  want = sorted(n.strip() for n in expected.split(","))
  assert got, f"named no services: {' '.join(response.split())[:120]!r}"
  assert got == want, f"answered {got}, unreachable set is {want}"
