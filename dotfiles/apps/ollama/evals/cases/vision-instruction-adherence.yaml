role: vision
property: instruction-adherence
# Vision models are trained toward description, so the characteristic failure is
# answering a narrow question with a paragraph about the whole image. One word
# is a shape a script can validate exactly.
#
# It is also grounded: the largest shape is the 70x70 blue square (4900 px^2)
# against the red circles' ~1520 px^2 each, so the single word cannot be guessed
# from the question. Same synthesised image spec as vision-faithfulness.
num_ctx: 16384
image:
  size: [320, 240]
  background: white
  shapes:
    - {kind: circle, color: red,  center: [50, 60],  r: 22}
    - {kind: circle, color: red,  center: [120, 60], r: 22}
    - {kind: circle, color: red,  center: [190, 60], r: 22}
    - {kind: rect,   color: blue, at: [40, 130],  size: [70, 70]}
    - {kind: rect,   color: blue, at: [150, 140], size: [50, 50]}
prompt: |
  Look at the image. Reply with EXACTLY ONE WORD: the colour of the largest
  shape. No sentence, no punctuation, no explanation.
check: |
  words = response.strip().strip('.').strip('"').split()
  assert len(words) == 1, f"expected one word, got {len(words)}: {words[:6]}"
  assert words[0].lower().strip('.') == "blue", (
      f"said {words[0]!r}; the largest shape is the blue square")
