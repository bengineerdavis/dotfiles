# apps/ollama/defaults/main.yaml
#
# ── Ollama model manifest — single source of truth ───────────────────────────
# This list drives every model the topic installs and keeps up to date. It is
# consumed by the `ollama-models` CLI (apps/ollama/files/ollama-models), which
# the install/upgrade tasks shell out to. Edit it directly:
#
#   • add a model      → copy a line under its family; set darwin/linux + size_gb
#   • add a family      → add a new `family-name:` key with a list of members
#   • drop a model      → delete/comment its line (upgrades stop touching it;
#                         already-pulled weights are NOT auto-deleted — use
#                         `ollama-models prune` to list orphans, then `ollama rm`)
#   • check upstream    → `ollama-models check`  (new tags, new precision formats,
#                         `--next-gen` probes for newer family generations)
#
# Organized by category → model family (name + generation, e.g. `qwen3.6`).
# Each family key maps to a list of its members; the family key is the model
# name and every member's tag starts with it. A family appears exactly ONCE —
# duplicate YAML keys silently discard the earlier block — so variants such as
# qwen3.6's coding builds live inside their family, marked with an inline note,
# rather than in a separate "coding" section.
#
# ── Per-OS / per-hardware tags ───────────────────────────────────────────────
# A member declares one tag per key; the `ollama-models` CLI picks the most
# specific key the host matches (see files/ollama-models → OS_KEYS / os_keys):
#
#   darwin        Apple Silicon — MLX builds, native Metal execution
#   linux_nvidia  NVIDIA with NATIVE FP4 silicon (Blackwell, compute capability
#                 >= 10.0) — NVFP4. NOT merely "an NVIDIA card": on Ampere (8.6)
#                 and Ada (8.9) FP4/FP8 are emulated through higher-precision
#                 kernels with no latency gain over BF16, so an RTX 3090 running
#                 an nvfp4 build is strictly worse off than plain GGUF. The CLI
#                 checks `nvidia-smi --query-gpu=compute_cap` and sends anything
#                 older to `linux` instead.
#   linux_amd     AMD ROCm      — optional override; omit to inherit `linux`
#   linux         universal GGUF baseline (ROCm + CPU + pre-Blackwell NVIDIA),
#                 and the fallback for any host whose more specific key is absent
#
# ── NVFP4 *is* the MLX build ─────────────────────────────────────────────────
# Counter-intuitive but verified by registry manifest digest: for every 4-bit
# member, `-mlx` and `-nvfp4` are the SAME artifact.
#     qwen3.6:27b-mlx == qwen3.6:27b-nvfp4        (60b0437bbd025212)
#     qwen3.6:35b-mlx == qwen3.6:35b-a3b-nvfp4    (1b50c6fdc2d4f75f)
#     gemma4:{12b,26b,31b}-mlx == the -nvfp4 tags · qwen3.5 likewise
# NVFP4 is an open microscaling FP4 format, not an NVIDIA-proprietary one, so a
# single file feeds both Apple's MLX runtime (ollama ships mlx_metal_v3/v4) and
# Blackwell CUDA. ollama.com labels the nvfp4/mxfp8 tags [MLX] for this reason.
# Consequence: a `-coding-nvfp4` tag runs natively on mac — do NOT assume an
# nvfp4 tag is NVIDIA-only. `darwin` uses the `-mlx` alias where one exists
# purely for readability; where it doesn't (coding builds), `-nvfp4` is correct.
# EXCEPTION: at bf16 they diverge — `4b-mlx-bf16` != `4b-bf16` (MLX container
# vs GGUF), so the darwin/linux split is load-bearing for full-precision members.
#
# Only families that upstream actually publishes arch-specific builds for
# (qwen3.6, qwen3.5, gemma4 — MLX / NVFP4 / MXFP8) carry the hardware split.
# GGUF-only families (glm, granite, lfm2, olmo, deepseek-r1, devstral, qwen3-vl,
# embeddings) keep the plain darwin/linux pair: one GGUF serves Metal, CUDA,
# ROCm and CPU alike, so splitting them would just duplicate the same tag.
#
# Precision policy:
#   arch-split families
#     small (≤4B params) → full precision   (darwin -mlx-bf16 · linux -bf16)
#     large (>4B)        → arch-optimized 4-bit
#                          darwin -mlx · linux_nvidia -nvfp4 · linux -q4_K_M
#     `-mxfp8` (8-bit) is ~1.6× larger and is used only where no arch-optimized
#     4-bit exists upstream — see the qwen3.6/qwen3.5 coding members, which have
#     no GGUF build, so AMD/CPU must fall back to MXFP8.
#   GGUF-only families
#     small → full precision · large → fp8 if it fits the budget, else fp4 floor
#   embeddings → full precision, identical tag on every host
#
# NOTE (mac coding builds): upstream ships no `-coding-mlx`, so the coding
# members use NVFP4 on darwin too — the only variant that fits a 24 GB budget
# (MXFP8 is 31-38 GB). It runs on Metal but is not MLX-accelerated;
# `ollama-models check` will surface a `-coding-mlx` tag if one ever appears.
#
# `size_gb` is the approximate on-disk/VRAM footprint. It is either a scalar
# (same footprint on every host) or a mapping of os key → GB when the
# per-hardware builds differ materially. At runtime each entry is gated against
# the RAM/VRAM budget (see below); anything larger is skipped with a log line,
# so the same manifest works on a 16 GB laptop and a 128 GB workstation.
#
# `basis: ram` opts a member out of the default budget. On Linux with a discrete
# GPU the budget is VRAM — correct for anything running ON the GPU, wrong for
# large MoE models deliberately run on CPU or split CPU+GPU, where the real
# limit is system RAM. Without it an 81 GB MoE would be vetoed by a 24 GB card
# on a 128 GB host. Only used by the two 120B-class members below.

# Percent of total RAM kept free for other programs. Budget = total − this%.
ollama_ram_reserve_pct: 33

# ── Context headroom ─────────────────────────────────────────────────────────
# Weights alone are a misleading gate. `ministral-3:3b` is 4.5GB of weights but
# needs ~33GB at its full 262K window — it clears a 24GB budget comfortably and
# then cannot run. So each member is gated on weights + KV cache at the context
# length you actually intend to use.
#
# Budgeting splits by ALLOCATION BEHAVIOUR, because the two runtimes differ and
# pretending otherwise is either wasteful or wishful:
#
#   ollama_ctx_declared_tokens — what a PREALLOCATING runtime (GGUF) reserves up
#     front whether or not you use it. Measured: glm-4.7-flash sits at 26GB with
#     num_ctx=131072 and an empty cache. Must match the server's
#     OLLAMA_CONTEXT_LENGTH, or the budget is fiction.
#
#   ollama_ctx_typical_tokens — what a LAZY runtime (MLX on macOS) actually
#     holds. Measured: qwen3.6:27b-mlx stays at 19GB with num_ctx=262144 and an
#     empty cache, reaching 22GB only when fed a real 41,683-token prompt. So
#     MLX members are budgeted at typical use, not at the declared window.
#     8K is an assumption, not a measurement — no usage history exists on this
#     machine to derive it from (the app's chat DB is empty and the server logs
#     record only the allocated 65536). Raise it if sessions routinely run long;
#     it is the single knob controlling how lenient the gate is on MLX models.
#
#   ollama_budget_tolerance_pct — soft overshoot. Something a few hundred MB
#     past budget still runs fine, and refusing it is more annoying than
#     useful; such members install and are flagged `tight` by `status` rather
#     than skipped, so the leniency stays visible.
#
# KV cost is per-token and tracks ARCHITECTURE, not parameter count. Measured on
# an M4 Max by loading each model and reading resident memory (see SIZING.md):
#
#     granite4:32b-a9b-h   ~19 KB/token   hybrid Mamba layers — cheapest
#     glm-4.7-flash        ~50 KB/token
#     qwen3.6:27b-mlx      ~72 KB/token
#     ministral-3:3b      ~107 KB/token   smallest model, dearest context
#
# Members carry `kv_kb_per_token` where a measurement exists; everything else
# uses the default below. Measure more with the recipe in SIZING.md.
ollama_ctx_declared_tokens: 32768
ollama_ctx_typical_tokens: 8192
ollama_kv_kb_per_token_default: 70
ollama_budget_tolerance_pct: 15

# ── Linux install + GPU acceleration ─────────────────────────────────────────
# No official apt repo exists for Ollama, so the Debian path installs the
# official release tarball directly (see tasks/install.yaml) and "upgrades" by
# comparing the installed binary against the resolved target version — re-pulling
# only when they differ (unlike a `creates:` guard, which never upgrades).
#
#   ollama_linux_version — 'latest' (query GitHub for the newest release tag) or
#                          a pinned tag like 'v0.32.5' for reproducible installs.
#
# GPU support is additive and auto-detected per host (a box may have both):
#   • NVIDIA — CUDA userspace libs ship INSIDE the base tarball; only the host
#     kernel driver (nvidia-smi) is required. The topic detects + warns; it does
#     NOT install DKMS drivers (leave that to system/GPU provisioning).
#   • AMD    — the base tarball is CPU-only for AMD, so the `-rocm` overlay
#     tarball is extracted on top and the service user is added to render/video
#     (for /dev/kfd + /dev/dri access).
#
# Each flag is tri-state: null = auto-detect via PCI vendor id, true/false =
# force on/off (useful on headless hosts or where /sys PCI probing is unreliable).
ollama_linux_version: latest
ollama_gpu_nvidia: null
ollama_gpu_amd: null

# Periodic "is a newer tarball out?" check (Debian only; macOS upgrades via
# `brew upgrade`). Installs a systemd timer that runs ollama-update-check to
# compare the installed binary against the latest upstream tag.
#   _enabled     — install + enable the timer
#   _oncalendar  — systemd OnCalendar= expression (e.g. daily, weekly, '*-*-* 04:00')
#   _apply       — false = NOTIFY only (journal + /var/lib/ollama/update-available
#                  marker); true = the timer auto-swaps the tarball (stop, extract,
#                  re-overlay ROCm if in use, restart). Notify is the safe default.
ollama_update_check_enabled: true
ollama_update_check_oncalendar: daily
ollama_update_check_apply: false

# Installed tags that are intentionally NOT manifest members: `prune` never
# lists them and `sync` never pulls them. Use this for bare `:latest` aliases
# and hand-pinned experiments you want to survive `prune --remove`.
ollama_prune_keep:
  # `ollama run glm-4.7-flash` (no tag) resolves to :latest, and that is the
  # name the `llm` CLI and other clients use. It points at the SAME blob as the
  # q4_K_M member below (digest 4475827791a2), so keeping it costs no disk.
  # NOTE: ollama lowercases tags when writing local manifests, so the upstream
  # tag `q4_K_M` lands on disk as `q4_k_m` — comparisons are casefolded.
  - "glm-4.7-flash:latest"

ollama_models:

  # ═══════════════ general / chat ═══════════════
  # ── arch-split family: MLX on mac, NVFP4 on NVIDIA, GGUF on AMD/CPU ──
  qwen3.6:                  # flagship general + coding (27B dense · 35B-A3B MoE)
    # 27B dense
    - darwin:        "qwen3.6:27b-mlx"
      linux_nvidia:  "qwen3.6:27b-nvfp4"
      linux:         "qwen3.6:27b-q4_K_M"
      size_gb:       { darwin: 20, linux_nvidia: 20, linux: 17 }
      kv_kb_per_token: 72        # measured, M4 Max
    # 35B-A3B MoE (3B active — flagship quality at 27B-class speed)
    - darwin:        "qwen3.6:35b-mlx"
      linux_nvidia:  "qwen3.6:35b-a3b-nvfp4"
      linux:         "qwen3.6:35b-a3b-q4_K_M"
      size_gb:       { darwin: 22, linux_nvidia: 22, linux: 24 }
    # Coding builds. There is no `-coding-mlx` alias, but `-coding-nvfp4` IS an
    # MLX build (see the NVFP4 note above), so mac gets it natively — same
    # artifact NVIDIA uses. AMD/CPU has no coding GGUF at all, so it falls back
    # to MXFP8, budget-gated off anything under ~32GB VRAM.
    - darwin:        "qwen3.6:27b-coding-nvfp4"
      linux_nvidia:  "qwen3.6:27b-coding-nvfp4"
      linux:         "qwen3.6:27b-coding-mxfp8"
      size_gb:       { darwin: 20, linux_nvidia: 20, linux: 31 }
    - darwin:        "qwen3.6:35b-a3b-coding-nvfp4"
      linux_nvidia:  "qwen3.6:35b-a3b-coding-nvfp4"
      linux:         "qwen3.6:35b-a3b-coding-mxfp8"
      size_gb:       { darwin: 22, linux_nvidia: 22, linux: 38 }

  # ── arch-split family ──
  qwen3.5:                  # previous gen (kept for A/B; only qwen with small members)
    # 4B — small, so full precision on every host
    - { darwin: "qwen3.5:4b-mlx-bf16", linux: "qwen3.5:4b-bf16", size_gb: 9 }
    - darwin:        "qwen3.5:9b-mlx"
      linux_nvidia:  "qwen3.5:9b-nvfp4"
      linux:         "qwen3.5:9b-q4_K_M"
      size_gb:       { darwin: 9, linux_nvidia: 9, linux: 7 }
    - darwin:        "qwen3.5:27b-mlx"
      linux_nvidia:  "qwen3.5:27b-nvfp4"
      linux:         "qwen3.5:27b-q4_K_M"
      size_gb:       { darwin: 20, linux_nvidia: 20, linux: 17 }
    - darwin:        "qwen3.5:35b-mlx"
      linux_nvidia:  "qwen3.5:35b-a3b-nvfp4"
      linux:         "qwen3.5:35b-a3b-q4_K_M"
      size_gb:       { darwin: 22, linux_nvidia: 22, linux: 24 }
    # 122B MoE, 10B active — big-RAM hosts only, gated on RAM not OS.
    # Sparse activation cuts COMPUTE, not memory: all experts must be resident,
    # so this needs ~81GB addressable however few parameters fire per token.
    # What `a10b` buys is that the arithmetic per token is 10B-sized, making it
    # usable off-GPU where a 122B *dense* model would not be.
    # `basis: ram` gates against system RAM rather than VRAM — a 24GB card must
    # not veto an 81GB model on a 128GB host. On macOS the two are the same
    # number (unified memory), so the flag is a harmless no-op there.
    # No `darwin` key — but NOT because macOS is unsuited. A large-memory Mac
    # would run this BETTER than the Linux box: the GPU addresses all 81GB of
    # unified memory at 400-800GB/s, whereas a 24GB discrete card leaves most
    # layers on the CPU. It is omitted only because the Mac here is a 36GB
    # MacBook Pro that will never hold it, so the entry would be permanent
    # `skip(oversized)` noise. Restore the darwin key on a 96GB+ Mac.
    # GGUF is the only build upstream ships at this size; no MLX variant exists.
    - linux:   "qwen3.5:122b-a10b-q4_K_M"
      size_gb: 81
      basis:   ram

  gpt-oss:                  # OpenAI open weights (native MXFP4, single build)
    - { darwin: "gpt-oss:20b",                  linux: "gpt-oss:20b",                    size_gb: 14 }
    # 120B MoE — same reasoning as the qwen3.5:122b member above.
    - linux:   "gpt-oss:120b"
      size_gb: 65
      basis:   ram

  glm-4.7-flash:            # strong 30B-class (GGUF only)
    - darwin:  "glm-4.7-flash:q4_K_M"
      linux:   "glm-4.7-flash:q4_K_M"
      size_gb: 19
      kv_kb_per_token: 50        # measured, M4 Max

  # ═══════════════ efficient / small ═══════════════
  # ── arch-split family ──
  gemma4:                   # efficient + vision-capable
    # E2B/E4B are small → full precision everywhere
    - { darwin: "gemma4:e2b-mlx-bf16", linux: "gemma4:e2b-it-bf16", size_gb: 10 }
    - { darwin: "gemma4:e4b-mlx-bf16", linux: "gemma4:e4b-it-bf16", size_gb: 16 }
    - darwin:        "gemma4:12b-mlx"
      linux_nvidia:  "gemma4:12b-nvfp4"
      linux:         "gemma4:12b-it-q4_K_M"
      size_gb:       8
    - darwin:        "gemma4:26b-mlx"
      linux_nvidia:  "gemma4:26b-nvfp4"
      linux:         "gemma4:26b-a4b-it-q4_K_M"
      size_gb:       18
    - darwin:        "gemma4:31b-mlx"
      linux_nvidia:  "gemma4:31b-nvfp4"
      linux:         "gemma4:31b-it-q4_K_M"
      size_gb:       20

  granite4.1:               # enterprise/efficient (GGUF only)
    - { darwin: "granite4.1:3b-bf16",           linux: "granite4.1:3b-bf16",             size_gb: 7 }
    - { darwin: "granite4.1:8b-q8_0",           linux: "granite4.1:8b-q8_0",             size_gb: 10 }
    - { darwin: "granite4.1:30b-q4_K_M",        linux: "granite4.1:30b-q4_K_M",          size_gb: 17 }

  granite4:                 # previous gen (kept for A/B; no bf16 at 3b, uses default tag)
    - { darwin: "granite4:3b",                  linux: "granite4:3b",                    size_gb: 3 }
    - darwin:  "granite4:32b-a9b-h"
      linux:   "granite4:32b-a9b-h"
      size_gb: 19
      kv_kb_per_token: 19        # measured — hybrid Mamba layers, cheapest context here

  lfm2:                     # on-device/edge hybrid MoE (GGUF only)
                            # current gen is lfm2.5 — see small/long-context agents
    - { darwin: "lfm2:24b",                     linux: "lfm2:24b",                       size_gb: 14 }

  # ═══════════════ small / long-context agents ═══════════════
  # Tool-calling models small enough to stay resident for a whole agent loop.
  # Context lengths below are measured (`ollama show`), not marketing numbers.
  #
  # Precision deviates from the usual small→full-precision rule ON PURPOSE:
  # these are chosen as q8_0. At 125-262K context the KV cache — not the
  # weights — dominates memory, so halving the weights buys context headroom,
  # which is what actually limits an agent run.
  #
  # All are GGUF-only upstream (no MLX/NVFP4 builds), so no hardware split:
  # one GGUF runs on Metal, CUDA, ROCm and CPU alike.
  ministral-3:              # 262K ctx · tools + vision · best context-per-GB here
    - darwin:  "ministral-3:3b-instruct-2512-q8_0"
      linux:   "ministral-3:3b-instruct-2512-q8_0"
      size_gb: 5
      kv_kb_per_token: 107       # measured — dearest context of anything here
    - darwin:  "ministral-3:8b-instruct-2512-q8_0"
      linux:   "ministral-3:8b-instruct-2512-q8_0"
      size_gb: 10
      kv_kb_per_token: 107       # assumed same family as the 3b; not separately measured

  lfm2.5:                   # 125K ctx · tools + thinking · 8B MoE w/ 1B active
    - { darwin: "lfm2.5:8b-a1b-q8_0", linux: "lfm2.5:8b-a1b-q8_0", size_gb: 9 }

  # ═══════════════ reasoning ═══════════════
  olmo-3.1:                 # fully-open reasoning
    - { darwin: "olmo-3.1:32b-think-q4_K_M",    linux: "olmo-3.1:32b-think-q4_K_M",      size_gb: 19 }
    - { darwin: "olmo-3.1:32b-instruct-q4_K_M", linux: "olmo-3.1:32b-instruct-q4_K_M",   size_gb: 19 }

  olmo-3:                   # previous gen (kept for A/B)
    - { darwin: "olmo-3:7b-think-q8_0",         linux: "olmo-3:7b-think-q8_0",           size_gb: 8 }
    - { darwin: "olmo-3:32b-think-q4_K_M",      linux: "olmo-3:32b-think-q4_K_M",        size_gb: 19 }

  deepseek-r1:              # RL-reasoning lineage (32b only)
    - { darwin: "deepseek-r1:32b",              linux: "deepseek-r1:32b",                size_gb: 20 }

  # ═══════════════ coding ═══════════════
  # qwen3.6/qwen3.5 also ship coding builds — they live under their own family
  # keys above (a family may appear only once), marked with an inline comment.
  devstral-small-2:         # codebase/agent coding (GGUF only — no hardware split)
    - { darwin: "devstral-small-2:24b",         linux: "devstral-small-2:24b",           size_gb: 15 }

  # ═══════════════ vision / multimodal ═══════════════
  qwen3-vl:                 # vision-language (GGUF only)
    # Only the 8B member is kept. The 30B-A3B one was dropped as redundant:
    # qwen3.6 reports the SAME capabilities (thinking + tools + vision) at the
    # same 256K context, is a newer generation, and at an identical 20GB gives
    # mac a native MLX build where qwen3-vl is GGUF-only. 8B stays because
    # qwen3.6 has no small member — that niche is real.
    - { darwin: "qwen3-vl:8b-instruct-q8_0",        linux: "qwen3-vl:8b-instruct-q8_0",        size_gb: 10 }

  # ═══════════════ embedding / retrieval (full precision, OS-identical) ═══════════════
  embeddinggemma:
    - { darwin: "embeddinggemma:300m-bf16",     linux: "embeddinggemma:300m-bf16",       size_gb: 1 }

  qwen3-embedding:
    - { darwin: "qwen3-embedding:0.6b-fp16",    linux: "qwen3-embedding:0.6b-fp16",      size_gb: 2 }
    - { darwin: "qwen3-embedding:4b-fp16",      linux: "qwen3-embedding:4b-fp16",        size_gb: 8 }
    - { darwin: "qwen3-embedding:8b-fp16",      linux: "qwen3-embedding:8b-fp16",        size_gb: 15 }

  bge-m3:
    - { darwin: "bge-m3:567m-fp16",             linux: "bge-m3:567m-fp16",               size_gb: 2 }

  # reranker (community namespace — not in the official library; uncomment to use)
  # dengcao/Qwen3-Reranker-0.6B:
  #   - { darwin: "dengcao/Qwen3-Reranker-0.6B", linux: "dengcao/Qwen3-Reranker-0.6B",   size_gb: 1 }
