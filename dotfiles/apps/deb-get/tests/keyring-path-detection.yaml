---
# apps/deb-get/tests/keyring-path-detection.yaml
#
# Unit test for the signed-by path detection in tasks/apt-auth.yaml.
# Creates temporary fake apt source files, runs the same discovery logic, and
# asserts the expected keyring paths are returned.
#
# Run: ansible-playbook apps/deb-get/tests/keyring-path-detection.yaml
# Safe: uses a temp directory; does not touch /etc/apt.

- name: "Test deb-get keyring path detection"
  hosts: localhost
  connection: local
  gather_facts: true
  become: false

  vars:
    debget_test_tmp: "/tmp/deb-get-keyring-path-test"
    debget_known_keyrings:
      - name: github-cli
        repo_host: cli.github.com
        url: https://example.com/github.gpg
        default_dest: /etc/apt/keyrings/githubcli-archive-keyring.gpg
      - name: hashicorp
        repo_host: apt.releases.hashicorp.com
        url: https://example.com/hashicorp.gpg
        default_dest: /etc/apt/keyrings/hashicorp-archive-keyring.gpg

  tasks:
    - name: "Setup: create fake apt sources directory"
      ansible.builtin.file:
        path: "{{ debget_test_tmp }}/sources.list.d"
        state: directory
        mode: "0755"

    - name: "Setup: write one-line .list source for github-cli"
      ansible.builtin.copy:
        dest: "{{ debget_test_tmp }}/sources.list.d/github-cli.list"
        content: "deb [arch=amd64 signed-by=/usr/share/keyrings/custom-github.gpg] https://cli.github.com/packages stable main\n"
        mode: "0644"

    - name: "Setup: write deb822 .sources file for hashicorp"
      ansible.builtin.copy:
        dest: "{{ debget_test_tmp }}/sources.list.d/hashicorp.sources"
        content: |
          Types: deb
          URIs: https://apt.releases.hashicorp.com
          Suites: jammy
          Components: main
          Architectures: amd64
          Signed-By: /usr/share/keyrings/custom-hashicorp.gpg
        mode: "0644"

    - name: "Test: discover keyring paths for github-cli and hashicorp"
      ansible.builtin.shell:
        cmd: |
          set -o pipefail
          file=""
          while IFS= read -r candidate; do
            if grep -ql "{{ item.repo_host }}" "$candidate" 2>/dev/null; then
              file="$candidate"
              break
            fi
          done < <(grep -RFl "{{ item.repo_host }}" "{{ debget_test_tmp }}/sources.list.d/" "{{ debget_test_tmp }}/sources.list" 2>/dev/null || true)

          if [[ -z "$file" ]]; then
            echo "{{ item.default_dest }}"
            exit 0
          fi

          dest=""
          if [[ "$file" == *.sources ]]; then
            dest=$(grep -ioP '(?<=^Signed-By:\s).*' "$file" 2>/dev/null | head -n1 || true)
          fi
          if [[ -z "$dest" ]]; then
            dest=$(grep -oP '(?<=signed-by=)[^\] ]+' "$file" 2>/dev/null | head -n1 || true)
          fi
          if [[ -n "$dest" ]]; then
            echo "$dest"
          else
            echo "{{ item.default_dest }}"
          fi
        executable: /bin/bash
      register: debget_test_paths
      changed_when: false
      loop: "{{ debget_known_keyrings }}"

    - name: "Assert github-cli path was read from one-line source"
      ansible.builtin.assert:
        that:
          - debget_test_paths.results[0].stdout | trim == '/usr/share/keyrings/custom-github.gpg'
        success_msg: "PASS: github-cli path resolved from one-line .list file"
        fail_msg: "FAIL: github-cli path was {{ debget_test_paths.results[0].stdout | trim }}"

    - name: "Assert hashicorp path was read from deb822 source"
      ansible.builtin.assert:
        that:
          - debget_test_paths.results[1].stdout | trim == '/usr/share/keyrings/custom-hashicorp.gpg'
        success_msg: "PASS: hashicorp path resolved from deb822 .sources file"
        fail_msg: "FAIL: hashicorp path was {{ debget_test_paths.results[1].stdout | trim }}"

    - name: "Teardown: remove temp test directory"
      ansible.builtin.file:
        path: "{{ debget_test_tmp }}"
        state: absent
      changed_when: true
