---
# apps/bitwarden/tests/topic-metadata.yaml

- name: "Test bitwarden topic metadata"
  hosts: localhost
  connection: local
  gather_facts: false
  become: false

  vars:
    bitwarden_topic_file: "{{ playbook_dir }}/../topic.yml"

  tasks:
    - name: "Load topic.yml"
      ansible.builtin.slurp:
        src: "{{ bitwarden_topic_file }}"
      register: bitwarden_topic_raw

    - name: "Parse topic.yml"
      ansible.builtin.set_fact:
        bitwarden_topic: "{{ bitwarden_topic_raw.content | b64decode | from_yaml }}"

    - name: "Assert required keys are present and valid"
      ansible.builtin.assert:
        that:
          - bitwarden_topic.topic_name == 'bitwarden'
          - bitwarden_topic.topic_tier == 'app'
          - "'Debian' in bitwarden_topic.topic_os"
          - "'bitwarden' in bitwarden_topic.topic_provides"
          - "'mise' in bitwarden_topic.topic_requires"
        success_msg: "PASS: bitwarden topic metadata is valid"
        fail_msg: |
          FAIL: topic metadata invalid:
          {{ bitwarden_topic | to_nice_json }}
