# apps/bitwarden/tasks/install.yaml
# Verify the Bitwarden CLI (`bw`) is available. The binary itself is owned and
# upgraded by the mise topic (see apps/mise/files/config.toml).

- name: "Install: verify Bitwarden CLI is on PATH"
  ansible.builtin.shell:
    cmd: command -v bw >/dev/null 2>&1
    executable: /bin/bash
  register: bitwarden_cli_probe
  changed_when: false
  failed_when: false
  check_mode: false

- name: "Install: fail loudly if bw is missing"
  ansible.builtin.fail:
    msg: |
      The Bitwarden CLI (`bw`) is not on PATH.

      The binary is managed by the mise topic; ensure this line is present in
      apps/mise/files/config.toml under [tools]:

          "bitwarden" = "latest"

      Then run the mise topic first:

          ./run-role.sh mise

      After mise installs `bw`, re-run this topic.
  when: bitwarden_cli_probe.rc != 0

- name: "Install: report Bitwarden CLI version"
  ansible.builtin.command:
    cmd: bw --version
  changed_when: false
  check_mode: false
