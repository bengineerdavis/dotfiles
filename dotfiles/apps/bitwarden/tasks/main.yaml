# apps/bitwarden/tasks/main.yaml — role lifecycle router
#
# Imports lifecycle subtask files with appropriate tags. The parent playbook
# (or a standalone topic playbook) drives which phase runs via --tags.
#
# All five lifecycle files MUST exist in every topic.

- name: "Import bootstrap tasks"
  ansible.builtin.import_tasks: bootstrap.yaml
  tags: [bootstrap, provision]

- name: "Import prerequisites tasks"
  ansible.builtin.import_tasks: prerequisites.yaml
  tags: [prerequisites, provision]

- name: "Import upgrade tasks"
  ansible.builtin.import_tasks: upgrade.yaml
  tags: [upgrade, provision]

- name: "Import install tasks"
  ansible.builtin.import_tasks: install.yaml
  tags: [install, provision]

- name: "Import remove tasks"
  ansible.builtin.import_tasks: remove.yaml
  tags: [remove, never]
