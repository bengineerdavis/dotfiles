# ── macOS: Rancher Desktop provides Docker CLI ────────────────────────────────
- name: "Bootstrap: check Rancher Desktop on macOS"
  ansible.builtin.stat:
    path: /Applications/Rancher Desktop.app
  register: rancher_stat
  when:
    - not docker_stat.stat.exists
    - ansible_facts['os_family'] == 'Darwin'

- name: "Bootstrap: warn if Docker CLI and Rancher Desktop both missing (macOS)"
  ansible.builtin.debug:
    msg: |
      ⚠️  Docker CLI not found and Rancher Desktop not installed.
      Run the rancher-desktop topic role to install it:
        ansible-playbook apps/rancher-desktop/playbook.yaml --tags install
  when:
    - not docker_stat.stat.exists
    - ansible_facts['os_family'] == 'Darwin'
    - not rancher_stat.stat.exists

