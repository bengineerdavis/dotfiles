---
# apps/loreai gateway-service scenario, Debian leg. Run through
# scripts/run-molecule.sh loreai <verb>; README.md explains the lifecycle.
dependency:
  name: galaxy
driver:
  name: vagrant
  provider:
    name: "${MOLECULE_VM_PROVIDER:-libvirt}"
platforms:
  - name: loreai-bookworm
    box: "${MOLECULE_VM_BOX:-debian/bookworm64}"
    memory: 4096
    cpus: 2
    instance_raw_config_args:
      - "vm.synced_folder '${MOLECULE_PROJECT_DIRECTORY}/..', '/repo', type: 'rsync', rsync__exclude: ['.git/', '.venv/', '.molecule/', '.bats/', '.pytest_cache/', '.hypothesis/']"
provisioner:
  name: ansible
  env:
    ANSIBLE_ROLES_PATH: "${MOLECULE_PROJECT_DIRECTORY}"
  inventory:
    host_vars:
      loreai-bookworm:
        ansible_python_interpreter: /usr/bin/python3
verifier:
  name: testinfra
