---
# Prepare a fresh Debian box for the standalone loreai role. No brew, mise,
# agent CLI, or LLM credential is needed: converge selects inference=none.
- name: Prepare the Debian box for apps/loreai
  hosts: all
  gather_facts: true
  become: false
  tasks:
    - name: Install the role's external prerequisites
      ansible.builtin.apt:
        name:
          - ca-certificates
          - curl
          - gzip
          - dbus-user-session
          - rsync
        state: present
        update_cache: true
      become: true

    - name: Record the pre-topic linger state
      ansible.builtin.command:
        cmd: loginctl show-user {{ ansible_facts.user_id }} --property=Linger
      register: loreai_test_linger_before
      changed_when: false

    - name: Save the linger baseline for the post-converge comparison
      ansible.builtin.copy:
        content: "{{ loreai_test_linger_before.stdout }}\n"
        dest: /tmp/loreai-molecule-linger-before
        mode: "0644"
