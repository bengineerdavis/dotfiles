# apps/loreai/tasks/agents/hermes.yaml — extension: hermes
# Included by agents.yaml only when hermes was detected. lore setup is
# documented idempotent (re-running updates the fields it owns and preserves
# the rest); it is a converge operation, so changed_when stays false and the
# output is reported instead of parsed.

- name: "loreai: configure hermes to route through the gateway"
  ansible.builtin.command: "{{ loreai_install_dir }}/lore setup hermes"
  register: loreai_setup_hermes
  changed_when: false

- name: "loreai: report the hermes setup"
  ansible.builtin.debug:
    msg: >-
      lore setup hermes: {{ loreai_setup_hermes.stdout_lines | default([]) | join(' | ') }}
