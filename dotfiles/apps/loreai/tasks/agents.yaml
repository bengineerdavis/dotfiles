# apps/loreai/tasks/agents.yaml
#
# Each supported coding agent is an "extension" of this topic: detected on
# the machine, then configured by `lore setup <app>` (idempotent; writes the
# agent's persistent routing config). Detection mirrors lore's own — a CLI
# on PATH, plus an existing config file for codex (Codex Desktop ships no
# CLI). opencode is handled separately: chezmoi owns opencode.jsonc on this
# fleet, so its integration is a plugin fragment the chezmoi template
# includes, verified in agents/opencode.yaml.

- name: "loreai: probe for supported coding agents"
  # The shell form, not the command module: the command module passes `||`
  # as a literal operand, and `command -v a b c` then resolves ANY token —
  # a false-positive detection machine (roborev review, PR #70).
  ansible.builtin.shell:
    cmd: command -v {{ item.probe | quote }} >/dev/null 2>&1
  register: loreai_agent_probes
  changed_when: false
  failed_when: false
  check_mode: false  # read-only probe; keeps --check detection honest
  loop: "{{ loreai_setup_agents }}"
  loop_control:
    label: "{{ item.app }}"

- name: "loreai: probe for a codex config (Codex Desktop has no CLI)"
  ansible.builtin.stat:
    path: "{{ item.config_fallback }}"
  register: loreai_codex_config_stat
  when: item.config_fallback is defined
  loop: "{{ loreai_setup_agents }}"
  loop_control:
    label: "{{ item.app }}"

- name: "loreai: configure each detected agent"
  ansible.builtin.include_tasks: "agents/{{ item.0.app }}.yaml"
  loop: "{{ loreai_setup_agents | zip(loreai_agent_probes.results) | list }}"
  loop_control:
    label: "{{ item.0.app }}"
  when: >
    item.1.rc == 0
    or (item.0.config_fallback is defined
        and loreai_codex_config_stat.results is defined
        and (loreai_codex_config_stat.results
             | selectattr('item.app', 'equalto', item.0.app) | first).stat.exists)

- name: "loreai: probe for opencode (CLI or deployed config)"
  ansible.builtin.shell:
    cmd: >-
      command -v opencode >/dev/null 2>&1
      || test -f "$HOME/.config/opencode/opencode.jsonc"
  register: loreai_opencode_probe
  changed_when: false
  failed_when: false
  check_mode: false  # read-only probe; keeps --check detection honest

- name: "loreai: verify the opencode extension"
  ansible.builtin.include_tasks: agents/opencode.yaml
  when: loreai_opencode_probe.rc == 0

- name: "loreai: note whether codex configured via its config-file fallback"
  # The report must match what the configure step actually did: a codex
  # configured via ~/.codex/config.toml has a failed CLI probe and is NOT
  # undetected (roborev round 2).
  ansible.builtin.set_fact:
    loreai_codex_fallback_hit: >-
      {{ loreai_codex_config_stat.results is defined
         and (loreai_codex_config_stat.results
              | selectattr('item.app', 'equalto', 'codex')
              | first).stat.exists }}

- name: "loreai: report undetected agents"
  ansible.builtin.debug:
    msg: >-
      Not detected, so not configured:
      {{ loreai_setup_agents | zip(loreai_agent_probes.results)
         | rejectattr('1.rc', 'eq', 0) | map(attribute='0.app') | list
         | difference(loreai_codex_fallback_hit | ternary(['codex'], []))
         | join(', ') }}.
      Install one and re-run the topic, or run `lore setup <app>` by hand.
  when: >
    loreai_setup_agents | zip(loreai_agent_probes.results)
    | rejectattr('1.rc', 'eq', 0) | map(attribute='0.app') | list
    | difference(loreai_codex_fallback_hit | ternary(['codex'], []))
    | length > 0
