# apps/loreai/defaults/main.yaml
#
# loreai — Lore.AI (https://withlore.ai), a persistent-memory gateway for AI
# coding agents. Agents route through the gateway (`lore run`, or persistent
# `lore setup <app>` config); it records sessions, distills them in the
# background, and injects curated knowledge back into later sessions.
#
# ── Why not `curl … | bash`? ─────────────────────────────────────────────────
# The hosted installer downloads one standalone executable from GitHub
# releases and verifies it against the release's lore-checksums.txt. We do
# the same two steps natively (the apps/ori pattern), which keeps the install
# idempotent, change-reporting, checksum-verified and precisely removable.
# What we deliberately do NOT inherit from the installer: its shell-profile
# edit (PATH is this topic's files/zsh/path.zsh instead), its ~/.lore
# receipt/channel files (lore uninstall is not our teardown — remove.yaml
# is), and its telemetry default (the operator chooses on first install).

# 'latest' (the newest published release) or a pinned tag such as '0.41.0'
# for a reproducible install. Upgrades need no version parsing: get_url
# compares the on-disk binary against the published SHA256 and only
# re-downloads on a mismatch, so `--tags upgrade` swaps the binary and an
# unchanged release is a no-op. Every install task carries the upgrade tag
# because no system role reaches a GitHub-release binary (docs/TOPICS.md
# § "Presence vs currency").
loreai_release_tag: latest

# Must be on PATH. files/zsh/path.zsh prepends it (self-guarding), and
# ~/.local/bin is already on PATH via dot_zshrc on this fleet.
loreai_install_dir: "{{ ansible_env.HOME }}/.local/bin"

# ── Per-machine answers ──────────────────────────────────────────────────────
# First install asks the operator (tasks/prompts.yaml, the FIRST thing
# install.yaml imports, so nobody walks away leaving a run blocked) and
# writes the answers to loreai_env_file. Later runs read the file and never
# prompt. Re-answer by deleting the file and re-running, or by editing it.
# For a non-interactive run pass BOTH -e loreai_telemetry=0|1 and
# -e loreai_inference=openrouter|local|none (plus -e loreai_worker_model=
# to override the model default), or the run fails fast before changing
# anything.
loreai_config_dir: "{{ ansible_env.HOME }}/.config/loreai"
loreai_env_file: "{{ loreai_config_dir }}/env.zsh"

# Defaults for the prompts. Telemetry ON matches the author ruling of
# 2026-10-21 (production builds send privacy-filtered operational telemetry
# to Sentry; https://withlore.ai/docs/install/#operational-telemetry).
loreai_telemetry: ~
loreai_inference: ~
loreai_worker_model: ~

# ── Worker-model candidates (the decision record lives in README.md) ────────
# Lore has ONE worker model for all background pipelines (distillation,
# curation, query expansion — verified in BYK/loreai source: no per-pipeline
# knob), so the pick must clear the hardest bar: curation, the judgment
# task. IDs verified against the live OpenRouter catalog 2026-10-21.
loreai_worker_model_openrouter_default: "openrouter/z-ai/glm-5.3-flash"
loreai_worker_model_local_default: "ollama/qwen3.6:35b-a3b-coding-nvfp4"
loreai_local_upstream: "http://localhost:11434"

# Reviewed alternates, written into the machine env file as comments so
# switching is a one-line edit. `primary` names the fleet default; the rest
# are fallbacks. Prices are prompt/completion $/Mtok from the OpenRouter
# catalog, 2026-10-21 — they drift; re-check before switching.
loreai_worker_model_candidates:
  - id: "openrouter/z-ai/glm-5.3-flash"        # 0.004/0.134, 1M ctx
    role: primary
    note: already this fleet's opencode default — no new trust boundary
  - id: "openrouter/anthropic/claude-haiku-5.5" # 0.10/0.50, 1M ctx
    role: fallback
    note: workers stay inside the Anthropic boundary Claude Code uses
  - id: "openrouter/z-ai/glm-4.7-flash"        # 0.061/0.40, 200K ctx
    role: fallback
    note: previous generation
  - id: "openrouter/qwen/qwen3.8-27b"          # 0.040/1.35, 1M ctx
    role: fallback
    note: open weights
  - id: "openrouter/qwen/qwen3-32b"            # 0.08/0.28, 131K ctx
    role: fallback
    note: open weights, 32B-class
  - id: "openrouter/openai/gpt-oss-120b"       # 0.15/0.60, 131K ctx
    role: fallback
    note: open-weights 120B
  - id: "openrouter/deepseek/deepseek-v4.1-flash" # 0.024/0.375, 1M ctx
    role: fallback
    note: the "deepseek pro flash" ask — v4.1-flash is the flash line
  - id: "openrouter/moonshotai/kimi-k3"        # 0.239/11.94, 1M ctx
    role: fallback
    note: strong but completion-priced ~50x prompt
  - id: "openrouter/moonshotai/kimi-k2.7-code" # 0.671/3.35, 262K ctx
    role: fallback
    note: code-specialised

# Local (ollama) tier for a machine powerful enough to run 32B-class models
# — Lore's stated floor for curation parity is 32B+ at Q4 or better; below
# that, run distillation-only with the curator disabled. Tags are house-
# measured in apps/ollama/MODELS.md. qwen3.8 is a watch item: on OpenRouter
# as qwen/qwen3.8-27b but not yet in the apps/ollama manifest.
loreai_worker_model_local_candidates:
  - id: "ollama/qwen3.6:35b-a3b-coding-nvfp4"  # 21 GB, MoE 3B active — fast
  - id: "ollama/qwen3.6:27b-coding-nvfp4"      # 19 GB dense
  - id: "ollama/granite4:32b-a9b-h"            # 19 GB, 1M ctx

# ── Agent detection ──────────────────────────────────────────────────────────
# Each entry is one "extension": lore setup <app> writes that agent's
# persistent routing config. Detection mirrors lore's own: a CLI on PATH;
# codex also counts an existing ~/.codex/config.toml (Codex Desktop has no
# CLI). opencode is NOT here — chezmoi owns opencode.jsonc on this fleet, so
# its extension is the plugin fragment the chezmoi template includes
# (files/opencode/lore-plugin.jsonc), verified by tasks/agents/opencode.yaml.
loreai_setup_agents:
  - app: claude-code
    probe: claude
    writes: "~/.claude/settings.json (env.ANTHROPIC_BASE_URL + DISABLE_AUTO_COMPACT)"
  - app: codex
    probe: codex
    config_fallback: "{{ ansible_env.HOME }}/.codex/config.toml"
    writes: "~/.codex/config.toml (lore_http provider + auto-compact off)"
  - app: pi
    probe: pi
    writes: "~/.pi/agent/models.json (providers' baseUrl → gateway)"
  - app: hermes
    probe: hermes
    writes: "~/.hermes/.env (OPENAI_BASE_URL + HERMES_INFERENCE_PROVIDER=custom)"

# Runtime state remove.yaml preserves (the memory database is the whole
# point of the tool; mirrors `lore uninstall`'s default of keeping data):
loreai_preserved_dirs:
  - "{{ ansible_env.HOME }}/.local/share/lore"   # lore.db, logs, gateway state
  - "{{ ansible_env.HOME }}/.lore"               # release channel + update metadata
