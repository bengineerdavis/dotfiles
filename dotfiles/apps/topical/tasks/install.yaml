# apps/topical/tasks/install.yaml
# Thin install for the topical generator: a clone at the LAYOUT.md location
# plus a ~/bin symlink. The clone is the single source of the tool; this
# topic owns presence, currency (pull on rerun) and teardown.

# ── Guard: a pre-existing checkout path must be a git clone ─────────────────
- name: "Check whether the topical checkout path already exists"
  ansible.builtin.stat:
    path: "{{ topical_checkout }}"
  register: topical_checkout_stat

- name: "Check for a git dir inside the existing checkout"
  ansible.builtin.stat:
    path: "{{ topical_checkout }}/.git"
  register: topical_checkout_git_stat
  when: topical_checkout_stat.stat.exists

- name: "Fail with the fix if the checkout path is taken by a non-clone"
  ansible.builtin.fail:
    msg: >-
      {{ topical_checkout }} exists but is not a git checkout. Move it aside
      (or delete it) and re-run — this topic clones {{ topical_repo }}
      there. Nothing has been installed or moved.
  when:
    - topical_checkout_stat.stat.exists
    - not topical_checkout_git_stat.stat.exists

# ── The clone ───────────────────────────────────────────────────────────────
# Tagged [install, upgrade]: re-running pulls origin/main, which is this
# topic's whole upgrade path — no system role reaches a git clone.
- name: "Clone or update the topical repo"
  ansible.builtin.git:
    repo: "{{ topical_repo }}"
    dest: "{{ topical_checkout }}"
    version: main
  tags: [install, upgrade]

# ── The ~/bin symlink ───────────────────────────────────────────────────────
- name: "Symlink topical into ~/bin"
  ansible.builtin.file:
    src: "{{ topical_checkout }}/topical"
    dest: "{{ ansible_facts['env']['HOME'] }}/bin/topical"
    state: link
    force: true
  tags: [install, upgrade]
