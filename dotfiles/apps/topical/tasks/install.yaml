# apps/topical/tasks/install.yaml
# Installs the topical CLI as a uv tool from the git remote. uv tool owns
# the environment and the ~/.local/bin shim; this topic owns presence,
# currency and teardown. topic_requires: [uv] guarantees the binary.

- name: "List installed uv tools"
  ansible.builtin.command: uv tool list
  register: topical_uv_tools
  changed_when: false
  check_mode: false  # read-only probe; --check must see it to gate on it

- name: "Install topical as a uv tool"
  ansible.builtin.command: "uv tool install {{ topical_install_spec }}"
  when: topical_uv_tools.stdout is not search("^topical v", multiline=True)
