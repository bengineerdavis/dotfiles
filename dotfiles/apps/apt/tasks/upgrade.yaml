# ──────────────────────────────────────────────────────────────────────────────
# apps/apt/tasks/upgrade.yaml
# ──────────────────────────────────────────────────────────────────────────────
# System-level apt upgrade. Topics do NOT own upgrade logic.
#
# Order matters. Retired sources and signing keys are fixed first, because
# either one makes apt-get update exit 100 and the module hard-fails after its
# retries — the 2026-09-20 failure was a dead repo (proget.makedeb.org, HTTP
# 530) plus two keyrings the old repair had written empty or stale.

- name: "Upgrade: retire dead sources"
  ansible.builtin.import_tasks: retired.yaml

- name: "Upgrade: repair signing keyrings"
  ansible.builtin.import_tasks: keyrings.yaml

# The audit runs its own apt-get update, before the module's, so a failing
# source is reported by name even when the refresh below then fails. It never
# fails the play and never edits a source.
- name: "Upgrade: audit sources (report only)"
  ansible.builtin.shell:
    cmd: >-
      set -o pipefail;
      apt-get -o DPkg::Lock::Timeout={{ apt_lock_timeout }} update 2>&1
      | /usr/bin/python3 {{ role_path }}/files/apt_source_audit.py
      --state {{ apt_source_audit_state }}
      --threshold {{ apt_source_audit_threshold }}
      {{ '--check' if ansible_check_mode else '' }}
    executable: /bin/bash
  register: apt_source_audit
  changed_when: false
  failed_when: false
  check_mode: false
  become: true

- name: "Upgrade: report failing sources"
  ansible.builtin.debug:
    msg: >-
      {{ f.host }}: {{ f.kinds | join(', ') }}
      — {{ f.consecutive_runs }} consecutive run(s)
      {%- if f.retirement_candidate %}. Retirement candidate: add it to
      apt_retired_sources if it is gone for good.{% endif %}
  loop: "{{ (apt_source_audit.stdout | from_json).failures | default([]) }}"
  loop_control:
    loop_var: f
    label: "{{ f.host }}"
  when: apt_source_audit.stdout is match('^\{')

- name: "Upgrade: update apt cache"
  ansible.builtin.apt:
    update_cache: true
    lock_timeout: "{{ apt_lock_timeout }}"
  become: true

- name: "Upgrade: upgrade all apt packages"
  ansible.builtin.apt:
    upgrade: dist
    lock_timeout: "{{ apt_lock_timeout }}"
  become: true
  register: apt_upgrade_result

- name: "Upgrade: report"
  ansible.builtin.debug:
    msg: "apt upgrade complete — changed: {{ apt_upgrade_result.changed }}"
