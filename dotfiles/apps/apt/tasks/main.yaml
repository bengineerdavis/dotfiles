# apps/apt/tasks/main.yaml
# Imports subtask files by tag. Only imports files that exist.
# chezmoi owns dotfile/config state. zsh sources handle shell config.
# This file owns: package installation and explicit removal only.

- name: "Import install tasks"
  ansible.builtin.import_tasks: install.yaml
  tags: [install, provision]

- name: "Import remove tasks"
  ansible.builtin.import_tasks: remove.yaml
  tags: [remove]
