# apps/chrome/defaults/main.yaml
#
# ── Browser extension manifest — single source of truth ──────────────────────
# Consumed by install.yaml / upgrade.yaml and by the `browser-ext` CLI
# (apps/chrome/files/browser-ext). Every extension is one entry in
# `chrome_extensions`, discriminated by `source`.
#
#   • add an extension    → `browser-ext add store <id>` or
#                           `browser-ext add git <repo-url>` (appends here)
#   • drop an extension   → delete its entry; the next run prunes what it owned
#   • audit               → `browser-ext status` / `browser-ext drift`
#   • update git sources  → `--tags upgrade`, or `browser-ext sync`
#
# ── The schema is deliberately browser-agnostic ──────────────────────────────
# `source`, `name`, `why` and the git fields mean the same thing for any
# browser; only the *mechanism* that consumes them is Chrome-specific and lives
# in tasks/. A firefox or edge topic reuses this schema verbatim and supplies
# its own installer tasks. See TODO-ide-extensions.md for the same idea applied
# to editors, which is deferred rather than forgotten.
#
#   source: store   Installed from the browser's extension marketplace by
#                   seeding a JSON file into External Extensions (see below).
#     id:           marketplace extension ID (required)
#
#   source: git     Cloned from a repository, optionally built, then loaded by
#                   hand once. For extensions that are not in the marketplace.
#     slug:         directory name under chrome_unpacked_root (required)
#     repo:         clone URL (required)
#     ref:          tag/branch/SHA to pin (required — see "pin the ref" below)
#     build:        shell command run in the clone after checkout (optional)
#     load_subdir:  subdirectory Chrome actually loads (optional; default ".")
#
# Common to both: `name` (human label) and `why` (why this machine has it).

chrome_web_store_update_url: "https://clients2.google.com/service/update2/crx"

chrome_external_extensions_dir: >-
  {{ ansible_facts['env']['HOME'] }}/Library/Application Support/Google/Chrome/External Extensions

# Where `source: git` extensions are cloned. Chrome derives an unpacked
# extension's ID by hashing its absolute load path, so this root has to be
# stable forever — see "why the path is the whole game" below.
chrome_unpacked_root: "{{ ansible_facts['env']['HOME'] }}/code/work/sentry/browser/chrome-extensions"

# ── How `source: store` works, and what it deliberately does NOT do ──────────
# Chrome reads the External Extensions directory at launch. A file named
# <extension-id>.json containing an external_update_url pointing at the Web
# Store causes Chrome to install that extension.
#
# This is NOT enterprise policy and NOT a force-install:
#   • needs no admin rights and touches nothing under /Library
#   • you can still disable or uninstall any seeded extension yourself
#   • Chrome may show a one-time "new extension added" prompt
#   • seeds apply to the Chrome *user* — expect them offered across all
#     profiles, not just the work one
#
# macOS restriction that forces the store/git split: "as of Chrome 44, no
# external installs are allowed from a path to a local CRX file on Mac OS."
# On macOS every external_update_url MUST point at the Web Store, so anything
# not published there cannot be seeded at all and must use source: git.

# ── Why the path is the whole game for `source: git` ─────────────────────────
# Chrome derives an unpacked extension's ID by hashing its absolute filesystem
# path. Loading v1.0.1 from ~/Downloads/fintastic-1.0.1 and v1.1.1 from
# ~/Downloads/fintastic-1.1.1 does not upgrade anything — it registers two
# unrelated extensions with two IDs, both claiming the same content-script
# matches. That already happened here: three loads produced three IDs, two of
# which now point at deleted directories and show as error cards.
#
# Cloning to one fixed path per slug ends that. The clone is updated in place
# (git fetch + checkout), so the load path never changes, the ID never changes,
# and a version bump replaces the extension instead of forking a new one.
#
# ── Pin the ref ──────────────────────────────────────────────────────────────
# `ref` is required rather than defaulting to a branch, on purpose. A branch
# means the extension silently changes under you on any run that happens to
# fetch — for an extension with content scripts on a page full of customer
# data, that is a change you want to make deliberately. Bump the tag, re-run,
# and reload once in chrome://extensions.

chrome_extensions:
  - source: store
    id: mpdajninpobndbfcldcmbpnnbhibjmch
    name: "SAML-tracer"
    why: >-
      Inspects SAML/SSO exchanges in-browser. Core support-debugging tool for
      customer auth escalations.

  - source: store
    id: nkeoojidblilnkcbbmfhaeebndapehjk
    name: "Trotto go links"
    why: >-
      Resolves go/ links. Installed in all four profiles independently, which
      is the clearest signal in the audit that it is load-bearing.

  - source: store
    id: ddippghibegbgpjcaaijbacfhjjeafjh
    name: "ContextSearch web-ext"
    why: >-
      Right-click search across multiple engines. Work-profile only.

  - source: git
    slug: fintastic
    name: "Fintastic — Intercom → Sentry Quick-Links"
    repo: "git@github.com:trjuntunen/fintastic.git"
    # v1.2.0; the hand-installed copy in ~/Documents was v1.1.2.
    #
    # This tag was FORCE-MOVED upstream on 2026-09-09, from 601e1a7 ("Merge
    # feat/conversation-participants into main") to b08de80 ("Tell 'no orgs
    # found' apart from 'no orgs answered yet'") — a 13-file diff touching
    # src/identity.js. The move was reviewed and accepted deliberately via
    # `-e chrome_allow_moved_refs=true`; the clone and dist/ are built from
    # b08de80. Recorded here because "v1.2.0" alone no longer identifies a
    # commit, which is precisely the failure mode the guard exists to catch.
    ref: v1.2.0
    # A bare clone is NOT loadable. scripts/build.mjs (esbuild) bundles
    # @sentry/browser into src/telemetry.js and writes the loadable extension
    # to dist/, which is gitignored. The GitHub releases are source-only tags
    # with no attached assets, so there is no prebuilt artifact to fetch —
    # building is the only route.
    build: "npm ci --no-audit --no-fund && npm run build"
    load_subdir: dist
    why: >-
      Surfaces Sentry admin/org deep links for the customer in the current
      Intercom conversation. Reads only /ember/users/ and
      /ember/inbox/conversations/, forwarding a hand-picked field set rather
      than the raw response.

# ── Behaviour flags ──────────────────────────────────────────────────────────

# Write the External Extensions seed JSONs for `source: store` entries.
chrome_seed_extensions: true

# Remove seed JSONs that no manifest entry claims.
chrome_prune_orphan_seeds: true

# Run each git entry's `build` after checkout. Set false on a machine without a
# node toolchain; the clone still lands, it just will not be loadable.
chrome_build_git_extensions: true

# Accept an upstream tag that has been force-moved to a different commit.
#
# Off by default, and it should stay off. A moved tag means the same `ref` in
# this manifest now resolves to different code — for an extension whose content
# scripts run over customer conversations, that is the silent substitution
# pinning exists to prevent. The upgrade tasks detect the case and fail with the
# two commit SHAs so you can read the diff first.
#
# Pass it for a single deliberate run once you have looked:
#   ansible-playbook apps/chrome/playbook.yaml --tags upgrade -e chrome_allow_moved_refs=true
# It also sets git's `force`, which discards local modifications in the clone.
chrome_allow_moved_refs: false

# Report unpacked extensions Chrome loaded from outside chrome_unpacked_root.
# A working copy in ~/Downloads survives only until that folder is cleaned up,
# and the next load from a new folder forks another ID. Reported, never moved —
# relocating source out from under a running Chrome breaks the load.
chrome_unpacked_warn_volatile: true

# Teardown guard. Chrome here is installed and auto-updated by Google Keystone
# under MDM, not by Homebrew, so `--tags remove` must NOT uninstall the browser
# by default — that would fight IT and take the managed enrollment with it.
chrome_remove_browser: false

# Teardown guard for cloned extension source. Off by default: a clone may hold
# uncommitted local work, and deleting someone's working tree on a `remove` is
# not a surprise anyone should get.
chrome_remove_git_clones: false

# ── Deliberately NOT managed ─────────────────────────────────────────────────
# Everything installed locally that this topic will not seed, and why. Data
# rather than a comment so `browser-ext drift` can tell a reasoned exclusion
# apart from something that appeared without your noticing.
#
# `verdict` values:
#   it-owned   pushed by the org's IT via the Chrome admin console. A competing
#              local seed would produce confusing double-install state.
#   built-in   ships with Chrome; there is nothing to seed.
#   review     an unresolved decision, surfaced every run until you either
#              promote it to chrome_extensions or uninstall it.
chrome_extensions_ignored:
  - id: callobklhcbilhphinckomhgkigmfocg
    name: "Endpoint Verification"
    verdict: it-owned
    why: "MDM/admin-console pushed; present in all four profiles."

  - id: glnpjglilkicbckjpbgcfkogebgllemb
    name: "Okta Browser Plugin"
    verdict: it-owned
    why: "Corporate SSO, managed centrally."

  - id: ghbmnnjooekpmoecnnnilnnbdlolhkhi
    name: "Google Docs Offline"
    verdict: built-in

  - id: nmmhkkegccagdldgiimedpiccmgmieda
    name: "Chrome Web Store Payments"
    verdict: built-in

  - id: aeblfdkhhhdcdjpifhhbdiojplfjncoa
    name: "1Password – Password Manager"
    verdict: review
    why: "Runs alongside Bitwarden on Profiles 1 and 3. Pick one."

  - id: nngceckbapebfimnlniiiahkandclblb
    name: "Bitwarden Password Manager"
    verdict: review
    why: "Runs alongside 1Password on Profiles 1 and 3. Pick one."

  - id: aodmmfoailkaooghgfgcbnjedohnfjlf
    name: "Copy All Links - Premium Features"
    verdict: review
    why: "Overlaps Umbrella - Copy All URLs. Keep one."

  - id: iodlbflkegnangnopebgjojlgmcbbpdh
    name: "Umbrella - Copy All URLs"
    verdict: review
    why: "Overlaps Copy All Links. Keep one."

  - id: ecnfmmdoiiihbbpenbgdienmdpejbmdj
    name: "PerkSpot: Save While You Shop"
    verdict: review
    why: >-
      Shopping/coupon extension on the profile signed in with the work account.
      Coupon extensions typically hold broad all-sites read/write, and that
      profile is where customer data is viewed. Worth a deliberate decision.
