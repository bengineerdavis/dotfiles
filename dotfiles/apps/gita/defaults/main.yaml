# apps/gita/defaults/main.yaml

# Where the repo catalogue lives. Role-relative, like config/editors.yaml:
# role_path is dotfiles/apps/gita, so ../../config/repos.yaml is
# dotfiles/config/repos.yaml. This is the same interim role-relative read the
# vscode/herdr topics use, to be replaced by topic_subscribes later.
gita_catalogue_path: "{{ role_path }}/../../config/repos.yaml"

# The code root the catalogue paths are relative to.
gita_code_root: "{{ ansible_facts['env']['HOME'] }}/code"

# Teardown of the registration is opt-in. `gita clear` removes EVERY repo and
# group gita knows about, including any added by hand — so a plain
# --tags remove keeps the index and only the flag below wipes it.
gita_remove_registration: false
# ── work: reconciled recursively, never catalogued ───────────────────────────
#
# Work repos are deliberately absent from the committed catalogue (spec.md §
# Data: employer-identifying strings stay machine-local). The topic still
# owns their registration: on every install it reconciles the whole work root
# into ONE machine-local group — prunes registrations whose repos left the
# disk, registers what appeared (recursively, vendored junk skipped), and
# sweeps every work-root registration into the group. No repo name is ever
# committed; they exist only in gita's own CSVs and the machine-local layout
# overlay.

# The work tree root, walked recursively on install. Machines without one
# (fresh, personal-only) skip the whole reconciliation.
gita_work_root: "{{ ansible_facts['env']['HOME'] }}/code/work"

# The single group every work-root registration lands in. Generic on
# purpose — the name travels in this committed file.
gita_work_group: work
