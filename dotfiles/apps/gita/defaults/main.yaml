# apps/gita/defaults/main.yaml

# Where the repo catalogue lives. Role-relative, like config/editors.yaml:
# role_path is dotfiles/apps/gita, so ../../config/repos.yaml is
# dotfiles/config/repos.yaml. This is the same interim role-relative read the
# vscode/herdr topics use, to be replaced by topic_subscribes later.
gita_catalogue_path: "{{ role_path }}/../../config/repos.yaml"

# The code root the catalogue paths are relative to.
gita_code_root: "{{ ansible_facts['env']['HOME'] }}/code"

# Teardown of the registration is opt-in. `gita clear` removes EVERY repo and
# group gita knows about, including any added by hand — so a plain
# --tags remove keeps the index and only the flag below wipes it.
gita_remove_registration: false