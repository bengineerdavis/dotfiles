# apps/dotagents/tasks/remove.yaml
# Teardown for the shared skill set.
#
# The artifacts are user-global: every agent runtime on the machine loads
# ~/.agents/skills. Removing the tool that triggered the sync must not silently
# strip that shared library, so both teardown steps sit behind one flag that
# defaults to false.

- name: "Remove every skill and plugin from each approved source"
  # By source, not by skill: this topic does not know which skills exist, and
  # `dotagents remove <source>` removes every dependency from it. -y skips the
  # confirmation, which has no terminal to answer it under Ansible.
  ansible.builtin.command:
    cmd: dotagents --user remove {{ item.source }} -y
  environment:
    PATH: "{{ ansible_facts['env']['HOME'] }}/.local/share/mise/shims:{{ ansible_facts['env']['PATH'] }}"
  loop: "{{ dotagents_sources }}"
  loop_control:
    label: "{{ item.source }}"
  register: dotagents_skill_remove
  # Same reason as install.yaml: dotagents writes its errors to stderr and
  # leaves stdout empty, so failing here would discard the only diagnosis.
  failed_when: false
  changed_when: "'Removed' in dotagents_skill_remove.stdout"
  when: dotagents_remove_skills | bool

- name: "Stop trusting each approved source"
  # The trust entries are state this topic created, so the CRUD invariant in
  # docs/TOPICS.md says it tears them down. Gated behind the same flag: leaving
  # a source trusted while its skills are gone is harmless, but removing trust
  # while another topic still installs from it is not.
  ansible.builtin.command:
    cmd: dotagents --user trust remove {{ item.source }}
  environment:
    PATH: "{{ ansible_facts['env']['HOME'] }}/.local/share/mise/shims:{{ ansible_facts['env']['PATH'] }}"
  loop: "{{ dotagents_sources }}"
  loop_control:
    label: "{{ item.source }}"
  register: dotagents_trust_remove
  failed_when: false
  changed_when: "'Removed' in dotagents_trust_remove.stdout"
  when: dotagents_remove_skills | bool

- name: "Fail with everything dotagents could not remove"
  vars:
    dotagents_remove_failures: >-
      {{ (dotagents_skill_remove.results | default([])
          + dotagents_trust_remove.results | default([]))
         | rejectattr('rc', 'eq', 0)
         | rejectattr('stderr', 'search', 'not found|not declared|Not trusted') | list }}
  ansible.builtin.fail:
    msg: >-
      dotagents could not remove
      {{ dotagents_remove_failures | map(attribute='item.source') | unique | join(', ') }}.
      What it actually said:
      {{ dotagents_remove_failures | map(attribute='stderr') | map('trim')
         | select | join(' | ')
         | default('nothing on stderr; re-run the failing command by hand', true) }}
  when:
    - dotagents_remove_skills | bool
    - dotagents_remove_failures | length > 0

# ── What is intentionally NOT removed here ───────────────────────────────────
# ~/.agents/agents.toml and ~/.agents/agents.lock are dotagents' own state. A
# source removal edits the manifest; deleting the manifest is not a teardown of
# this topic but the removal of the machine's declaration, and a machine may
# hold declarations this repo does not know about. Delete it by hand if that is
# the intent.
#
# The binary is a mise tool: removing this topic also removes the sync, so
# uninstall the tool through apps/mise if the whole thing is going away.
