# apps/opencode/playbook.yaml
# Standalone runner for this topic role.
# Usage: ansible-playbook apps/opencode/playbook.yaml [--tags install|provision|remove]
#   A bare run (no --tags) runs provision; remove is opt-in via --tags remove (tagged never).
#
# Assumes package managers are already bootstrapped.
# For a fresh machine use the parent playbook with --tags provision instead.

- name: "Run opencode role standalone"
  hosts: localhost
  connection: local
  gather_facts: true
  become: false

  roles:
    - role: apps/opencode
