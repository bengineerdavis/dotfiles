# apps/opencode/tasks/remove.yaml
# Teardown for everything install.yaml creates, per the CRUD ownership
# invariant in docs/TOPICS.md. Two states are deliberately guarded behind
# flags (see defaults/main.yaml) because they are shared beyond this topic.

# ── The binary ───────────────────────────────────────────────────────────────
- name: "Uninstall opencode from the pinned tap"
  community.general.homebrew:
    name: "{{ opencode_tap }}/opencode"
    state: absent

- name: "Untap {{ opencode_tap }}"
  community.general.homebrew_tap:
    name: "{{ opencode_tap }}"
    state: absent
  # Off by default. The tap is shared infrastructure: any other formula could
  # come from it later, and removing a tap someone else relies on is not a
  # surprise a `remove` should spring. Flip opencode_remove_tap deliberately.
  when: opencode_remove_tap | bool

# Install leaves TWO trust entries, not one. `brew trust --tap` writes the tap
# entry; `brew install` then writes a formula entry of its own
# (anomalyco/tap/opencode). Measured on Homebrew 7.0.1, 2026-09-14:
# `brew untrust --tap` removes only the tap entry and leaves the formula one
# behind, so tearing down trust takes both commands. Both are idempotent — an
# entry that is already gone reports "Not trusted" and exits 0.
#
# Both are gated on the same flag as the untap, because tap, trust and formula
# trust are one unit: a trusted tap that is no longer tapped is harmless, but
# revoking trust while the tap is still present would break every other
# formula installed from it.

- name: "Stop trusting the opencode formula from {{ opencode_tap }}"
  ansible.builtin.command:
    cmd: "brew untrust --formula {{ opencode_tap }}/opencode"
  register: opencode_untrust_formula
  changed_when: "'Not trusted' not in opencode_untrust_formula.stdout"
  when: opencode_remove_tap | bool

- name: "Stop trusting the tap: {{ opencode_tap }}"
  # Last, mirroring the install order (trust → tap → install) in reverse.
  ansible.builtin.command:
    cmd: "brew untrust --tap {{ opencode_tap }}"
  register: opencode_untrust_tap
  changed_when: "'Not trusted' not in opencode_untrust_tap.stdout"
  when: opencode_remove_tap | bool

# ── The shared skill set ─────────────────────────────────────────────────────
- name: "Remove every skill from each approved source"
  # By source, not by skill: the topic no longer knows which skills exist, and
  # `dotagents remove <source>` removes every dependency from it. -y skips the
  # confirmation, which has no terminal to answer it under Ansible.
  ansible.builtin.command:
    cmd: >-
      npx -y @sentry/dotagents@latest --user
      remove {{ item.source }} -y
  environment:
    PATH: "{{ ansible_facts['env']['HOME'] }}/.local/share/mise/shims:{{ ansible_facts['env']['PATH'] }}"
  loop: "{{ opencode_skill_sources }}"
  loop_control:
    label: "{{ item.source }}"
  register: opencode_skill_remove
  # Same reason as install.yaml: dotagents writes its errors to stderr and
  # leaves stdout empty, so failing here would discard the only diagnosis.
  failed_when: false
  changed_when: "'Removed' in opencode_skill_remove.stdout"
  # Off by default. Skills install user-global and serve every agent on the
  # machine — claude and cursor load the same ~/.agents/skills — so removing
  # opencode must not silently strip the shared library. Flip
  # opencode_remove_skills only when the whole skill set is going away.
  when: opencode_remove_skills | bool

- name: "Stop trusting each approved source"
  # The trust entries are state this topic created, so the CRUD invariant in
  # docs/TOPICS.md says it tears them down. Gated behind the same flag: leaving a
  # source trusted while its skills are gone is harmless, but removing trust
  # while another topic still installs from it is not.
  ansible.builtin.command:
    cmd: >-
      npx -y @sentry/dotagents@latest --user
      trust remove {{ item.source }}
  environment:
    PATH: "{{ ansible_facts['env']['HOME'] }}/.local/share/mise/shims:{{ ansible_facts['env']['PATH'] }}"
  loop: "{{ opencode_skill_sources }}"
  loop_control:
    label: "{{ item.source }}"
  register: opencode_trust_remove
  failed_when: false
  changed_when: "'Removed' in opencode_trust_remove.stdout"
  when: opencode_remove_skills | bool

- name: "Fail with everything dotagents could not remove"
  ansible.builtin.fail:
    msg: >-
      dotagents could not remove
      {{ (opencode_skill_remove.results | default([]) + opencode_trust_remove.results | default([]))
         | rejectattr('rc', 'eq', 0) | map(attribute='item.source') | unique | join(', ') }}.
      What it actually said:
      {{ (opencode_skill_remove.results | default([]) + opencode_trust_remove.results | default([]))
         | rejectattr('rc', 'eq', 0) | map(attribute='stderr') | map('trim') | select | join(' | ')
         | default('nothing on stderr; re-run the failing `npx` command by hand', true) }}
  when:
    - opencode_remove_skills | bool
    - (opencode_skill_remove.results | default([]) + opencode_trust_remove.results | default([]))
      | rejectattr('rc', 'eq', 0) | list | length > 0

# ── What is intentionally NOT removed here ───────────────────────────────────
# ~/.config/opencode is chezmoi-managed: opencode.jsonc deploys from
# dot_config/opencode/ in the chezmoi source, and removing it is a chezmoi
# source edit + `chezmoi apply`, not an Ansible task.
#
# auth.json (provider tokens) and opencode.db (session history) are
# machine-local state. They are never versioned and never touched by this
# topic, on install or on remove.
- name: "Note what remove leaves in place"
  ansible.builtin.debug:
    msg: >-
      Binary removed. ~/.config/opencode config is chezmoi-owned; auth.json and
      opencode.db are machine-local and left untouched. Skills were
      {{ 'removed, and their sources untrusted' if opencode_remove_skills | bool
         else 'kept (opencode_remove_skills is false)' }}.
