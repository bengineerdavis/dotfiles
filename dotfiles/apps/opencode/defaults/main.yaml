# apps/opencode/defaults/main.yaml
#
# ── Approved skill sources — single source of truth ──────────────────────────
# Consumed by tasks/install.yaml. This lists SOURCES, not skills: dotagents owns
# which skills exist, and duplicating its list here only creates a second copy to
# drift. Each entry becomes a `dotagents trust add` (so an unapproved source is
# refused by dotagents itself, not merely undeclared) and a `dotagents add
# <source> --all` wildcard declaration.
#
#   source:  owner/repo shorthand, a GitHub org, or a git domain
#   why:     why THIS SOURCE is approved to put skills on this machine
#   exclude: optional skill names to veto from an otherwise approved source
#
# Approving a source accepts everything in it, now and in future — a skill added
# upstream lands here on the next run with no edit and no review. `exclude` is
# the veto that makes that trade survivable: source-level trust, per-skill refusal.
# dotagents stores it on the wildcard entry, so an excluded skill is not merely
# uninstalled, it is refused on every subsequent sync.
#
# `why` answers a question the skills cannot answer for themselves. What each
# skill is for already lives in its own `description`, and a second copy here
# would drift from it — which is why the old per-skill manifest is gone.
opencode_skill_sources:
  - source: bengineerdavis/ai-prompt-library
    why: >-
      The author's own library. Skills here are written in this repo's voice and
      reviewed by the same person who runs them, so the trust question is
      self-answering.
    exclude: []

  - source: getsentry/skillet
    why: >-
      Public and MIT (verified 2026-09-12 via `gh api repos/getsentry/skillet`),
      and the toolchain the library's own skills are authored with — so its
      authoring skill and the specs it validates stay on the same version.
    # Empty deliberately. The source brought four openspec-* skills with it, and
    # they stay: skillet is MIT, so they arrive under a permissive licence rather
    # than merely from a tolerated source. Vetoing them would be a taste
    # judgement dressed up as a trust one.
    exclude: []

# On-disk skill directories allowed to exist without being declared. Each needs a
# reason a human can check, which in practice means a LICENSE and a PROVENANCE
# note in the directory itself. Vendoring is a deliberate act; forgetting to
# declare something is not, and the guard cannot tell them apart without this.
opencode_skill_vendored:
  - name: no-ai-slop
    why: >-
      Third-party, vendored rather than sourced — carries LICENSE and
      PROVENANCE.md recording the upstream commit and a deliberate deviation.

# ── Behaviour flags ──────────────────────────────────────────────────────────

# The tap the binary installs from. Pinned (see tasks/install.yaml): naming the
# tap explicitly keeps both OSes on the same build instead of letting Darwin
# fall to the same-named homebrew/core formula, which trails releases.
opencode_tap: anomalyco/tap

# Untap AND untrust anomalyco/tap on remove. Off by default: the tap was added
# by this topic, but a tap is shared infrastructure — any other formula could
# come from it later. Flipping this to true is a deliberate act.
#
# One flag covers both because they are one unit. Homebrew 7 needs the tap
# trusted before it will load any formula from it, so install creates two
# pieces of state; revoking trust while the tap is still present would break
# anything else installed from it. See tasks/remove.yaml.
opencode_remove_tap: false

# Accept an unmigratable agent skills directory for one run, letting dotagents
# fail on its own terms instead of the guard stopping first. Off by default: the
# conflict means two copies of the same skill exist and something has to decide
# which one survives, which is not a call a provisioning run makes silently.
# See roles/guards/tasks/dotagents-skills-migration.yaml for the three fixes.
opencode_allow_skill_dir_conflicts: false

# Run `dotagents remove <source>` for each approved source on remove. Off by
# default: skills install user-global and serve every agent on the machine, so
# removing opencode must not silently strip the shared library. Set true only
# when the whole skill set is going away.
opencode_remove_skills: false

# Accept unapproved or undeclared skills in the user-global path for one run.
# Off by default, and deliberately loud: an undeclared skill directory is how
# unlicensed material ends up loaded into every agent session on the machine,
# which is exactly what this topic exists to prevent. See
# roles/guards/tasks/dotagents-approved-sources.yaml.
opencode_allow_unapproved_skills: false
