---
- name: Create rootless Lima guests
  hosts: localhost
  connection: local
  gather_facts: true
  no_log: "{{ molecule_no_log }}"
  vars:
    # Lima's SSH socket path must stay under UNIX_PATH_MAX (104). The Molecule
    # ephemeral dir inside a worktree is too deep, so use a short temp root
    # keyed by a hash of the (unique) ephemeral dir, cleaned up in destroy.
    lima_home: "/tmp/lima-{{ molecule_ephemeral_directory | hash('sha1') }}"
    lima_test_home: "{{ molecule_ephemeral_directory }}/home"
    lima_install_prefix: "{{ lima_test_home }}/.local"
    lima_command: "{{ lima_install_prefix }}/bin/limactl"
    lima_environment:
      LIMA_HOME: "{{ lima_home }}"
      # Molecule sanitizes PATH; Lima must still find QEMU and its own helpers.
      PATH: "{{ lima_install_prefix }}/bin:/opt/homebrew/bin:/usr/local/bin:/usr/bin:/bin:/usr/sbin:/sbin"
  tasks:
    - name: Install the Lima topic into the temporary home
      ansible.builtin.include_role:
        name: apps/lima

    - name: Create the isolated Lima home
      ansible.builtin.file:
        path: "{{ lima_home }}"
        state: directory
        mode: "0755"

    - name: Require the topic-installed CLI
      ansible.builtin.stat:
        path: "{{ lima_command }}"
      register: lima_required
      failed_when: not lima_required.stat.exists

    - name: Render each platform's rootless Lima configuration
      ansible.builtin.template:
        src: lima.yaml.j2
        dest: "{{ molecule_ephemeral_directory }}/{{ item.name }}.yaml"
        mode: "0600"
      vars:
        platform_guest_arch: "{{ 'aarch64' if ansible_facts.architecture in ['arm64', 'aarch64'] else 'x86_64' }}"
        platform_image: "{{ item.arm64_image if platform_guest_arch == 'aarch64' else item.image }}"
        platform_image_digest: "{{ item.arm64_digest if platform_guest_arch == 'aarch64' else item.digest }}"
      loop: "{{ molecule_yml.platforms }}"

    - name: Start each rootless VM with user-mode networking
      ansible.builtin.command:
        argv:
          - "{{ lima_command }}"
          - start
          - "--name={{ item.name }}"
          - "--tty=false"
          - "{{ molecule_ephemeral_directory }}/{{ item.name }}.yaml"
      environment: "{{ lima_environment }}"
      loop: "{{ molecule_yml.platforms }}"

    - name: Read each VM's SSH configuration
      ansible.builtin.command:
        argv: ["{{ lima_command }}", "list", "{{ item.name }}", "--format", "json"]
      environment: "{{ lima_environment }}"
      loop: "{{ molecule_yml.platforms }}"
      register: lima_instances
      changed_when: false

    - name: Assemble Molecule's instance list
      ansible.builtin.set_fact:
        lima_molecule_instances: >-
          {{ lima_molecule_instances | default([]) + [{
               'instance': item.item.name,
               'address': '127.0.0.1',
               'user': 'molecule',
               'port': (item.stdout | from_json).sshLocalPort,
               'identity_file': lima_home + '/_config/user',
             }] }}
      loop: "{{ lima_instances.results }}"

    - name: Write Molecule's instance configuration
      ansible.builtin.copy:
        dest: "{{ molecule_instance_config }}"
        mode: "0600"
        content: "{{ lima_molecule_instances | to_yaml }}"
