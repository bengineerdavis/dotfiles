---
# Keep Molecule's inventory/logs, but do not leave Lima's unpacked release in
# the source tree. Its share/doc/lima/templates link dangles after the share
# directory is removed. chezmoi 2.73.3 follows that link before consulting its
# ignore rules, so an execute-template can fail on generated scenario state.
- name: Remove this scenario's temporary installation home
  hosts: localhost
  connection: local
  gather_facts: false
  tasks:
    - name: Delete only the scenario-owned Lima installation
      ansible.builtin.file:
        path: "{{ molecule_ephemeral_directory }}/home"
        state: absent
