# Check the dependency before changing any state. The Lima topic never uses sudo.
- name: "Check for an existing QEMU binary"
  vars:
    lima_qemu_binary: "qemu-system-{{ 'aarch64' if lima_release_arch == 'arm64' else 'x86_64' }}"
  ansible.builtin.shell:
    cmd: >-
      p=$(command -v {{ lima_qemu_binary }});
      if [ -z "$p" ]; then
        for d in /opt/homebrew/bin /usr/local/bin /usr/bin "$HOME/.local/bin"; do
          [ -x "$d/{{ lima_qemu_binary }}" ] && p="$d/{{ lima_qemu_binary }}" && break;
        done;
      fi;
      [ -n "$p" ] && printf '%s\n' "$p"
  register: lima_qemu
  changed_when: false
  failed_when: false
  check_mode: false

- name: "Require user-owned QEMU"
  ansible.builtin.fail:
    msg: >-
      QEMU is required. Install the qemu-system package on Debian, or the
      user-owned qemu formula on macOS, then rerun this topic. No host change
      was made by the Lima topic.
  when: lima_qemu.rc != 0 or lima_qemu.stdout == ''

# Idempotence: detect an already-installed matching release before downloading
# anything. get_url/unarchive into a deleted /tmp would otherwise re-run.
- name: "Check the installed Lima version"
  ansible.builtin.command:
    argv: ["{{ lima_install_dir }}/limactl", "--version"]
  register: lima_installed_version
  changed_when: false
  failed_when: false
  check_mode: false

- name: "Record whether the target release is already installed"
  ansible.builtin.set_fact:
    lima_already_installed: "{{ (lima_release_tag | regex_replace('^v', '')) in lima_installed_version.stdout }}"

- name: "Create the user installation directories"
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: "0755"
  loop:
    - "{{ lima_install_prefix }}/libexec"
    - "{{ lima_install_prefix }}/share/doc"
    - "{{ lima_install_prefix }}/share"

- name: "Install Lima only when the target release is absent"
  when: not lima_already_installed
  tags: [install, upgrade]
  block:
    - name: "Fetch the upstream checksum list"
      ansible.builtin.get_url:
        url: "{{ lima_checksums_url }}"
        dest: "{{ lima_checksums_file }}"
        mode: "0600"

    - name: "Check that the pinned digest is in the release checksum list"
      ansible.builtin.shell:
        cmd: >-
          grep -E '^{{ lima_release_checksums[lima_release_os + '-' + lima_release_arch] }}\s+{{ lima_release_asset }}$'
          {{ lima_checksums_file | quote }}
      changed_when: false

    - name: "Download the checksum-verified Lima release"
      ansible.builtin.get_url:
        url: "{{ lima_release_url }}"
        dest: "{{ lima_archive }}"
        checksum: "sha256:{{ lima_release_checksums[lima_release_os + '-' + lima_release_arch] }}"
        mode: "0600"
      register: lima_download

    - name: "Install Lima as the invoking user"
      ansible.builtin.unarchive:
        src: "{{ lima_archive }}"
        dest: "{{ lima_install_prefix }}"
        remote_src: true
        mode: "0755"
      register: lima_unpacked

    - name: "Remove temporary release files"
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop:
        - "{{ lima_archive }}"
        - "{{ lima_checksums_file }}"

- name: "Verify limactl"
  ansible.builtin.command:
    argv: ["{{ lima_install_dir }}/limactl", "--version"]
  register: lima_version
  changed_when: false

- name: "Verify the native QEMU accelerator"
  ansible.builtin.command:
    argv: ["{{ lima_qemu.stdout }}", "-accel", "help"]
  register: lima_accelerator
  changed_when: false
  failed_when: >-
    (ansible_facts.os_family == 'Darwin' and 'hvf' not in lima_accelerator.stdout)
    or (ansible_facts.os_family == 'Debian' and 'kvm' not in lima_accelerator.stdout)

- name: "Report the verified VM capabilities"
  ansible.builtin.debug:
    msg: >-
      {{ lima_version.stdout }}; QEMU accelerator:
      {{ 'HVF' if ansible_facts.os_family == 'Darwin' else 'KVM' }}.
      Lima and QEMU run as the invoking user; no sudo is required.
