# apps/<topic>/tasks/main.yaml — role lifecycle router
#
# Imports lifecycle subtask files with appropriate tags. The parent playbook
# (or a standalone topic playbook) drives which phase runs via --tags.
#
# All five lifecycle files MUST exist in every topic. New topics scaffolded
# by `topical new` start with stubs. App-tier topics typically leave
# bootstrap, prerequisites, and upgrade as no-ops — brew/apt cover them.
#
# Doctrine: any state a topic creates in bootstrap/prerequisites/install/upgrade
# MUST have a matching teardown in remove.yaml. See docs/TOPICS.md.

# ── Guard: this topic never runs with root authority ─────────────────────────
# mise installs into the invoking user's home. Run under sudo it creates a
# second tool tree under /root and leaves locks in the temp dir; the apt steps
# this topic does need elevate per task, never for the whole role.
#
# `always` so the guard runs under every tag selection, including the standalone
# `--tags install` path. The per-task `become: false` on the mise commands is
# the second half: even a play started with become cannot elevate them.
- name: "Guard: refuse to run mise with root authority"
  ansible.builtin.import_role:
    name: "roles/guards"
    tasks_from: no-root-authority.yaml
  vars:
    guard_caller: "apps/mise"
  tags: [always]

- name: "Import bootstrap tasks"
  ansible.builtin.import_tasks: bootstrap.yaml
  tags: [bootstrap, provision]

- name: "Import prerequisites tasks"
  ansible.builtin.import_tasks: prerequisites.yaml
  tags: [prerequisites, provision]

- name: "Import upgrade tasks"
  ansible.builtin.import_tasks: upgrade.yaml
  tags: [upgrade, provision]

- name: "Import install tasks"
  ansible.builtin.import_tasks: install.yaml
  tags: [install, provision]

- name: "Import remove tasks"
  ansible.builtin.import_tasks: remove.yaml
  tags: [remove, never]
