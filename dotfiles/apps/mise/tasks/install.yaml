# apps/mise/tasks/install.yaml
# Install mise, then materialize the tools declared in config.toml.
# The package manager is OS-specific and guarded in-task (5a pattern): brew on
# Darwin, the jdx apt repo on Debian. Both are idempotent and re-runnable.

# ── macOS (Homebrew) ─────────────────────────────────────────────────────────
- name: "Install mise via Homebrew (macOS)"
  community.general.homebrew:
    name: mise
    state: present
  when: ansible_facts['os_family'] == 'Darwin'

# ── Debian (jdx apt repo — mise ships no stock apt package) ───────────────────
- name: "mise (Debian): ensure apt keyrings dir"
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    mode: "0755"
  become: true
  when: ansible_facts['os_family'] == 'Debian'

- name: "mise (Debian): add apt signing key"
  ansible.builtin.get_url:
    url: https://mise.jdx.dev/gpg-key.pub
    dest: /etc/apt/keyrings/mise.asc
    mode: "0644"
  become: true
  when: ansible_facts['os_family'] == 'Debian'

- name: "mise (Debian): add apt repository"
  ansible.builtin.deb822_repository:
    name: mise
    types: [deb]
    uris: https://mise.jdx.dev/deb
    suites: [stable]
    components: [main]
    architectures: "{{ 'arm64' if ansible_facts['architecture'] == 'aarch64' else 'amd64' }}"
    signed_by: /etc/apt/keyrings/mise.asc
    state: present
  become: true
  when: ansible_facts['os_family'] == 'Debian'

- name: "Install mise via apt (Debian)"
  ansible.builtin.apt:
    name: mise
    state: present
    update_cache: true
  become: true
  when: ansible_facts['os_family'] == 'Debian'

# ── Config dir + tool materialization (both OSes) ─────────────────────────────
- name: "Ensure ~/.config/mise directory exists"
  ansible.builtin.file:
    path: "{{ ansible_facts['env']['HOME'] }}/.config/mise"
    state: directory
    mode: "0755"

# Fixes the pre-existing gap: nothing previously ran `mise install`, so the
# tools in config.toml (uv, python, ...) were never explicitly materialized.
- name: "Materialize mise-managed tools from config.toml"
  ansible.builtin.command:
    cmd: mise install --yes
  register: mise_install_result
  changed_when: >-
    ('install' in (mise_install_result.stdout | lower))
    or ('install' in (mise_install_result.stderr | lower))
  failed_when: mise_install_result.rc != 0

# ── Confirm the llm plugins declared in config.toml are actually loadable ─────
# `mise install --yes` keys off a tool's VERSION, so editing `uvx_args` is a
# silent no-op: adding `--with llm-video-frames` to "pipx:llm" leaves the
# existing venv untouched, llm stays on PATH looking healthy, and the plugin
# never arrives. The failure then surfaces far from its cause, as an unknown
# fragment loader at prompt time.
#
# So assert on the OUTCOME rather than trusting the install: ask llm which
# plugins it can actually load, diff against what config.toml declares, and
# force a rebuild only when something is genuinely missing. That keeps
# config.toml authoritative without reinstalling the venv on every run.
- name: "Find declared llm plugins that are not loadable"
  ansible.builtin.command:
    argv:
      - python3
      - "-c"
      - |
        import json, re, subprocess, sys, tomllib
        with open(sys.argv[1], "rb") as fh:
            cfg = tomllib.load(fh)
        spec = cfg.get("tools", {}).get("pipx:llm", {})
        args = spec.get("uvx_args", "") if isinstance(spec, dict) else ""
        declared = set(re.findall(r"--with\s+(\S+)", args))
        try:
            proc = subprocess.run(
                ["llm", "plugins"], capture_output=True, text=True, check=True
            )
            live = {p["name"] for p in json.loads(proc.stdout)}
        except Exception:
            # llm absent, or its output was not parseable: treat every declared
            # plugin as missing so the rebuild below runs.
            live = set()
        print("\n".join(sorted(declared - live)))
      - "{{ mise_config_file }}"
  environment:
    # PyMuPDF writes its `fitz` deprecation notice to STDOUT by default, which
    # lands in the middle of `llm plugins` JSON and breaks the parse. The zsh
    # env sets this globally but ansible does not source zsh. See
    # apps/mise/files/zsh/env.zsh.
    PYMUPDF_MESSAGE: "fd:2"
  register: mise_llm_missing_plugins
  changed_when: false

- name: "Rebuild the llm tool venv to pick up newly declared plugins"
  ansible.builtin.command:
    cmd: mise install --force pipx:llm
  when: mise_llm_missing_plugins.stdout | trim | length > 0
  changed_when: true

- name: "Report the llm plugins that were missing"
  ansible.builtin.debug:
    msg: >-
      Rebuilt pipx:llm to add:
      {{ mise_llm_missing_plugins.stdout_lines | join(', ') }}
  when: mise_llm_missing_plugins.stdout | trim | length > 0
