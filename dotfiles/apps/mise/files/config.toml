[settings]
experimental = true
pipx.uvx = true

[tools]
# BACKEND CONVENTION (2026-09-15): new entries must NOT use the ubi: backend —
# mise deprecates it ("Use the github backend instead", removal slated for
# mise 2027.1.0). For GitHub release binaries use "github:owner/repo". Any ubi:
# entry still here is legacy and migrates to github: when touched.
"cargo:https://github.com/sondr3/git-ignore" = { version = "branch:main", crate = "git-ignore-generator" }
# herdr — the agent-runtime server (apps/herdr). The entry is owned by that
# topic through mise's first-party commands: `mise use -g herdr` on install,
# `mise unuse --global herdr` on remove, probe-first so both are no-ops once
# converged. This line is the capture those commands write through the
# deployed symlink; upgrades come from `mise upgrade`, never `herdr update`.
herdr = "latest"
# Encryption for bin/quarantine. aqua: resolves upstream's own release binaries
# rather than a third-party plugin. age is a single static binary with no
# network behaviour, and its file format is documented and stable — which is
# what makes an archive written today still openable by hand years from now,
# with nothing but the binary and the key.
age = "latest"
# Password-manager CLIs, so bin/quarantine can stream a decryption key straight
# from the vault to age's stdin instead of leaving it in a file. Neither is
# required: the keychain and file backends need no extra tool. The 1Password app
# ships only op-ssh-sign, not the `op` CLI, which is why this is declared.
"1password-cli" = "latest"
"bitwarden" = "latest"
fd = "latest"
fzf = "latest"

# go tooling
go = "latest"

# node tooling
node = "lts"
# installing skills.md for for the local userspace
# ❯ mise install
# Reshimming mise lts...
# npm:@sentry/skillet@1.7.0             run `npm fund` for details                                                                        ✔
# skillet init installs skillet-authoring for all your agents via
# 'npx -y @sentry/dotagents@latest --user' (writes ~/.agents and agent configs).
# Re-run with --no-prompt to proceed non-interactively.
# To manage it yourself instead:
#   npx -y @sentry/dotagents@latest add getsentry/skillet skillet-authoring
#   (project scope; add --user for global) — or install skills/skillet-authoring
# npm:@sentry/skillet@1.7.0             run `npm fund` for details
#
# PINNED, not "latest". 1.8.0's dependency tree pulls in vite, and mise's npm
# resolver (aube) cannot fetch vite's packument through sfw.security.sentry.io:
# it fails with "error decoding response body" after ~78s, every time. This is a
# mise-side limit rather than a registry, auth or network problem — `curl` reads
# the same URL fine and `npm view vite` works, because npm asks for the 400 KB
# abbreviated packument while aube pulls the full 39 MB one. The hint mise
# prints ("verify the registry URL, check auth, network connectivity") is
# misleading; nothing in .npmrc needs changing.
# spec.md pins skillet 1.7.0 for `skillet validate` independently — that pin
# predates 1.8.0 and still needs aligning (see docs/REFERENCES.md).
# 1.8.0 verified working here 2026-09-14 (`skillet validate .` exits 0; the
# dependency trouble that forced the earlier rollback did not reproduce —
# 1.8.0 was already installed, and `mise install` pruned 1.7.0). Drop the pin
# to "latest" once the upgrade.yaml pin-print and the npx aliases are settled.
# tasks/upgrade.yaml prints this pin at runtime so it is visible without
# reading this file.
# aube gate approved 2026-10-14: skillet is a known-verify tool (consumed via
# @sentry/dotagents skills); aube refused it at 7 weekly downloads vs the
# 1,000 threshold. verify=checks passed then.
"npm:@sentry/skillet" = { version = "1.8.0", postinstall = "skillet init", depends = ["node"], allow_low_downloads = true }
"npm:@sentry/dotagents" = "3.3.0"
# Second eval harness for skillet. skillet 1.7.0 runs a case's judge on the same
# harness AND model as the trial itself (worker.js: runHarness(cfg.harness, …)
# with only a fresh temp dir), so a single-harness run always self-grades. Two
# independently-installed harnesses let the same suite run twice and be diffed,
# which is the only judge/subject separation available until skillet gains a
# judge-harness key. Declared here rather than left to `mise use -g`, which would
# write to the chezmoi copy of this file and silently drift the two trees apart.
"npm:@openai/codex" = { version = "latest", depends = ["node"] }

# python tooling
# uv/uvx is installed at the SYSTEM level via the astral installer (see
# bootstrap/bootstrap.sh) and intentionally NOT managed by mise. mise's pipx
# backend (pipx.uvx = true) therefore uses a stable system uvx that `mise
# upgrade` never churns — which is what previously caused ansible to self-upgrade
# mid-playbook-run.
python = "3.14"
"pipx:pre-commit" = "latest"
"pipx:git-filter-repo" = "latest"
# worktrunk — git-worktree CLI for parallel agent work, paired with the
# backlog-md-py queue migration (docs/BACKLOG-MIGRATION.md). Plain fleet
# entry: no owning topic, no first-party capture (unlike gita below).
worktrunk = "latest"
# gita — owned by apps/gita through mise's first-party commands
# (`mise use -g pipx:gita` on install, `mise unuse --global pipx:gita` on
# remove), the herdr pattern. This line is the capture those commands write
# through the deployed symlink; the topic never edits the file directly.
"pipx:gita" = "latest"

# http://llm.datasette.io/en/stable/setup.html
#
# Plugins are declared here as `--with` extras rather than via `llm install`.
# `llm install` pip-installs into the uv tool venv that mise owns, so the next
# `mise upgrade`/reinstall rebuilds that venv and silently drops the plugin.
# Anything listed here survives a rebuild.
#
# llm-video-frames needs a SYSTEM ffmpeg on PATH (it shells out to ffmpeg to
# split the video into frames — it does not vendor one). ffmpeg is installed and
# verified by apps/mise/tasks/prerequisites.yaml.
"pipx:llm" = { version = "latest", uvx_args = """
  --with llm-openrouter
  --with llm-ollama
  --with llm-sentence-transformers
  --with llm-tools-exa
  --with llm-pdf-to-images
  --with llm-video-frames
  --with llm-jq
  --with llm-python
  --with llm-all-models-async
  --with llm-cmd
  --with llm-docs
""" }

# ai tooling
# Aider gets its own isolated venv pinned to 3.12
# mise uses uv tool install under the hood for pipx: backend
# https://aider.chat/docs/install.html
"pipx:aider-chat" = { version = "latest", uvx_args = "--python 3.12 --force" }
# pyrefly is the repo's type checker (pyproject.toml [tool.pyrefly]); pinned
# so the CLI, the IDE LSP and the pre-commit hook run one version. The
# pre-commit hook (facebook/pyrefly-pre-commit) uses the system install.
"pipx:pyrefly" = { version = "1.3.2" }
prek = "latest"
"pipx:trash-cli" = "latest"
lazygit = "latest"
# ansible is owned by mise via the pipx backend below (`pipx:ansible`), built with
# the system uvx. The direct `ansible-core` backend was removed to avoid two
# ansibles on PATH and the mid-run self-upgrade race.
ruby = "latest"
rust = "latest"
"cargo:broot" = "latest"
"cargo:eza" = "latest"
"cargo:fd-find" = "latest"
"cargo:fnm" = "latest"
"cargo:goldboot" = "latest"
"cargo:mdcat" = "latest"
"cargo:ripgrep" = "latest"
"cargo:shellharden" = "latest"
"github:Canop/broot" = "latest"
"github:bootandy/dust" = "latest"
# Secret-leak scanners, added 2026-09-15 as an evaluation pair ("for now",
# per the author): betterleaks is the gitleaks-successor engine, leaktk
# wraps it and other scanners behind one JSONL API. Both Go, MIT, goreleaser
# binaries. On the github: backend because mise deprecates ubi: (removal
# slated for mise 2027.1.0). If one wins, drop the other rather than keeping
# both.
"github:leaktk/leaktk" = "latest"
"github:betterleaks/betterleaks" = "latest"
dua = "latest"
duf = "latest"
dust = "latest"
gdu = "latest"
ruff = "latest"
usage = "latest"
"gem:fpm" = "latest"
"pipx:aider-install" = "latest"
# ansible + its maintenance/runtime deps, all in ONE tool venv (built by the
# system uvx) → a single ansible-core, no dual-ownership version skew.
#
# The `ansible` meta-package (primary) bundles the community collections but its
# ONLY console script is `ansible-community`. The real CLIs (ansible,
# ansible-playbook, ansible-galaxy, ...) live in the ansible-core dependency, so
# they must be exposed explicitly or `mise exec -- ansible-playbook` finds
# nothing. `--with-executables-from` links a dependency's scripts onto PATH.
#   ansible-core  — expose ansible / ansible-playbook / ansible-galaxy / ...
#   ansible-lint  — lint playbooks/roles (+ expose its CLI)
#   argcomplete   — tab-completion for ansible* commands
#   docker        — Docker SDK required by community.docker.docker_image
"pipx:ansible" = { version = "latest", uvx_args = """
  --with ansible-lint
  --with argcomplete
  --with docker
  --with-executables-from ansible-core
  --with-executables-from ansible-lint
""" }
# "pipx:borgbackup" = "latest"
"pipx:buku" = "latest"
"pipx:cookiecutter" = "latest"
"pipx:copier" = "latest"
"pipx:diceware" = "latest"
"pipx:dinosay" = "latest"
"pipx:editorconfig-checker" = "latest"
"pipx:glances" = "latest"
"pipx:lice" = "latest"
"pipx:magic-wormhole" = "latest"
"pipx:pdm" = "latest"
"pipx:podman-compose" = "latest"
"pipx:poetry" = "latest"
"pipx:protonup-ng" = "latest"
"pipx:pyproject-fmt" = "latest"
"pipx:qmk" = "latest"
"pipx:ruff" = "latest"
"pipx:speedtest-cli" = "latest"
"pipx:symbex" = "latest"
"pipx:termdown" = "latest"
"pipx:thefuck" = "latest"
"pipx:tldr" = "latest"
"pipx:toolong" = "latest"
"pipx:watchdog" = "latest"
"pipx:whisperx" = "latest"
"pipx:yt-dlp" = "latest"
"pipx:zxcvbn" = "latest"
"pipx:fangfrisch" = "latest"
# No `v` prefix. mise resolves the release tag but records the install under the
# bare version, so a "v1.4.478" request never reads as satisfied: it reinstalled
# on every run ("Upgraded 1 tool: fabric v1.4.478 → 1.4.478"), kept a duplicate
# tree under installs/.../v1.4.478 alongside 1.4.478, and left the topic
# reporting `changed` forever — which hides the changes that are real.
#
# Bumped 1.4.478 → 1.4.516 on 2026-10-27 (author decision). The duplicate-tree
# symptom was measured at 1.4.478 and has not been rechecked at the new pin.
# Before treating the bump as settled, watch whether upstream fixed the
# version-prefix handling; if it did, this comment and the pin move together.
"github:danielmiessler/fabric" = "1.4.516"

[tasks.sk]
description = "Core skillet command"
run = "npx -y @sentry/skillet@latest {{args}}"

[tasks.sk-status]
description = "Show skillet file artifacts status"
run = "npx -y @sentry/skillet@latest status {{args}}"

[tasks.sk-validate]
description = "Validate complete skillet files"
run = "npx -y @sentry/skillet@latest validate {{args}}"

[tasks.sk-eval]
description = "Run skillet eval cases"
run = "npx -y @sentry/skillet@latest eval {{args}}"

[tasks.dau]
description = "Core dotagents user-scoped command"
run = "npx -y @sentry/dotagents@latest --user {{args}}"

[tasks.dau-sync]
description = "Install or refresh user-scoped tools"
run = "npx -y @sentry/dotagents@latest --user install"

