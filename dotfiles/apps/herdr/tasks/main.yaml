# tasks/main.yaml — the lifecycle router (TOPICS.md § Lifecycle tags).
#
# Five imports, each carrying its lifecycle tag; `remove` is additionally
# tagged `never` so a bare run never tears down — `--tags remove` is the
# deliberate opt-in.

- name: "Bootstrap (app-tier stub: nothing to bootstrap for herdr)"
  ansible.builtin.import_tasks: bootstrap.yaml
  tags: [bootstrap, provision]

- name: "Prerequisites (app-tier stub: mise arrives through topic_requires)"
  ansible.builtin.import_tasks: prerequisites.yaml
  tags: [prerequisites, provision]

- name: "Upgrade herdr through mise"
  ansible.builtin.import_tasks: upgrade.yaml
  tags: [upgrade, provision]

- name: "Install herdr, wire agent integrations, own the server service"
  ansible.builtin.import_tasks: install.yaml
  tags: [install, provision]

- name: "Remove herdr (gated integrations, service, mise entry)"
  ansible.builtin.import_tasks: remove.yaml
  tags: [remove, never]
