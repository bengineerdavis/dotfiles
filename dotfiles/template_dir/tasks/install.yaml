# apps/<topic>/tasks/install.yaml
# Package installation tasks. Be explicit about which package manager is used.
# Use when: conditions to guard each block by OS/arch.
# Do NOT put upgrade logic here — upgrades are owned by system roles (homebrew, apt).
# Do NOT put config/symlink tasks here — those are owned by chezmoi.

