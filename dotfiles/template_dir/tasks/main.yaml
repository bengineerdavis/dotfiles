---
- name: "Ensure topic directory structures exist [optional]"
  file:
    path: "{{ ansible_user_dir }}/path/to/topic/structure"
    state: directory
  # when:
  #   - topic_create_directories | default(true) | bool
  tags:
    - topic
    - directories

- name: "Install topic tools via Homebrew (if applicable) [optional]"
  homebrew:
    name:
      # - topic-tool
    state: present
  when:
    - ansible_pkg_mgr is defined and ansible_pkg_mgr == "homebrew"
    # - topic_install_tools | default(false) | bool
  tags:
    - brew
    - tools
    - topic

- name: "Symlink global config file for topic [optional]"
  file:
    src: "{{ playbook_dir }}/apps/topic/files/.config/topic/config.ext"
    dest: "{{ ansible_user_dir }}/.config/topic/config.ext"
    state: link
  # when:
  #   - topic_manage_global_config | default(true) | bool
  tags:
    - topic
    - config

- name: "Copy topic shell config snippets [optional]"
  copy:
    src: "files/zsh/topic_*.zsh"
    dest: "{{ ansible_user_dir }}/.zshrc.d/topic_{{ item }}"
    mode: "0644"
  loop:
    # - "env.zsh"
    # - "path.zsh"
    # - "init.zsh"
  when:
    # - topic_manage_zsh_files | default(true) | bool
  tags:
    - topic
    - shell
