---
# playbook.yaml — main dotfiles provisioner
# Driver: chezmoi. This playbook is invoked by chezmoi or directly.
#
# Tag hierarchy:
#   provision      = bootstrap + prerequisites + upgrade + install (full fresh machine)
#   bootstrap      = ensure package managers exist (confirmed, never silent)
#   prerequisites  = core tools required before any topic installs
#   upgrade        = system-level upgrades only (brew, apt) — no topic installs
#   install        = all topic installs (assumes env is ready)
#   remove         = explicit uninstall only, never part of provision
#
# Examples:
#   ansible-playbook playbook.yaml --tags provision   # full fresh machine
#   ansible-playbook playbook.yaml --tags upgrade     # upgrade existing env
#   ansible-playbook playbook.yaml --tags install     # install all topics
#   ansible-playbook playbook.yaml --tags remove      # uninstall all topics

- name: "Local Machine Setup"
  hosts: localhost
  connection: local
  gather_facts: true
  become: false

  vars:
    homebrew_prefix: "{{ '/opt/homebrew' if ansible_facts['architecture'] == 'arm64' else '/usr/local' }}"
    homebrew_bin: "{{ homebrew_prefix }}/bin/brew"
    user_appdir: "{{ ansible_facts['env']['HOME'] }}/Applications"

  pre_tasks:
    - name: "Detect OS family"
      ansible.builtin.debug:
        msg: "OS: {{ ansible_facts['os_family'] }}, Arch: {{ ansible_facts['architecture'] }}"
      tags: [always]

  tasks:
    # ── Bootstrap ──────────────────────────────────────────────────────────────
    # Ensure package managers exist. Confirmed, never silent. No drift tolerated.

    - name: "Bootstrap: Homebrew (macOS)"
      ansible.builtin.import_role:
        name: apps/homebrew
        tasks_from: bootstrap
      when: ansible_facts['os_family'] == 'Darwin'
      tags: [bootstrap, provision]

    - name: "Bootstrap: apt (Linux)"
      ansible.builtin.import_role:
        name: apps/apt
        tasks_from: bootstrap
      when: ansible_facts['os_family'] == 'Debian'
      tags: [bootstrap, provision]

    - name: "Bootstrap: Docker"
      ansible.builtin.import_role:
        name: apps/docker
        tasks_from: bootstrap
      tags: [bootstrap, provision]

    # ── Prerequisites ──────────────────────────────────────────────────────────
    # Core tools required before any topic installs. Idempotent, no confirmation.

    - name: "Prerequisites: Homebrew (macOS)"
      ansible.builtin.import_role:
        name: apps/homebrew
        tasks_from: prerequisites
      when: ansible_facts['os_family'] == 'Darwin'
      tags: [prerequisites, provision]

    - name: "Prerequisites: apt (Linux)"
      ansible.builtin.import_role:
        name: apps/apt
        tasks_from: prerequisites
      when: ansible_facts['os_family'] == 'Debian'
      tags: [prerequisites, provision]

    # ── Upgrade ────────────────────────────────────────────────────────────────
    # System-level upgrades only. Topics do not own upgrade logic.

    - name: "Upgrade: Homebrew (macOS)"
      ansible.builtin.import_role:
        name: apps/homebrew
        tasks_from: upgrade
      when: ansible_facts['os_family'] == 'Darwin'
      tags: [upgrade, provision]

    - name: "Upgrade: apt (Linux)"
      ansible.builtin.import_role:
        name: apps/apt
        tasks_from: upgrade
      when: ansible_facts['os_family'] == 'Debian'
      tags: [upgrade, provision]

    # ── Topic installs ─────────────────────────────────────────────────────────
    # Dynamically discover and run all topic install tasks.

    - name: "Find all topic roles in apps/"
      ansible.builtin.find:
        paths: "apps/"
        recurse: yes
        patterns: "main.yaml"
        file_type: file
      register: app_files
      tags: [install, remove, provision]

    - name: "Dynamically include topic roles"
      ansible.builtin.include_role:
        name: "apps/{{ item }}"
      loop: >-
        {{
          app_files.files
          | map(attribute='path')
          | select('search', 'tasks/main.yaml')
          | map('regex_replace', '.*/apps/([^/]+)/tasks/main.yaml', '\\1')
          | reject('in', ['homebrew', 'apt', 'docker'])
          | list | sort
        }}
      tags: [install, remove, provision]
