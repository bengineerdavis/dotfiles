---
- name: Local Machine Setup
  hosts: localhost
  connection: local
  gather_facts: true  # Required to detect if it's arm64 (M1+) or x86_64 (Intel)

  vars:
    # Use ansible_facts for modern compatibility
    homebrew_prefix: "{{ '/opt/homebrew' if ansible_facts['architecture'] == 'arm64' else '/usr/local' }}"
    homebrew_bin: "{{ homebrew_prefix }}/bin/brew"
    user_appdir: "{{ ansible_facts['env']['HOME'] }}/Applications"

  pre_tasks:
    - name: "Verify Homebrew installation at {{ homebrew_bin }}"
      ansible.builtin.stat:
        path: "{{ homebrew_bin }}"
      register: brew_stat
      tags: [always, install]

    - name: Install Homebrew if missing
      ansible.builtin.shell: >
        /bin/bash -c "$(curl -fsSL https://raw.githubusercontent.com)"
      when: not brew_stat.stat.exists
      tags: [system, install]

    - name: Ensure Homebrew is in the shell PATH (Apple Silicon)
      ansible.builtin.lineinfile:
        path: ~/.zprofile
        line: 'eval "$({{ homebrew_bin }} shellenv)"'
        create: yes
      when: 
        - ansible_facts['architecture'] == "arm64"
        - not brew_stat.stat.exists
      tags: [system, install]
  
  tasks:
    - name: Update Homebrew and upgrade all installed packages
      community.general.homebrew:
        update_homebrew: true
        upgrade_all: true
        upgrade_options: greedy
        path: "{{ homebrew_prefix }}/bin"
      become: false
      tags: [system, upgrade, apps]

    - name: Upgrade all installed Homebrew casks
      community.general.homebrew_cask:
        update_homebrew: true
        upgrade_all: true
        greedy: true
      tags: [system, upgrade, apps]

    - name: Stop play if only system upgrade was requested
      ansible.builtin.meta: end_play
      when: "'system' in ansible_run_tags and 'apps' not in ansible_run_tags"
      tags: [system]
      
    - name: Find all app task files in apps/ directory
      ansible.builtin.find:
        paths: "apps/"
        recurse: yes
        patterns: "tasks.yaml"
      register: app_files
      tags: [apps, install]

    - name: Dynamically include found tasks
      ansible.builtin.include_tasks: "{{ item.path }}"
      loop: "{{ app_files.files | sort(attribute='path') }}"
      loop_control:
        label: "{{ item.path }}"
      tags: [apps, install]

    - name: "Dynamically include app roles"
      include_role:
        name: "apps/{{ item }}"
      loop: "{{ enabled_apps }}"
      tags: ["apps"]