# roles/guards/defaults/main.yaml
#
# Defaults for every guard in this role. A caller overrides them with `vars:`
# on the import — see roles/guards/README.md.

# ── dotagents-skills-migration ───────────────────────────────────────────────

# Where dotagents installs skills at user scope. Everything below is about
# other directories colliding with the names in here.
guard_agents_skills_dir: "{{ ansible_facts['env']['HOME'] }}/.agents/skills"

# The agent homes dotagents will try to relocate at user scope. This is not a
# guess: it is `userSkillsParentDirs` in the dotagents target registry
# (dist/targets/definitions/*.js), which as of @sentry/dotagents 3.1.0 is set
# only for claude (~/.claude), cursor (which reuses ~/.claude) and copilot
# ($COPILOT_HOME, default ~/.copilot). codex, opencode and vscode declare
# `userSkillsParentDirs: undefined` and are never relocated — which is why
# ~/.codex/skills can sit there as a real directory forever without tripping
# this guard.
#
# Re-read that registry when dotagents is upgraded. A new agent gaining a
# userSkillsParentDir is a new way for this to fire.
guard_agent_homes:
  - "{{ ansible_facts['env']['HOME'] }}/.claude"
  - "{{ ansible_facts['env']['COPILOT_HOME'] | default(ansible_facts['env']['HOME'] ~ '/.copilot', true) }}"

# Accept the conflict for one run. Off by default: the resolution is a judgement
# about which copy of a skill is the real one, and that is not a decision a
# provisioning run gets to make silently. See the failure message for the three
# ways out.
guard_allow_skill_dir_conflicts: false

# Named in the failure message so the operator knows which topic asked.
guard_caller: "a topic"

# ── dotagents-approved-sources ───────────────────────────────────────────────

# Sources permitted to put skills in the user-global path. Empty by default and
# deliberately so: a guard that approves everything when its caller forgets to
# pass a list is a guard that never fires. An empty list makes every declared
# skill unapproved, which is loud and obviously wrong — the failure mode you want.
guard_approved_sources: []

# On-disk skill directories allowed to exist undeclared, by name. Vendored
# third-party copies live here, and each should carry a LICENSE and a PROVENANCE
# note so the exception is checkable rather than remembered.
guard_vendored_skills: []

# Sources banned outright. A ban outranks approval and licence both, because it
# is a judgement about a publisher rather than about paperwork. A bare owner bans
# the whole org; owner/repo bans one repository.
guard_denied_sources: []

# Per-source skill vetoes, as {source: [names]}.
guard_skill_excludes: {}

# Hidden (dot-prefixed) directories to audit after all, by name. The audit
# skips hidden directories as non-load-paths — reporting each skip — and a
# directory named here is judged like any other. The machine-local
# alternative is `skill-trust trust add --include-hidden`.
guard_skill_include_hidden: []

# Copyleft is open, but vendoring into a library every agent loads is
# redistribution and carries obligations, so it arrives only on purpose.
guard_allow_copyleft: false

# The decision program. On PATH once installed with
# `uv tool install <chezmoi source>/tools/skill-trust`.
guard_skill_trust_cmd: skill-trust

# How to ask dotagents for its declared inventory. A parameter rather than a
# literal so the guard can be exercised against a scripted inventory offline —
# the alternative is a test that reaches the network and can only ever assert
# against whatever this machine happens to have installed.
guard_dotagents_list_cmd: "npx -y @sentry/dotagents@latest --user list --json"

# Where the guard writes the composed trust rules each run. A stable path, so
# `skill-trust resolve` (interactive: approve/vendor/deny each finding once)
# and bare `skill-trust check` judge with exactly what the guard enforces.
# Machine-local decisions live beside it in trust.yaml, never in this file.
guard_skill_trust_rules: >-
  {{ ansible_facts['env']['XDG_CONFIG_HOME'] | default(ansible_facts['env']['HOME'] ~ '/.config', true) }}/skill-trust/rules.yaml

# Accept unapproved or undeclared skills for one run. For anything meant to
# LAST, prefer `skill-trust resolve` — this flag is the one-run escape, not
# the way decisions are made.
guard_allow_unapproved_skills: false

# Recognise a foreign skill bucket — a directory another program owns in the
# skills store, like Claude Code's `synced/` — as external rather than denying
# it. `external` is "not mine to rule on", not "allowed": skill-trust declines
# jurisdiction instead of failing provisioning, because a deny there is not
# implementable — deleting a synced skill only makes the sync recreate it
# byte-identical on the next session. On by default for that reason; off
# restores the old fail-closed denial.
guard_foreign_buckets: true
