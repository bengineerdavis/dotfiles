---
# roles/secrets-session/tests/onepassword-empty-facts.yaml
#
# Same idea as bitwarden-empty-facts.yaml: with op absent, the onepassword.yaml
# task file should fail cleanly (and set an empty fact when session is not
# required) instead of prompting for a password.

- name: "Test secrets-session onepassword.yaml fails cleanly when op is absent"
  hosts: localhost
  connection: local
  gather_facts: false
  become: false

  vars:
    secrets_session_required: false

  tasks:
    - name: "Run 1Password session tasks without a real vault"
      ansible.builtin.include_role:
        name: roles/secrets-session
        tasks_from: onepassword.yaml
      register: secrets_session_op_test_result
      ignore_errors: true

    - name: "Assert role handled absence gracefully"
      ansible.builtin.assert:
        that:
          - secrets_session_op_test_result is not failed
          - secrets_onepassword_session is defined
        success_msg: "PASS: secrets-session onepassword.yaml tolerated an empty session"
        fail_msg: "FAIL: onepassword.yaml failed when the vault was unavailable"
