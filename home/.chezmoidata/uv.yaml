# .chezmoidata/uv.yaml — per-host uv context for dot_config/uv/uv.toml.tmpl
# and for the apps/uv topic, which reads the same file so both layers share
# one signal.
#
# Flat by design: the three-layer merge in opencode.yaml exists for deep key
# merges; uv needs one boolean per host. Hostnames only — no
# employer-identifying values here (spec.md § Data): the private index URL
# lives in the machine-local ~/.localrc, captured by the apps/uv topic from
# the vault.
#
# A host flagged work MUST have UV_PRIVATE_INDEX_URL in ~/.localrc before
# `chezmoi apply` (the template fails loudly otherwise). A host not flagged
# renders public PyPI only, even if the env var is present.
uv:
  hosts:
    L37V3P6GQ3:      # this Mac
      work: false
