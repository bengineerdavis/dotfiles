# Purge user temp dir (TMPDIR default per ~/.zshenv) after 30 days of
# inactivity. Linux only (systemd user manager); excluded from non-linux targets
# via the .chezmoiignore conditional. Age applies only via systemd-tmpfiles-clean.timer
# — enabled and started per-user 2026-10-17 (systemctl --user enable --now;
# verified active with the first fire scheduled). Ansible topics may promote
# to --global for the second machine.
q %h/.cache/tmp - - - 30d
# Age opencode's agent scratch dir the same way: sessions accumulate
# probe files, mutation copies, stamp trees and logs there for weeks
# (35+ stale entries observed 2026-10-17), /tmp never self-clears on
# root-fs machines, and nothing else cleans the dir. `e` cleans an
# existing dir's contents only — it neither creates nor removes the dir
# itself, so live sessions are unaffected and 30-day-old debris goes.
e /tmp/opencode - - - 30d
