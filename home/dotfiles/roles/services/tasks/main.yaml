# roles/services/tasks/main.yaml
#
# Entry point. Routes by lifecycle tag so a caller can `import_role` once and
# let `--tags install` / `--tags remove` select the phase.
#
# Mirrors roles/guards: a static import makes these tasks visible at parse time,
# so tag selection works without an `apply:` block.

- name: "services: install"
  ansible.builtin.import_tasks: install.yaml
  tags: [install, upgrade]

- name: "services: remove"
  ansible.builtin.import_tasks: remove.yaml
  tags: [remove]
