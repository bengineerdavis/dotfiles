# roles/services/tasks/main.yaml
#
# Entry point. Routes by lifecycle tag so a caller can `import_role` once and
# let `--tags install` / `--tags remove` select the phase.
#
# Mirrors roles/guards: a static import makes these tasks visible at parse time,
# so tag selection works without an `apply:` block.

- name: "services: install"
  ansible.builtin.import_tasks: install.yaml
  tags: [install, upgrade]

- name: "services: remove"
  ansible.builtin.import_tasks: remove.yaml
  # `never` makes teardown opt-in: skipped by a bare run and by
  # `--tags install`, runs only with an explicit `--tags remove`. Without it a
  # bare run executes teardown after install and takes the service down —
  # measured 2026-11-19 on the backlog topic, where a bare `run-role.sh backlog`
  # deleted the live plist. The topic routers carry `[remove, never]`; this role
  # exists so topics stop re-deriving the order, so it must carry it too.
  tags: [remove, never]
