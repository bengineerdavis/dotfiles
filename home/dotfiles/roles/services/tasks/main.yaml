# roles/services/tasks/main.yaml
#
# This file deliberately FAILS. Import the phase you want, by name:
#
#     ansible.builtin.import_role:
#       name: "roles/services"
#       tasks_from: install.yaml     # or: remove.yaml
#
# Why a guard instead of a router: a whole-role import pulls in BOTH phases and
# the importing task's tags are inherited by everything underneath. The parent
# tag then overrides this role's own `never`, so `--tags install` ran the
# teardown too — measured 2026-11-20, where a tagged install run deleted the
# live plist and left the daemon down with `ProgramArguments: [shim]` only,
# because remove.yaml's thinner vars re-rendered the unit last.
#
# `never` cannot fix that: `never` only skips a task when nothing else selects
# it, and an inherited `install` tag does select it. The only reliable fix is
# to not import the phase that must not run.

- name: "services: refuse a whole-role import"
  ansible.builtin.fail:
    msg: >-
      Import roles/services with tasks_from: install.yaml or tasks_from:
      remove.yaml. A whole-role import selects both phases, and the caller's
      tags override this role's `never`, so `--tags install` would also run
      the teardown.
  tags: [always]
