# roles/guards/tasks/dotagents-skills-migration.yaml
#
# Guard: dotagents relocates an agent's skills directory, and refuses to do it
# when a name already exists on the other side.
#
# At user scope dotagents installs into ~/.agents/skills and points each
# supported agent's skills directory at it with a symlink. Where that directory
# is still a *real* directory it first migrates the contents across, and
# `migrateDirectory` (dist/symlinks/manager.js) aborts on any entry name that
# already exists in ~/.agents/skills:
#
#   Cannot migrate <agent>/skills because these entries already exist in
#   <home>/.agents/skills: <names>. Resolve the conflicts before retrying.
#
# It throws SymlinkError, which the CLI's own catch does not handle — it knows
# only TrustError, GitError and InstallError. So the process exits 1 with that
# sentence on **stderr** and nothing at all on stdout. Any Ansible task that
# only inspects `.stdout` sees an empty string and reports a bare "non-zero
# return code", which is exactly how this cost an afternoon on 2026-09-12.
#
# Confirmed by reproduction, not inference: with ~/.claude/skills a real
# directory holding `commit-hygiene`, `dotagents add <src> commit-hygiene`
# exits 1 with that message. With it a symlink, the same command succeeds.
#
# Never resolve it automatically. The two sides are two different copies of a
# skill — typically a hand-made symlink into a live working clone on one side
# and a pinned upstream checkout on the other — and choosing between them is a
# judgement, not a cleanup. Note that dotagents itself does NOT protect the
# other direction: a hand-made symlink at ~/.agents/skills/<name> is silently
# removed and replaced by `copyDir`, so anything you want to keep must be
# declared, not left lying in the destination.
#
# Parameters (see roles/guards/defaults/main.yaml):
#   guard_agents_skills_dir, guard_agent_homes,
#   guard_allow_skill_dir_conflicts, guard_caller

- name: "Guard: find agent skills directories dotagents cannot migrate"
  ansible.builtin.shell:
    cmd: |
      set -uo pipefail
      agents_skills={{ guard_agents_skills_dir | quote }}
      # Nothing installed yet means nothing to collide with.
      [ -d "$agents_skills" ] || exit 0
      for home in {{ guard_agent_homes | map('quote') | join(' ') }}; do
        target="$home/skills"
        # A symlink is already managed; an absent directory has nothing to move.
        [ -L "$target" ] && continue
        [ -d "$target" ] || continue
        # Dotfiles count: dotagents' readdir does not skip them, so a directory
        # like codex's `.system` is a migration entry like any other.
        for entry in "$target"/* "$target"/.[!.]*; do
          [ -e "$entry" ] || [ -L "$entry" ] || continue
          name=${entry##*/}
          if [ -e "$agents_skills/$name" ] || [ -L "$agents_skills/$name" ]; then
            printf '%s (in %s)\n' "$name" "$target"
          fi
        done
      done
  args:
    executable: /bin/bash
  register: guard_skill_dir_conflicts
  changed_when: false
  failed_when: false

- name: "Guard: fail with the fix when a skills directory cannot be migrated"
  ansible.builtin.fail:
    msg: >-
      [dotagents-skills-migration] {{ guard_caller }} is about to run dotagents,
      which would relocate an agent skills directory into
      {{ guard_agents_skills_dir }} — and cannot, because these names exist on
      both sides:
      {{ guard_skill_dir_conflicts.stdout_lines | join('; ') }}.
      dotagents would abort with "Cannot migrate ... Resolve the conflicts
      before retrying." on stderr and exit 1. Nothing has been installed or
      moved. Three ways out, in the order worth considering them:
      (1) if the agent-side copy is the stale one — a hand-made symlink from
      before this topic owned the skill — delete just that entry and re-run;
      (2) if it is the one you want to keep, declare it to dotagents as
      `path:.agents/skills/<name>` so it is adopted in place rather than
      fought over; (3) accept the conflict for this run only with
      `-e guard_allow_skill_dir_conflicts=true`, which lets dotagents fail on
      its own terms. This guard deletes nothing.
  when:
    - not (guard_allow_skill_dir_conflicts | bool)
    - (guard_skill_dir_conflicts.stdout | default('') | trim | length) > 0
