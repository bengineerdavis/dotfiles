# roles/secrets-session/tasks/onepassword.yaml
#
# Obtain a signed-in 1Password CLI session and expose it as the fact
# `secrets_onepassword_session`.
#
# Honour order:
#   1. existing OP_SESSION_* env var or desktop-app integration
#   2. interactive `op signin` prompt
#
# 1Password on macOS prefers biometric unlock via the desktop app; when that is
# configured, plain `op signin` returns a session token without asking for the
# master password. When it is not configured, the user must provide either a
# service-account token or answer the master-password prompt.
#
# Tasks that handle sessions are marked `no_log: true`.

- name: "1Password: probe op CLI"
  ansible.builtin.shell:
    cmd: command -v op >/dev/null 2>&1
    executable: /bin/bash
  register: secrets_session_op_probe
  changed_when: false
  failed_when: false

- name: "1Password: fail if op CLI is absent"
  ansible.builtin.fail:
    msg: |
      The 1Password CLI (`op`) is not on PATH.

      The binary is managed by the mise topic; ensure this line is present in
      apps/mise/files/config.toml under [tools]:

          "1password-cli" = "latest"

      Run the mise topic first:

          ./run-role.sh mise
  when:
    - secrets_session_op_probe.rc | default(1) != 0

- name: "1Password: determine effective service account token"
  ansible.builtin.set_fact:
    secrets_op_service_account_token: >-
      {{ ansible_facts['env']['OP_SERVICE_ACCOUNT_TOKEN']
         | default(ansible_facts['env']['OP_SERVICE_ACCOUNT_TOKEN_SECRET_ID'], true)
         | default('', true) }}
  no_log: true

- name: "1Password: use service-account token if available"
  ansible.builtin.set_fact:
    secrets_onepassword_session: "{{ secrets_op_service_account_token }}"
  no_log: true
  when:
    - secrets_op_service_account_token | length > 0

- name: "1Password: attempt configured account sign-in"
  block:
    - name: "1Password: list configured accounts"
      ansible.builtin.command:
        cmd: op account list --format json
      register: secrets_session_op_accounts
      changed_when: false
      no_log: true
      failed_when: false

    - name: "1Password: sign in using the configured default account"
      ansible.builtin.command:
        cmd: op signin --raw
      register: secrets_session_op_signin
      changed_when: false
      no_log: true
      failed_when: false
      when:
        - secrets_session_op_accounts.rc | default(1) == 0
        - secrets_session_op_accounts.stdout | default('') | trim | length > 0

    - name: "1Password: adopt sign-in session"
      ansible.builtin.set_fact:
        secrets_onepassword_session: "{{ secrets_session_op_signin.stdout | trim }}"
      no_log: true
      when:
        - secrets_session_op_signin.rc | default(1) == 0
        - secrets_session_op_signin.stdout | default('') | trim | length > 0
  when: secrets_onepassword_session is not defined

- name: "1Password: prompt for master password"
  ansible.builtin.pause:
    prompt: "1Password master password:"
  register: secrets_session_op_prompt
  when:
    - secrets_onepassword_session is not defined
    - secrets_session_allow_prompt | bool

- name: "1Password: sign in with prompted master password"
  ansible.builtin.command:
    cmd: op signin --raw
  environment:
    OP_MASTER_PASSWORD: "{{ secrets_session_op_prompt.user_input | default('') }}"
  register: secrets_session_op_prompt_signin
  changed_when: false
  no_log: true
  failed_when: false
  when:
    - secrets_onepassword_session is not defined
    - secrets_session_op_prompt.user_input | default('') | length > 0

- name: "1Password: adopt prompted sign-in session"
  ansible.builtin.set_fact:
    secrets_onepassword_session: "{{ secrets_session_op_prompt_signin.stdout | trim }}"
  no_log: true
  when:
    - secrets_onepassword_session is not defined
    - secrets_session_op_prompt_signin.rc | default(1) == 0
    - secrets_session_op_prompt_signin.stdout | default('') | trim | length > 0

- name: "1Password: finalise fact as empty if no session was obtained"
  ansible.builtin.set_fact:
    secrets_onepassword_session: "{{ secrets_onepassword_session | default('') }}"
  no_log: true

- name: "1Password: fail if session could not be obtained"
  ansible.builtin.fail:
    msg: |
      Could not obtain a signed-in 1Password session.

      Tried (in order):
        - OP_SERVICE_ACCOUNT_TOKEN environment variable
        - configured account via `op signin --raw`
        - interactive prompt for master password

      To fix:
        - Ensure the 1Password desktop app is installed and
          Settings > Developer > "Integrate with 1Password CLI" is enabled,
          or
        - Use a service-account token: pass -e
          secrets_session_op_service_account_token=...
  when:
    - secrets_session_required | default(true) | bool
    - secrets_onepassword_session | length == 0
