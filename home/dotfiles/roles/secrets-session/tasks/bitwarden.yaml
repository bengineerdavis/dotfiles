# roles/secrets-session/tasks/bitwarden.yaml
#
# Obtain an unlocked Bitwarden session and expose it as the fact
# `secrets_bitwarden_session`.
#
# Honour order:
#   1. existing BW_SESSION env var / session already in use
#   2. BW_SESSION cached in ~/.localrc
#   3. macOS Keychain entry for the configured service/account
#   4. interactive prompt for the master password
#
# If all unlock sources fail, the tasks set `secrets_bitwarden_session` to an
# empty string so the caller can decide whether to fail or fall back.
#
# Tasks that handle secrets and sessions are marked `no_log: true` so that
# session tokens and passwords do not appear in Ansible output.

- name: "Bitwarden: probe bw CLI"
  ansible.builtin.shell:
    cmd: command -v bw >/dev/null 2>&1
    executable: /bin/bash
  register: secrets_session_bw_probe
  changed_when: false
  failed_when: false

- name: "Bitwarden: fail if bw CLI is absent"
  ansible.builtin.fail:
    msg: |
      The Bitwarden CLI (`bw`) is not on PATH.

      The binary is managed by the mise topic; ensure this line is present in
      apps/mise/files/config.toml under [tools]:

          "bitwarden" = "latest"

      Run the mise topic first:

          ./run-role.sh mise
  when:
    - secrets_session_bw_probe.rc | default(1) != 0

- name: "Bitwarden: check current vault status"
  ansible.builtin.command:
    cmd: bw status --raw
  register: secrets_session_bw_status
  changed_when: false
  no_log: true

- name: "Bitwarden: parse status response"
  ansible.builtin.set_fact:
    secrets_session_bw_state: "{{ (secrets_session_bw_status.stdout | default('')) | trim }}"

- name: "Bitwarden: reuse existing session"
  ansible.builtin.set_fact:
    secrets_bitwarden_session: "{{ ansible_facts['env']['BW_SESSION'] | default('') }}"
  no_log: true
  when:
    - secrets_session_bw_state == "unlocked"
    - (ansible_facts['env']['BW_SESSION'] | default('')) | length > 0

- name: "Bitwarden: attempt unlock from ~/.localrc session"
  ansible.builtin.shell:
    cmd: |
      set -o pipefail
      grep -E '^\s*export\s+BW_SESSION=' "{{ ansible_facts['env']['HOME'] }}/.localrc" 2>/dev/null \
        | tail -n1 \
        | sed -E "s/^\\s*export\\s+BW_SESSION=//; s/^['\\\"]//; s/['\\\"]$//"
    executable: /bin/bash
  register: secrets_session_bw_localrc_session
  changed_when: false
  failed_when: false
  no_log: false
  when: secrets_bitwarden_session is not defined

- name: "Bitwarden: test ~/.localrc session"
  ansible.builtin.command:
    cmd: bw status --session {{ secrets_session_bw_localrc_session.stdout | trim | quote }} --raw
  register: secrets_session_bw_localrc_valid
  changed_when: false
  failed_when: false
  no_log: true
  when:
    - secrets_bitwarden_session is not defined
    - secrets_session_bw_localrc_session.stdout | default('') | trim | length > 0

- name: "Bitwarden: adopt ~/.localrc session"
  ansible.builtin.set_fact:
    secrets_bitwarden_session: "{{ secrets_session_bw_localrc_session.stdout | trim }}"
  no_log: true
  when:
    - secrets_bitwarden_session is not defined
    - secrets_session_bw_localrc_valid.rc | default(1) == 0
    - secrets_session_bw_localrc_valid.stdout | default('') | trim == "unlocked"

- name: "Bitwarden: try macOS Keychain master password"
  block:
    - name: "Bitwarden: read master password from macOS Keychain"
      ansible.builtin.command:
        cmd: >-
          security find-generic-password
          -s {{ secrets_session_bitwarden_keychain_service | quote }}
          -a {{ secrets_session_bitwarden_keychain_account | quote }}
          -w
      register: secrets_session_bw_keychain_password
      changed_when: false
      failed_when: false
      no_log: true

    - name: "Bitwarden: unlock with Keychain password"
      ansible.builtin.command:
        cmd: bw unlock --raw
      environment:
        BW_PASSWORD: "{{ secrets_session_bw_keychain_password.stdout | default('') }}"
      register: secrets_session_bw_keychain_unlock
      changed_when: false
      no_log: true
      when: secrets_session_bw_keychain_password.stdout | default('') | trim | length > 0

    - name: "Bitwarden: adopt Keychain-derived session"
      ansible.builtin.set_fact:
        secrets_bitwarden_session: "{{ secrets_session_bw_keychain_unlock.stdout | trim }}"
      no_log: true
      when:
        - secrets_session_bw_keychain_unlock.rc | default(1) == 0
        - secrets_session_bw_keychain_unlock.stdout | default('') | trim | length > 0
  when:
    - secrets_bitwarden_session is not defined
    - ansible_facts['os_family'] == 'Darwin'

- name: "Bitwarden: prompt for master password"
  ansible.builtin.pause:
    prompt: "Bitwarden master password:"
  register: secrets_session_bw_prompt
  when:
    - secrets_bitwarden_session is not defined
    - secrets_session_allow_prompt | bool

- name: "Bitwarden: unlock with prompted password"
  ansible.builtin.command:
    cmd: bw unlock --raw
  environment:
    BW_PASSWORD: "{{ secrets_session_bw_prompt.user_input | default('') }}"
  register: secrets_session_bw_prompt_unlock
  changed_when: false
  no_log: true
  when:
    - secrets_bitwarden_session is not defined
    - secrets_session_bw_prompt.user_input | default('') | length > 0

- name: "Bitwarden: adopt prompted session"
  ansible.builtin.set_fact:
    secrets_bitwarden_session: "{{ secrets_session_bw_prompt_unlock.stdout | trim }}"
  no_log: true
  when:
    - secrets_bitwarden_session is not defined
    - secrets_session_bw_prompt_unlock.rc | default(1) == 0
    - secrets_session_bw_prompt_unlock.stdout | default('') | trim | length > 0

- name: "Bitwarden: finalise fact as empty if no session was obtained"
  ansible.builtin.set_fact:
    secrets_bitwarden_session: "{{ secrets_bitwarden_session | default('') }}"
  no_log: true

- name: "Bitwarden: fail if vault could not be unlocked"
  ansible.builtin.fail:
    msg: |
      Could not obtain an unlocked Bitwarden session.

      Tried (in order):
        - BW_SESSION environment variable (current shell was unlocked)
        - BW_SESSION exported in {{ ansible_facts['env']['HOME'] }}/.localrc
        - macOS Keychain entry for service {{ secrets_session_bitwarden_keychain_service }}
        - interactive prompt for master password

      To fix:
        - Run `bw unlock` and export BW_SESSION, or
        - On macOS, store the master password in your login keychain:
            security add-generic-password -a {{ secrets_session_bitwarden_keychain_account }} -s {{ secrets_session_bitwarden_keychain_service }} -w "<master-password>"
  when:
    - secrets_session_required | default(true) | bool
    - secrets_bitwarden_session | length == 0
