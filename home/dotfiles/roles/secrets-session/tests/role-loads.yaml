---
# roles/secrets-session/tests/role-loads.yaml
#
# Sanity test that the helper role can be loaded without errors in check mode,
# and that the right fact names are advertised. This test is safe to run
# anywhere because it calls main.yaml and does not attempt to unlock a vault.
#
# Run: ansible-playbook roles/secrets-session/tests/role-loads.yaml

- name: "Test secrets-session role loads and advertises empty facts"
  hosts: localhost
  connection: local
  gather_facts: true
  become: false

  tasks:
    - name: "Include the secrets-session role without tasks_from"
      ansible.builtin.include_role:
        name: roles/secrets-session
      # main.yaml intentionally does nothing; it should not fail.

    - name: "Assert main.yaml completed cleanly"
      ansible.builtin.assert:
        that:
          - secrets_bitwarden_session is not defined
          - secrets_onepassword_session is not defined
        success_msg: "PASS: secrets-session main.yaml is a no-op and does not touch vault facts"
        fail_msg: "FAIL: main.yaml unexpectedly defined vault facts"
