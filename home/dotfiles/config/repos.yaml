  - { path: personal/mkdb, group: personal }                      # no remote
  - { path: personal/myscripts, group: personal }                 # gitlab
  - { path: personal/pcshopper, group: personal }
  - { path: personal/prompt-spec, group: personal }
  - { path: personal/questionable, group: personal }
  - { path: personal/rootimentary, group: personal }
  - { path: personal/sawmill, group: personal }
  - { path: personal/fileauthority, group: personal }             # gitlab
  - { path: personal/topical, group: personal }
  - { path: personal/llocallabs, group: personal }                # no remote (redge-cli PRD)
  - { path: personal/ai-prompt-library-escalation-writing, group: personal }  # worktree of ai-prompt-library
  - { path: personal/bengineerdavis.github.io, group: personal }
  - { path: personal/ansible, group: personal }                   # gitlab, own (was resources/ansible)
  - { path: personal/bt-import, group: personal }                 # own, not a fork
