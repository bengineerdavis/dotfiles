# dotfiles/config/repos.yaml
#
# The personal repo catalogue: which repos exist on a machine and what type
# they are, per docs/LAYOUT.md. `apps/gita` reads this to register and group
# repos. Paths are relative to ~/code.
#
# This is the ownership split, not the purpose split: `personal` is what the
# author owns (including no-remote/local repos and own forks used for
# interviews), `forks` is third-party — cloned from an owner that is not the
# author and not an employer. `work` is empty on the author's own machines;
# its repos live on the work machine and are named only in a machine-local
# overlay (spec.md § Data — employer strings are never committed).
#
# Fallout of the 2026-10-18 ownership re-settle, recorded for the next reader:
#   - The former `resources/` tree folded into `forks/` (all its members are
#     third-party clones); `ansible` there is the author's and is `personal`.
#   - `github/gitignore` is cloned twice (resources/gitignore and
#     personal/new_python_project_files/gitignore). Only one is registered
#     below; the duplicate is dropped rather than given two gita names.
#   - Fork-vs-own is decided by GitHub's fork metadata, not the remote owner
#     string (verified via gh api 2026-10-18): `promptlint` is a fork of
#     AryaanSheth/promptlint → `forks`, even though the author contributes;
#     `bt-import` is not a fork (`fork: false`) → `personal`.
#
# Stopgap caveat: paths are the CURRENT (unmigrated) locations under
# projects/…. When the LAYOUT phase-4 migration moves repos into the type
# dirs, these paths change and the entries are re-pointed — gita re-registers
# a repo on move, nothing is deleted.

repos:
