# apps/backlog/defaults/main.yaml
#
# backlog — the backlog-md-py task tool (rmusser01/backlog-md-py), this
# fleet's task queue of record (docs/BACKLOG-MIGRATION.md). The topic owns
# two things: the pipx install through mise's first-party capture (the
# TOPIC-RECIPES.md tool-entry-ownership recipe), and the singleton MCP
# daemon's service unit (the service-ownership recipe) — the daemon is what
# serializes queue mutations across concurrent agent sessions.

# mise shims resolve the binary at a stable path — never a version-pinned
# install path (the service recipe's stable-path rule).
backlog_bin: "{{ ansible_env.HOME }}/.local/share/mise/shims/backlog-py"

# Daemon endpoint and lifecycle. 127.0.0.1 only: the bearer token in the
# runtime record protects the loopback endpoint, and there is no reason for
# the queue to listen further.
backlog_daemon_host: 127.0.0.1
backlog_daemon_port: 18765
backlog_daemon_label: "com.backlog-py.daemon"
backlog_logs_dir: "{{ ansible_env.HOME }}/.local/state/backlog-py"
backlog_plist_path: >-
  {{ ansible_env.HOME }}/Library/LaunchAgents/{{ backlog_daemon_label }}.plist
backlog_unit_path: >-
  {{ ansible_env.HOME }}/.config/systemd/user/backlog-daemon.service
