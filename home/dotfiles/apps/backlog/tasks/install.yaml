# apps/backlog/tasks/install.yaml
#
# Two pieces of owned state, per the TOPIC-RECIPES.md recipes:
#   1. the pipx entry, via mise's first-party capture (tool-entry-ownership)
#   2. the daemon's service unit (service ownership for daemon-backed topics)
# Tagged [install, upgrade]: the mise entry and the unit file are both
# converged here, and no system role upgrades a pipx tool.

- name: "backlog: probe the mise entry"
  ansible.builtin.shell:
    cmd: >-
      mise ls --global --json
      | python3 -c "import json,sys; sys.exit(0 if 'pipx:backlog-md-py' in json.load(sys.stdin) else 1)"
  register: backlog_mise_probe
  changed_when: false
  failed_when: false
  check_mode: false
  tags: [backlog, install, upgrade]

- name: "backlog: install backlog-md-py via mise (first-party capture)"
  # The TOPIC-RECIPES.md ownership recipe: `mise use -g` writes the entry
  # into the tracked config through the deployed symlink. The dirty tree it
  # leaves is the capture — committed by the operator, never by this run.
  ansible.builtin.command: mise use -g pipx:backlog-md-py
  when: backlog_mise_probe.rc != 0
  tags: [backlog, install, upgrade]

- name: "backlog: verify the binaries landed"
  ansible.builtin.shell:
    cmd: command -v backlog-py >/dev/null 2>&1 && command -v backlog-py-mcp >/dev/null 2>&1
  register: backlog_bin_check
  changed_when: false
  failed_when: backlog_bin_check.rc != 0
  check_mode: false
  tags: [backlog, install, upgrade]

- name: "backlog: install the daemon service unit (Darwin)"
  ansible.builtin.template:
    src: backlog-daemon.plist.j2
    dest: "{{ backlog_plist_path }}"
    mode: "0644"
  register: backlog_unit_file
  when: ansible_facts['os_family'] == 'Darwin'
  tags: [backlog, install, upgrade]

- name: "backlog: install the daemon service unit (Debian)"
  ansible.builtin.template:
    src: backlog-daemon.service.j2
    dest: "{{ backlog_unit_path }}"
    mode: "0644"
  register: backlog_unit_file
  when: ansible_facts['os_family'] == 'Debian'
  tags: [backlog, install, upgrade]

- name: "backlog: create the log directory"
  ansible.builtin.file:
    path: "{{ backlog_logs_dir }}"
    state: directory
    mode: "0755"
  tags: [backlog, install, upgrade]

- name: "backlog: (re)bootstrap the daemon (Darwin)"
  # bootout-then-bootstrap from the service recipe: a bootout of a missing
  # service errors, so it is tolerated; bootstrap then enable converge both.
  ansible.builtin.shell:
    cmd: >-
      launchctl bootout gui/$(id -u)/{{ backlog_daemon_label }} 2>/dev/null;
      launchctl bootstrap gui/$(id -u) {{ backlog_plist_path }}
      && launchctl enable gui/$(id -u)/{{ backlog_daemon_label }}
  when: ansible_facts['os_family'] == 'Darwin'
  register: backlog_service_load
  changed_when: "'already' not in (backlog_service_load.stderr | default(''))"
  tags: [backlog, install, upgrade]

- name: "backlog: (re)start the daemon (Debian)"
  ansible.builtin.systemd:
    name: backlog-daemon
    enabled: true
    state: restarted
    scope: user
  register: backlog_service_load
  when: ansible_facts['os_family'] == 'Debian'
  tags: [backlog, install, upgrade]

- name: "backlog: note the Debian session-only caveat"
  # A systemd user timer only fires while the user has a session. Report
  # the fix; never change login behaviour silently (AGENTS.md).
  ansible.builtin.debug:
    msg: >-
      backlog-daemon is a systemd USER unit: it runs only while a session
      exists. For an always-on daemon on a headless box, run
      `loginctl enable-linger {{ ansible_facts['env']['USER'] }}` yourself —
      the topic deliberately does not change login behaviour.
  when: ansible_facts['os_family'] == 'Debian'
  tags: [backlog, install, upgrade]

- name: "backlog: health check the daemon"
  ansible.builtin.shell:
    cmd: |
      for i in 1 2 3 4 5; do
        {{ backlog_bin }} daemon status --json >/dev/null 2>&1 && exit 0
        sleep 2
      done
      exit 1
  register: backlog_health
  changed_when: false
  failed_when: backlog_health.rc != 0
  check_mode: false
  when: not ansible_check_mode
  tags: [backlog, install, upgrade]
