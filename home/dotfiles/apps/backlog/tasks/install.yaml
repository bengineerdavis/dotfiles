# apps/backlog/tasks/install.yaml
#
# Two pieces of owned state, per the TOPIC-RECIPES.md recipes:
#   1. the pipx entry, via mise's first-party capture (tool-entry-ownership)
#   2. the daemon's service unit (service ownership for daemon-backed topics)
# Tagged [install, upgrade]: the mise entry and the unit file are both
# converged here, and no system role upgrades a pipx tool.

- name: "backlog: probe the mise entry"
  ansible.builtin.shell:
    cmd: >-
      mise ls --global --json
      | python3 -c "import json,sys; sys.exit(0 if 'pipx:backlog-md-py' in json.load(sys.stdin) else 1)"
  register: backlog_mise_probe
  changed_when: false
  failed_when: false
  check_mode: false
  tags: [backlog, install, upgrade]

- name: "backlog: install backlog-md-py via mise (first-party capture)"
  # The TOPIC-RECIPES.md ownership recipe: `mise use -g` writes the entry
  # into the tracked config through the deployed symlink. The dirty tree it
  # leaves is the capture — committed by the operator, never by this run.
  ansible.builtin.command: mise use -g pipx:backlog-md-py
  when: backlog_mise_probe.rc != 0
  tags: [backlog, install, upgrade]

- name: "backlog: verify the binaries landed"
  ansible.builtin.shell:
    cmd: command -v backlog-py >/dev/null 2>&1 && command -v backlog-py-mcp >/dev/null 2>&1
  register: backlog_bin_check
  changed_when: false
  failed_when: backlog_bin_check.rc != 0
  check_mode: false
  tags: [backlog, install, upgrade]

- name: "backlog: install and converge the daemon service"
  # The unit rendering and the launchd convergence order live in roles/services,
  # which is tested against a disabled label (DOT-343). This topic supplies only
  # its own values: the label, the argv, where logs go, and the health probe.
  #
  # The health command is the daemon's own status, so a bootstrap that returns 0
  # while leaving nothing listening still fails the run rather than passing it.
  ansible.builtin.import_role:
    name: "roles/services"
    tasks_from: install.yaml
  vars:
    service_label: "{{ backlog_daemon_label }}"
    service_description: "backlog-md-py singleton daemon (queue mutation serialization)"
    service_program_arguments:
      - "{{ backlog_bin }}"
      - daemon
      - run
      - --foreground
      - --host
      - "{{ backlog_daemon_host }}"
      - --port
      - "{{ backlog_daemon_port }}"
    service_log_path: "{{ backlog_logs_dir }}/daemon.log"
    service_unit_path: "{{ backlog_plist_path }}"
    service_systemd_name: "{{ backlog_daemon_label }}"
    service_systemd_unit_path: "{{ backlog_unit_path }}"
    service_health_command: "{{ backlog_bin }} daemon status --json"
  tags: [backlog, install, upgrade]
