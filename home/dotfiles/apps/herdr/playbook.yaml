# apps/herdr playbook.yaml — standalone runner for this topic role.
# Usage: ansible-playbook dotfiles/apps/herdr/playbook.yaml [--tags install|provision|remove]
#   A bare run (no --tags) runs provision; remove is opt-in via --tags remove (tagged never).
#
# Assumes mise is already installed (apps/mise).

- name: "Run herdr role standalone"
  hosts: localhost
  connection: local
  gather_facts: true
  become: false

  roles:
    - role: apps/herdr
