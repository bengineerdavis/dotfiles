---
# Prove removal is safe: only the installed release files disappear; the
# sentinel (standing in for user VM data) and QEMU survive.
- name: Test topic removal preserves user VM data and shared QEMU
  hosts: localhost
  connection: local
  gather_facts: true
  become: false
  vars:
    lima_test_home: "{{ molecule_ephemeral_directory }}/home"
    lima_install_prefix: "{{ lima_test_home }}/.local"
  tasks:
    - name: Run the topic's remove lifecycle
      ansible.builtin.include_role:
        name: apps/lima
        tasks_from: remove.yaml

    - name: Assert the installed binary is gone
      ansible.builtin.stat:
        path: "{{ lima_install_prefix }}/bin/limactl"
      register: lima_removed
      failed_when: lima_removed.stat.exists

    - name: Assert the sentinel survived removal
      ansible.builtin.stat:
        path: "/tmp/lima-{{ molecule_ephemeral_directory | hash('sha1') }}/keep-me.txt"
      register: lima_sentinel
      failed_when: not lima_sentinel.stat.exists

    - name: Assert shared QEMU is untouched
      ansible.builtin.command:
        argv: ["sh", "-c", "command -v qemu-system-aarch64 || command -v qemu-system-x86_64"]
      changed_when: false

    - name: Reinstall so destroy can reach limactl
      ansible.builtin.include_role:
        name: apps/lima
