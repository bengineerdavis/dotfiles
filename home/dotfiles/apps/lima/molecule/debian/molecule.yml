---
driver:
  name: default
  # managed: true makes the delegated driver merge instance_config (address,
  # port, identity_file, user) into the inventory for SSH connections.
  managed: true
platforms:
  # Short name: Lima's SSH socket path (hash + name + suffix) must stay under
  # UNIX_PATH_MAX=104. "lima-mol" keeps the full sha1 hash within budget.
  - name: lima-mol
    image: "https://cloud.debian.org/images/cloud/bookworm/20260923-2610/debian-12-genericcloud-amd64-20260923-2610.qcow2"
    digest: "sha512:3d94c9dd66d8a283fde060b8810373b7ae04038b956ee00d553d1ae564f6fbdeaa2fd6e7404e87e53348b5a9509170f3ea7c0731ba737590c5c4cb8d559a47f8"
    image_arch: x86_64
    arm64_image: "https://cloud.debian.org/images/cloud/bookworm/20260923-2610/debian-12-genericcloud-arm64-20260923-2610.qcow2"
    arm64_digest: "sha512:89a752d5c7d8e88bee39a57d88d496cca574f7d1e8df5df7a169825435f99feb11ed13ab27ec7bee96fe1584be4ff9479358fbca6cc859efa109f4aba18724c8"
provisioner:
  name: ansible
  playbooks:
    create: ../../../lima/molecule/shared/create.yml
    destroy: ../../../lima/molecule/shared/destroy.yml
    cleanup: ../../../lima/molecule/shared/cleanup.yml
  env:
    ANSIBLE_ROLES_PATH: "${MOLECULE_PROJECT_DIRECTORY}"
  inventory:
    host_vars:
      lima-mol:
        ansible_python_interpreter: /usr/bin/python3
verifier:
  name: ansible
scenario:
  test_sequence:
    - dependency
    - destroy
    - create
    - converge
    - idempotence
    - side_effect
    - verify
    - cleanup
    - destroy
