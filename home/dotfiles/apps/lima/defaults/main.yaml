# Lima is installed directly, rather than through a package manager that also
# owns shared host state. The digest and the SHA256SUMS file are both required.
# Release checksums below come from Lima's v2.2.1 GitHub release, 2026-10-28.
lima_release_tag: v2.2.1
lima_install_prefix: "{{ ansible_env.HOME }}/.local"
lima_install_dir: "{{ lima_install_prefix }}/bin"
lima_release_os: "{{ 'Darwin' if ansible_facts.os_family == 'Darwin' else 'Linux' }}"
lima_release_arch: "{{ lima_release_architectures[ansible_facts.architecture] }}"
lima_release_architectures:
  arm64: arm64
  aarch64: arm64
  x86_64: x86_64
lima_release_checksums:
  Darwin-arm64: 9e9eacce88f37e185c346bad73aa6136f738d8cdf8c3bb23cd42b071824bc66e
  Darwin-x86_64: 6b776e4bc41f358e6ee01fefcc78e2eb26f11635a0fcff632234af77a566c6c4
  Linux-arm64: fbcf4d127936666aa2cf6013b663c250431f2a59394757b404070f8d6a160e10
  Linux-x86_64: b391ac7fcac2b2a5a1628107756463188ded4d18d3104a40a66a8bb6fec01bcb
lima_release_name: "lima-{{ lima_release_tag | regex_replace('^v', '') }}"
lima_release_asset: "{{ lima_release_name }}-{{ lima_release_os }}-{{ lima_release_arch }}.tar.gz"
lima_release_base_url: "https://github.com/lima-vm/lima/releases/download/{{ lima_release_tag }}"
lima_release_url: "{{ lima_release_base_url }}/{{ lima_release_asset }}"
lima_checksums_url: "{{ lima_release_base_url }}/SHA256SUMS"
lima_archive: "/tmp/{{ lima_release_asset }}"
lima_checksums_file: "/tmp/{{ lima_release_name }}-SHA256SUMS"

# Delete only the unpacked upstream installation by default. Never prune or
# delete ~/.lima: it can contain user VMs and other applications' state.
lima_remove_installed_files: true
