# apps/zoxide/tasks/remove.yaml
# Explicit uninstall tasks. Never run as part of provision or install.
# Only invoked via --tags remove.
# Mirror the install.yaml structure — one block per package manager.

# ── macOS (Homebrew) ────────────────────────────────────────────────────────────
- name: "Remove zoxide via Homebrew (macOS)"
  community.general.homebrew:
    name: zoxide
    state: absent
  when: ansible_facts['os_family'] == 'Darwin'

