role: long
property: instruction-adherence
# Format compliance DEGRADES with context length: a model that emits a bare
# token cleanly at 500 tokens will often wrap it in "I found it! The code is …"
# at 16k. That decay is the thing this cell measures, which is why the same
# constraint is not simply tested in the chat role.
#
# Distinct needle from long-faithfulness so the two cases cannot be satisfied by
# recalling one string.
num_ctx: 32768
filler:
  words: 12000
  needle_at: 0.35
context: |
  Operational note: the Halligan ledger reconciliation code is 7Y-2048-BQ. It is
  quoted here once and appears nowhere else in this document.
prompt: |
  Find the Halligan ledger reconciliation code in the text above. Reply with
  ONLY that code — no prose, no label, no quotes, no punctuation, nothing else.
check: |
  raw = response.strip().strip('.').strip('"').strip("'").strip()
  assert raw == "7Y-2048-BQ", f"expected the bare code, got {raw[:120]!r}"
