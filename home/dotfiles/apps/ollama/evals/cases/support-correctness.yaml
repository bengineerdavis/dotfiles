role: support
property: correctness
# ANSWER-shaped counterpart to support-faithfulness. There the evidence does not
# determine a cause and hedging is correct; here it does, and hedging is the
# failure. A model that always answers "insufficient evidence" farms the refusal
# cell and fails this one — which is the point of keeping both shapes.
#
# The difficulty axis is CONFOUNDER COUNT, not option count: real triage gets
# hard because many things changed in the same window, not because the answer
# list got longer. Every level keeps the same decisive evidence (one key issued
# 61,400 of 61,640 requests against a shared 1,000/min limit) and adds
# concurrent events that are plausible but excluded by that evidence.
#
# The correct LETTER moves between levels so a model cannot ride one guess up
# the ladder.
#
# Synthesised from the problem class. No real incident or system.
num_ctx: 8192
vars:
  expected: "B"
sweep:
  ordered: true
  levels:
    - label: "1-confounder"
      vars: {expected: "B"}
    - label: "3-confounders"
      vars: {expected: "D"}
      context: |
        Incident note.

        At 14:03 the API began returning HTTP 429 to all clients.

        The rate limiter is configured at 1,000 requests per minute, shared
        across all API keys. Access logs show api_key_7742 issued 61,400
        requests between 14:02 and 14:03; every other key combined issued 240 in
        that same minute. The 429s stopped at 14:05 when api_key_7742 stopped
        sending traffic.

        Also in the window:
          - a deploy of the auth service completed at 14:01
          - a database failover occurred at 13:58
          - CPU on the API pods peaked at 41% of allocation
      prompt: |
        Which is the cause of the 429s?

        A. The auth service deploy broke token validation
        B. The database failover caused connection exhaustion
        C. The API pods exhausted their CPU allocation
        D. A single client consumed the shared rate limit
        E. The rate limit threshold is set too low for normal traffic

        Reply with only: ANSWER: <letter>
    - label: "5-confounders"
      vars: {expected: "C"}
      context: |
        Incident note.

        At 14:03 the API began returning HTTP 429 to all clients.

        The rate limiter is configured at 1,000 requests per minute, shared
        across all API keys. Access logs show api_key_7742 issued 61,400
        requests between 14:02 and 14:03; every other key combined issued 240 in
        that same minute. The 429s stopped at 14:05 when api_key_7742 stopped
        sending traffic.

        Also in the window:
          - a deploy of the auth service completed at 14:01
          - a database failover occurred at 13:58
          - CPU on the API pods peaked at 41% of allocation
          - a CDN cache purge at 13:55 increased origin traffic by 12%
          - a TLS certificate rotation completed at 14:00
      prompt: |
        Which is the cause of the 429s?

        A. The auth service deploy broke token validation
        B. The database failover caused connection exhaustion
        C. A single client consumed the shared rate limit
        D. The API pods exhausted their CPU allocation
        E. The CDN cache purge overloaded the origin
        F. The certificate rotation invalidated client sessions
        G. The rate limit threshold is set too low for normal traffic

        Reply with only: ANSWER: <letter>
context: |
  Incident note.

  At 14:03 the API began returning HTTP 429 to all clients.

  The rate limiter is configured at 1,000 requests per minute, shared across all
  API keys. Access logs show api_key_7742 issued 61,400 requests between 14:02
  and 14:03; every other key combined issued 240 in that same minute. The 429s
  stopped at 14:05 when api_key_7742 stopped sending traffic.

  Also in the window:
    - a deploy of the auth service completed at 14:01
prompt: |
  Which is the cause of the 429s?

  A. The rate limit threshold is set too low for normal traffic
  B. A single client consumed the shared rate limit
  C. The auth service deploy broke token validation

  Reply with only: ANSWER: <letter>
check: |
  import re
  # Lenient extraction, strict answer: shape is instruction-adherence's job.
  # Anchored on the ANSWER: label because a bare letter search collides with the
  # article "A" ("A single client consumed...") — a real trap in this option set.
  m = re.search(r'ANSWER:\s*\**([A-G])\b', response, re.I)
  if not m:
      m = re.fullmatch(r'\s*\**([A-G])\**\s*[.)]?\s*', response)
  assert m, f"no answer letter found: {' '.join(response.split())[:110]!r}"
  got = m.group(1).upper()
  assert got == expected, f"chose {got}, correct is {expected}"
