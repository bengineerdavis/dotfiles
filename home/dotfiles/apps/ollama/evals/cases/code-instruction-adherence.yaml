role: code
property: instruction-adherence
# Two constraints that are trivially checkable and commonly ignored: emit only
# code, and honour a named signature. A model that explains its answer fails,
# because callers pipe this straight to a file.
prompt: |
  Write a Python function named `chunk` taking (items, size) and returning a
  list of lists. Output ONLY the function definition — no imports, no prose, no
  code fence, no example usage.
check: |
  import ast, re
  raw = re.sub(r'^```(?:python)?|```$', '', response.strip(), flags=re.M).strip()
  tree = ast.parse(raw)
  assert len(tree.body) == 1, f"expected 1 top-level node, got {len(tree.body)}"
  fn = tree.body[0]
  assert isinstance(fn, ast.FunctionDef), f"not a function: {type(fn).__name__}"
  assert fn.name == "chunk", f"wrong name: {fn.name}"
  assert [a.arg for a in fn.args.args] == ["items", "size"]
