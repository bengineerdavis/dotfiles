role: think
property: instruction-adherence
# The think-role failure that breaks callers is REASONING LEAKAGE: the model
# solves it correctly, then emits the derivation alongside the answer. ollama
# returns real thinking in a separate field, so anything that lands in
# `response` beyond the demanded line is leakage, not thinking.
#
# Correctness is deliberately NOT asserted here — this cell measures format, and
# the existing chat/code instruction cases set that precedent. A model that
# obeys the shape but computes badly fails think-faithfulness or a future
# correctness cell, not this one.
num_ctx: 32768
prompt: |
  A shop sells pens in packs of 7 and pencils in packs of 4. Ana buys 3 packs of
  pens and 5 packs of pencils. She then gives away 9 pens and 6 pencils.

  Work it out, then reply with ONLY a single line in exactly this form:
  ANSWER: <integer>
  No reasoning, no units, no explanation, no punctuation after the number.
check: |
  import re
  lines = [ln for ln in response.strip().splitlines() if ln.strip()]
  assert len(lines) == 1, f"expected 1 line, got {len(lines)}: {lines[:3]}"
  assert re.fullmatch(r'ANSWER: -?\d+', lines[0].strip()), f"bad shape: {lines[0]!r}"
