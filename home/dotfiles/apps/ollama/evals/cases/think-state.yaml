role: think
property: correctness
# DIMENSION 6: multi-entity state with interference. Several flags, two
# environments, and operations that COUPLE them — `promote` copies staging into
# prod, `revert` copies prod back into staging. So a change to prod can silently
# change staging two steps later, and tracking one entity in isolation is not
# enough.
#
# This is what makes it different from the counterfactual case: there, state was
# a single set. Here the model must hold a grid and remember that some
# operations write ACROSS it.
#
# No arithmetic. Every value is on or off.
#
# Verified by simulation: the verifier replays the operation list and asserts the
# declared answer matches, and that the queried environment's answer is NOT the
# same as the other environment's — otherwise a model could answer the easier
# half of the grid and score.
num_ctx: 16384
vars:
  expected: "charlie"
sweep:
  ordered: true
  levels:
    - label: "2-flags"
      vars: {expected: "alpha"}
      context: |
        Two feature flags exist: alpha and bravo. Each is either on or off,
        separately, in two environments: staging and prod. Everything starts off.

        Operations:
          "enable X in E"   turns X on in environment E
          "disable X in E"  turns X off in environment E
          "promote X"       copies X's staging value into prod
          "revert X"        copies X's prod value into staging

        Applied in order:
           1. enable alpha in staging
           2. enable bravo in staging
           3. promote bravo
           4. disable bravo in staging
           5. disable alpha in staging
           6. enable alpha in prod
           7. revert alpha
    - label: "3-flags"
      vars: {expected: "charlie"}
    - label: "4-flags"
      vars: {expected: "charlie, delta"}
      context: |
        Four feature flags exist: alpha, bravo, charlie and delta. Each is either
        on or off, separately, in two environments: staging and prod. Everything
        starts off.

        Operations:
          "enable X in E"   turns X on in environment E
          "disable X in E"  turns X off in environment E
          "promote X"       copies X's staging value into prod
          "revert X"        copies X's prod value into staging

        Applied in order:
           1. enable alpha in staging
           2. enable bravo in staging
           3. promote alpha
           4. disable alpha in staging
           5. promote bravo
           6. revert bravo
           7. disable bravo in prod
           8. revert bravo
           9. enable charlie in prod
          10. revert charlie
          11. enable delta in staging
          12. promote delta
          13. disable delta in staging
          14. revert delta
context: |
  Three feature flags exist: alpha, bravo and charlie. Each is either on or off,
  separately, in two environments: staging and prod. Everything starts off.

  Operations:
    "enable X in E"   turns X on in environment E
    "disable X in E"  turns X off in environment E
    "promote X"       copies X's staging value into prod
    "revert X"        copies X's prod value into staging

  Applied in order:
     1. enable alpha in staging
     2. enable bravo in staging
     3. promote alpha
     4. disable alpha in staging
     5. promote bravo
     6. revert bravo
     7. disable bravo in prod
     8. revert bravo
     9. enable charlie in prod
    10. revert charlie
prompt: |
  Which flags are ON in STAGING at the end?

  Reply with only: ANSWER: <names, comma-separated, alphabetical>
  If none are on, reply: ANSWER: none
check: |
  import re
  NAMES = ("alpha", "bravo", "charlie", "delta")
  seg = response
  m = re.search(r'ANSWER:\s*(.+)', response, re.I)
  if m:
      seg = m.group(1)
  got = sorted(set(n.lower() for n in re.findall(
      r'\b(' + "|".join(NAMES) + r')\b', seg, re.I)))
  want = ([] if expected.strip().lower() == "none"
          else sorted(n.strip() for n in expected.split(",")))
  if not want:
      assert not got, f"named {got}, nothing should be on in staging"
  else:
      assert got, f"named no flags: {' '.join(response.split())[:120]!r}"
      assert got == want, f"answered {got}, staging has {want} on"
