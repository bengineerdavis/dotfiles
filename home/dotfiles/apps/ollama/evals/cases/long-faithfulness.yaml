role: long
property: faithfulness
# Exact-match recall — named in the model-fitness spec as a mechanically
# decidable check. The fact IS present, so this is the ANSWER-shaped half of the
# faithfulness column: a model that hedges, summarises, or says it cannot find
# the key fails, and so does one that recalls it approximately. Long-context
# failure is rarely a refusal; it is a plausible near-miss on the digits.
#
# `filler` is synthesised by the harness from a fixed vocabulary and seed, so the
# haystack is reproducible and contains no real material. needle_at places the
# fact just past the middle, the position long-context models lose first.
num_ctx: 32768
filler:
  words: 12000
  needle_at: 0.55
# The haystack and the window must grow together — a bigger `filler` at a fixed
# num_ctx measures truncation, not recall — so this needs the `levels` form.
# Top level is sized against the largest real prompt this host has logged, so a
# model that clears it clears observed use. Re-derive with `ollama-usage ctx`
# before adjusting the rungs; the figure is deliberately not committed.
#
# Ladder tops out at 64k BY HARDWARE, not by choice. This Mac is 36GB unified
# with a 24GB model budget (33% reserve). qwen3.8:27b-mlx is 18GB of weights and
# ~72 KB/token of KV, so:
#     64k tokens -> ~4.6GB KV -> ~22.6GB   fits
#     96k tokens -> ~6.9GB KV -> ~24.9GB   over budget, will swap
# A rung that swaps reports a break that is the machine's, not the model's — the
# worst possible failure for a discriminator. Rungs above 64k belong on the
# 128GB Linux box.
#
# 64k is also the principled stopping point regardless: it sits just under the
# largest real prompt this host has logged, so a model clearing 64k clears
# observed use. `ollama-usage ctx` reports the current distribution.
sweep:
  ordered: true
  levels:
    - {label: "4k",  filler: {words: 3000,  needle_at: 0.55}, num_ctx: 8192}
    - {label: "16k", filler: {words: 12000, needle_at: 0.55}, num_ctx: 32768}
    - {label: "48k", filler: {words: 36000, needle_at: 0.55}, num_ctx: 65536}
    - {label: "64k", filler: {words: 48000, needle_at: 0.55}, num_ctx: 81920}
context: |
  Operational note: the Meridian archive retention key is QF-8831-KX. This key
  is required for any restore request against the Meridian tier and is not
  recorded anywhere else in this document.
prompt: |
  Somewhere in the text above is the retention key for the Meridian archive.
  State that key exactly as it appears. If you cannot find it, say NOT FOUND.
check: |
  import re
  up = response.upper()
  assert "NOT FOUND" not in up, "claimed the key was absent — it is present"
  assert "QF-8831-KX" in up.replace(" ", ""), (
      f"key not recalled exactly; said: {' '.join(response.split())[:120]!r}")
