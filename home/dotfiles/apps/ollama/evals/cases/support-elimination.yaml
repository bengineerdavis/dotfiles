role: support
property: correctness
# DIMENSION: constraint elimination. Chaining arithmetic is exhausted — every
# candidate model cleared 16 dependent steps — so this tests a different
# operation: hold a candidate set, apply constraints that each rule some out,
# and find the one survivor. That is what troubleshooting actually is, and it is
# the formal shape of a large share of real traffic (run `ollama-evals coverage`
# for the current split; the figures are deliberately not committed).
#
# No arithmetic anywhere. A model cannot chain its way to the answer; it has to
# eliminate.
#
# Every level's answer is verified UNIQUE by brute force before use — see the
# verifier note in the README. That discipline exists because the previous
# ladder shipped with an ambiguity that produced two false verdicts.
#
# The answer differs at every rung (bravo / echo / golf) so a model cannot ride
# one guess up the ladder.
num_ctx: 16384
vars:
  expected: bravo
sweep:
  ordered: true
  levels:
    - label: "3-services"
      vars: {expected: bravo}
    - label: "5-services"
      vars: {expected: echo}
      context: |
        Five services could be emitting the malformed payloads: alpha, bravo,
        charlie, delta, echo.

        Established facts:
          1. The service emitting them was deployed before 13:00.
          2. alpha and bravo were both deployed after 13:00.
          3. The service emitting them writes to the orders queue.
          4. charlie does not write to the orders queue.
          5. delta was rolled back at 12:40 and was not running afterwards.
      prompt: |
        Which service is emitting the malformed payloads?

        Reply with only: ANSWER: <service name>
    - label: "7-services"
      vars: {expected: golf}
      context: |
        Seven services could be emitting the malformed payloads: alpha, bravo,
        charlie, delta, echo, foxtrot, golf.

        Established facts:
          1. The service emitting them was deployed before 13:00.
          2. alpha and bravo were both deployed after 13:00.
          3. The service emitting them writes to the orders queue.
          4. charlie and foxtrot do not write to the orders queue.
          5. delta was rolled back at 12:40 and was not running afterwards.
          6. The service emitting them runs in region eu-west-1.
          7. echo runs only in region us-east-1.
      prompt: |
        Which service is emitting the malformed payloads?

        Reply with only: ANSWER: <service name>
context: |
  Three services could be emitting the malformed payloads: alpha, bravo,
  charlie.

  Established facts:
    1. The service emitting them was deployed before 13:00.
    2. alpha was deployed after 13:00.
    3. The service emitting them writes to the orders queue.
    4. charlie does not write to the orders queue.
prompt: |
  Which service is emitting the malformed payloads?

  Reply with only: ANSWER: <service name>
check: |
  import re
  m = re.search(r'ANSWER:\s*\**\s*([a-z]+)', response, re.I)
  if not m:
      # lenient fallback: correctness is the property, shape is not
      words = re.findall(r'\b(alpha|bravo|charlie|delta|echo|foxtrot|golf)\b',
                         response, re.I)
      assert words, f"named no service: {' '.join(response.split())[:120]!r}"
      got = words[-1].lower()
  else:
      got = m.group(1).lower()
  assert got == expected, f"answered {got}, correct is {expected}"
