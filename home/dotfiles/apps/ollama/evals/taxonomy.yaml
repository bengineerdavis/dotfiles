# apps/ollama/evals/taxonomy.yaml
#
# A CLOSED, hand-authored list of the task types this stack is used for, and
# which eval cases (if any) cover each one. `ollama-evals coverage` classifies
# the local `llm` log against it and reports COUNTS ONLY.
#
# ── Why closed, and why hand-authored ────────────────────────────────────────
# This list is the entire vocabulary of the coverage signal. That is a privacy
# property, not a style choice. Steering a synthesised eval set using rich
# statistics derived from a private corpus is Private Evolution without the
# differential-privacy accounting: the loop converges on the real data, and the
# synthetic set becomes a lossy reconstruction of customer material — which then
# gets committed to git, breaking the very provenance rule the synthesised cases
# exist to satisfy.
#
# A closed vocabulary cannot carry new content. It can only report weights over
# categories a human already wrote down. So: never derive categories from the
# corpus, never emit centroids or exemplars, never widen this file because a
# clustering suggested it. Widen it because YOU decided a task type exists.
#
# `description` is what the prompt is compared against, so write it as the kind
# of request a person would actually make, not as a label.
#
# `cases` names the eval cases that cover the category — empty means "no test
# exists for work I actually do", which is the finding this file is built to
# surface. Mapping is declared by hand; a fuzzy auto-match would invent
# coverage that isn't there.

taxonomy:
  - name: coding-write
    description: |
      Write a new function, script, or module from a specification. Produce
      working code that did not exist before.
    cases: [code-instruction-adherence]

  - name: coding-debug
    description: |
      Diagnose why existing code fails. Read a stack trace, an error message or
      a failing test and identify the cause.
    cases: [code-debug]

  - name: coding-review
    description: |
      Explain or review code that already exists. Say what it does, what it
      misses, or whether a change is safe.
    cases: [code-faithfulness]

  - name: support-troubleshoot
    description: |
      Work out what is wrong in a running system from a customer report or an
      operational symptom, and decide what to check next.
    cases: [support-faithfulness, support-correctness, support-instruction-adherence,
            support-elimination, support-contradiction, support-determinable]

  - name: research-synthesis
    description: |
      Gather and reconcile information across several sources, weigh conflicting
      claims, and produce a summary with the disagreements named.
    cases: [research-faithfulness]

  - name: thought-experiment
    description: |
      Reason through an open-ended hypothetical or design question where no
      lookup answer exists and the argument matters more than the conclusion.
    cases: [think-correctness, think-faithfulness, think-counterfactual,
            think-state]

  - name: doc-summarise
    description: |
      Read a long document and answer questions grounded strictly in it, or
      condense it without adding anything not present.
    cases: [chat-faithfulness, long-faithfulness]

  - name: data-extract
    description: |
      Pull structured fields out of unstructured text, or classify text into
      fixed categories, returning a machine-readable shape.
    cases: [chat-instruction-adherence, long-instruction-adherence,
            extract-correctness, extract-faithfulness]

  - name: ops-shell
    description: |
      Produce or correct a shell command, a config file, or infrastructure
      definitions. Command-line and systems administration work.
    cases: [ops-correctness]

  - name: vision-describe
    description: |
      Answer a question about the contents of an image, screenshot or diagram.
    cases: [vision-faithfulness, vision-instruction-adherence, vision-topology]
