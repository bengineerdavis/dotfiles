# apps/agentsview/tasks/main.yaml — role lifecycle router
#
# Topic lifecycle router. Imports lifecycle subtask files with appropriate
# tags; the parent playbook (or a standalone topic playbook) drives which
# phase runs via --tags. Mirrors apps/roborev's router verbatim in shape.
#
# All five lifecycle files MUST exist in every topic. App-tier topics
# typically leave bootstrap, prerequisites, and upgrade as thin or empty —
# see each file's header for what agentsview chose and why.

- name: "Import bootstrap tasks"
  ansible.builtin.import_tasks: bootstrap.yaml
  tags: [bootstrap, provision]

- name: "Import prerequisites tasks"
  ansible.builtin.import_tasks: prerequisites.yaml
  tags: [prerequisites, provision]

- name: "Import upgrade tasks"
  ansible.builtin.import_tasks: upgrade.yaml
  tags: [upgrade, provision]

- name: "Import install tasks"
  ansible.builtin.import_tasks: install.yaml
  tags: [install, provision]

- name: "Import remove tasks"
  ansible.builtin.import_tasks: remove.yaml
  # `never` makes remove opt-in: skipped by bare runs and --tags
  # install/provision, runs only with an explicit --tags remove.
  tags: [remove, never]