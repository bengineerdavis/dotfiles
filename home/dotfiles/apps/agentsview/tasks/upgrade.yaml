# apps/agentsview/tasks/upgrade.yaml
#
# Empty on purpose — the currency guarantee lives in install.yaml, which
# carries the upgrade tag on every task (the apps/ori pattern):
#
#   Darwin — apps/homebrew's upgrade pass runs `brew upgrade`, which reaches
#            this cask; nothing for the topic to do.
#   Debian — `apt upgrade` cannot reach a GitHub-release tarball or
#            AppImage, so install.yaml resolves the latest release and
#            reinstalls only when the installed-tag stamp differs.
#            Upstream's `agentsview update` self-updater is deliberately
#            not used: it would replace topic-managed files outside
#            Ansible's knowledge and make the next run's version comparison
#            lie — the same reasoning apps/roborev records for its binary.