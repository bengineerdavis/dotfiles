# apps/firefox/tasks/install.yaml
# Package installation tasks. Be explicit about which package manager is used.
# Use when: conditions to guard each block by OS/arch.
# Do NOT put upgrade logic here — upgrades are owned by system roles (homebrew, apt).
# Do NOT put config/symlink tasks here — those are owned by chezmoi.
#
# This stub carries no manager blocks on purpose. `topical new` emits exactly
# the blocks the topic's managers need, reading dotfiles/managers.yaml — which
# is also the catalog for anyone writing a topic by hand: module names,
# become, OS coverage and the per-manager traps live there, not here.

# ──────────────────────────────────────────────────────────────────────────────
# homebrew_cask
# ──────────────────────────────────────────────────────────────────────────────

- name: "Install firefox via Homebrew Cask (macOS)"
  community.general.homebrew_cask:
    name: firefox
    state: present
    install_options: "appdir={{ user_appdir }}"
  when: ansible_facts['os_family'] == 'Darwin'
