# apps/gita/defaults/main.yaml

# Where the repo catalogue lives. Role-relative, like config/editors.yaml:
# role_path is dotfiles/apps/gita, so ../../config/repos.yaml is
# dotfiles/config/repos.yaml. This is the same interim role-relative read the
# vscode/herdr topics use, to be replaced by topic_subscribes later.
gita_catalogue_path: "{{ role_path }}/../../config/repos.yaml"

# The code root the catalogue paths are relative to.
gita_code_root: "{{ ansible_facts['env']['HOME'] }}/code"

# ── layout capture: the observed ~/code shape, machine-local ─────────────────
#
# Written to the XDG state home on every install, beside machines.local.yaml.
# Holds which type trees exist, how they nest under personal/, and repo counts
# per directory — never repo names or remotes. This is the per-machine shape
# evidence redge-cli's catalogue work consumes later (SPEC.md R1/R2), and it
# never leaves the machine (spec.md § Data).
#
# Resolved from $HOME, not ansible_user_dir: the tests sandbox HOME to a tmp
# path, and user_dir ignores it, so a capture path keyed on user_dir let a
# pytest run write live state at ~/.local/state (measured 2026-11-17: the
# sandbox's tree.yaml overwrote the real capture). $HOME follows the sandbox.
gita_layout_capture_path: "{{ ansible_facts['env']['HOME'] }}/.local/state/layout/tree.yaml"

# Directories never counted in the capture's repo counts — vendored trees,
# caches, anything that is not a clone.
gita_layout_capture_ignored_dirs: [".venv", "node_modules", "__pycache__"]

# The type-directory skeleton this topic provisions (docs/LAYOUT.md phase 3):
# all three type trees plus the four named subdirs that live inside personal/
# — never top-level siblings (LAYOUT.md § Structure). Empty types are cheap;
# a fresh machine gets the full skeleton from one run, so registrations never
# point into a vanished location (DOT-366).
gita_layout_skeleton:
  - personal
  - personal/templates
  - personal/try
  - personal/captures
  - personal/interviews
  - forks
  - work

# Teardown of the registration is opt-in. `gita clear` removes EVERY repo and
# group gita knows about, including any added by hand — so a plain
# --tags remove keeps the index and only the flag below wipes it.
gita_remove_registration: false
# ── work: reconciled recursively, never catalogued ───────────────────────────
#
# Work repos are deliberately absent from the committed catalogue (spec.md §
# Data: employer-identifying strings stay machine-local). The topic still
# owns their registration: on every install it reconciles the whole work root
# into ONE machine-local group — registers what appeared (recursively,
# vendored junk skipped), and sweeps every work-root registration into the
# group. Gita filters missing paths from its own reads; its CLI cannot prune
# them. No repo name is ever
# committed; they exist only in gita's own CSVs and the machine-local layout
# overlay.

# The work tree root, walked recursively on install. Machines without one
# (fresh, personal-only) skip the whole reconciliation.
gita_work_root: "{{ ansible_facts['env']['HOME'] }}/code/work"

# Match gita's config directory precedence (gita/common.py get_config_dir).
gita_config_dir: >-
  {{ (ansible_facts['env']['GITA_PROJECT_HOME'] | default('')
      or ansible_facts['env']['XDG_CONFIG_HOME'] | default('')
      or ansible_facts['env']['HOME'] ~ '/.config') ~ '/gita' }}

# The single group every work-root registration lands in. Generic on
# purpose — the name travels in this committed file.
gita_work_group: work
