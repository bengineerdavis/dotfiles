# apps/gita/tasks/install.yaml
#
# Stopgap scope: claim the mise entry so the binary is installed, then register
# the repos already on disk so `gita fetch` / `gita pull` work today.
#
# Mise entry ownership follows the herdr pattern (TOPIC-RECIPES): this topic
# claims `pipx:gita` through mise's first-party `mise use -g` and removes it
# through `mise unuse --global` in remove.yaml. Both commands write through
# the deployed symlink into the tracked apps/mise/files/config.toml, so a run
# that changes the entry leaves the repo dirty by design and the change is
# committed as the capture — this topic never writes that file directly.
#
# The registration reads the committed catalogue (config/repos.yaml) for
# repo -> group and writes gita's own repos.csv/groups.csv. Deliberately does
# NOT move repos into the docs/LAYOUT.md type dirs — that is the migration, a
# separate step. Every piece of state created here has a matching teardown in
# remove.yaml (CRUD ownership invariant, docs/TOPICS.md).

- name: "Install: probe whether the global mise config declares pipx:gita"
  ansible.builtin.command:
    cmd: grep -q -e pipx:gita {{ ansible_facts['env']['HOME'] }}/.config/mise/config.toml
  register: gita_mise_entry_probe
  changed_when: false
  failed_when: false

- name: "Install: claim the pipx:gita entry through mise (first-party command; commit the captured change after the run)"
  ansible.builtin.command:
    cmd: mise use -g pipx:gita
  register: gita_mise_use
  when: gita_mise_entry_probe.rc != 0
  changed_when: true

- name: "Install: probe gita on PATH"
  ansible.builtin.shell:
    cmd: command -v gita >/dev/null 2>&1
  register: gita_probe
  changed_when: false
  failed_when: false
  # Read-only probe; must run under --check too, or the fail condition below
  # reads an undefined rc and fails a check-mode run for the wrong reason.
  check_mode: false

- name: "Install: fail with the fix if gita is absent"
  ansible.builtin.fail:
    msg: >-
      gita not found on PATH after the mise entry ran. Fix: run `mise install`,
      then re-run this topic.
  when: gita_probe.rc != 0

- name: "Install: load the repo catalogue"
  ansible.builtin.include_vars:
    file: "{{ gita_catalogue_path }}"
    name: gita_catalogue

- name: "Install: the catalogue must exist before anything is registered"
  ansible.builtin.fail:
    msg: >-
      Repo catalogue missing at {{ gita_catalogue_path }}. Fix: restore
      dotfiles/config/repos.yaml.
  when: gita_catalogue.repos is not defined

- name: "Install: check which catalogue repos are on disk"
  ansible.builtin.stat:
    path: "{{ gita_code_root }}/{{ item.path }}/.git"
  loop: "{{ gita_catalogue.repos }}"
  loop_control:
    label: "{{ item.group }}/{{ item.path }}"
  register: gita_repo_stats

- name: "Install: register the repos that exist (gita writes repos.csv)"
  ansible.builtin.command:
    cmd: gita add "{{ gita_code_root }}/{{ item.item.path }}" -g "{{ item.item.group }}"
  loop: "{{ gita_repo_stats.results }}"
  loop_control:
    label: "{{ item.item.group }}/{{ item.item.path }}"
  when: item.stat.exists
  # gita add is not idempotent (re-adding a known repo warns but is harmless),
  # and registration is gita's own state, so this never aborts the run.
  changed_when: false
  failed_when: false

- name: "Install: report repos declared but not on disk"
  ansible.builtin.debug:
    msg: "declared but not cloned, skipped: {{ item.item.group }}/{{ item.item.path }}"
  loop: "{{ gita_repo_stats.results }}"
  loop_control:
    label: "{{ item.item.path }}"
  when: not item.stat.exists
  changed_when: false
# ── work: reconcile the work tree into one machine-local group ────────────────
#
# Work repos never enter the committed catalogue (spec.md § Data: employer
# strings stay machine-local), so their registration is discovery-driven
# instead. Every install reconciles gita against the disk under the work
# root: repos that appeared are registered by the recursive walk, and every
# work-tree registration is swept into the single group. No repo name is ever
# committed — gita's own CSVs, written by first-party commands, are the only
# state.
#
# The walk (gita add -r) globs `**/` which does not match dot-directories, so
# vendored trees inside .venv/node_modules are never registered. Worktree and
# submodule style `.git` files ARE registered — same as the catalogue path
# above registers personal worktrees. Read the registration CSV instead of
# freeze: freeze omits local-only repos, respects context, and filters missing
# paths. Gita filters those ghosts from its repository operations, but cannot
# remove them through gita rm, so no unsupported manual pruning is attempted.

- name: "Install: probe whether a work tree exists on this machine"
  ansible.builtin.stat:
    path: "{{ gita_work_root }}"
  register: gita_work_root_probe
  changed_when: false

- name: "Install: report the skipped work reconciliation on personal machines"
  ansible.builtin.debug:
    msg: >-
      No work tree at {{ gita_work_root }} — work reconciliation is skipped;
      the group and its registrations exist only where a work tree does.
  when: not gita_work_root_probe.stat.exists
  changed_when: false

- name: "Install: register repos that appeared under the work root (recursive walk, new finds land in the group)"
  ansible.builtin.command:
    cmd: gita add -r -g {{ gita_work_group }} {{ gita_work_root }}
  when: gita_work_root_probe.stat.exists
  # Re-adds of known repos warn harmlessly; discovery is gita's own state.
  changed_when: false
  failed_when: false

- name: "Install: read every registration, including local-only repos and ghosts"
  ansible.builtin.slurp:
    src: "{{ ansible_facts['env']['HOME'] }}/.config/gita/repos.csv"
  register: gita_registration_file
  when: gita_work_root_probe.stat.exists
  failed_when: false
  # Read-only, and required under --check so the set_fact below has its source.
  check_mode: false

- name: "Install: collect every work-tree registration, regardless of context"
  ansible.builtin.set_fact:
    gita_work_names: >-
      {%- set out = [] -%}
      {%- for line in (gita_registration_file.content | default('', true) | b64decode).splitlines() -%}
      {%-   set fields = line.split(',') -%}
      {%-   if fields | length >= 2 and fields[0].startswith(gita_work_root ~ '/') -%}
      {%-     set _ = out.append(fields[1]) -%}
      {%-   endif -%}
      {%- endfor -%}
      {{ out }}
  when: gita_work_root_probe.stat.exists

- name: "Install: sweep every work-tree registration into the single work group"
  ansible.builtin.command:
    argv:
      - gita
      - group
      - add
      - -n
      - "{{ gita_work_group }}"
      - "{{ item }}"
  loop: "{{ gita_work_names }}"
  when: gita_work_root_probe.stat.exists and gita_work_names | length > 0
  # group add is a set-union: already-grouped members are a no-op, and the
  # pre-registered repos the walk skips still land in the group here. A loop
  # preserves each repository name as one argv entry, including spaces.
  changed_when: false
  failed_when: false
