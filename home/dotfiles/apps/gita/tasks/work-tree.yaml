# ── work: reconcile the work tree into one machine-local group ────────────────
#
# Work repos never enter the committed catalogue (spec.md § Data: employer
# strings stay machine-local), so their registration is discovery-driven
# instead. Every install reconciles gita against the disk under the work root:
# repos that appeared are registered by a recursive walk, and every work-tree
# registration is swept into the single group. No repo name is ever committed
# — gita's own CSVs, written by first-party commands, are the only state.
#
# There is deliberately NO prune step. It cannot work: `gita freeze` filters
# vanished repos out of its own output, so the registration list it prints
# never contains a ghost to prune, and `gita rm` refuses names `ls` does not
# know ("invalid choice") because ls is filtered the same way. A ghost row
# left in repos.csv is harmless — gita re-adopts it if the repo returns at
# the same path. Cleaning repos.csv directly would mean editing gita's own
# state file, which its README forbids.
#
# The walk (gita add -r) globs `**/` which does not match dot-directories, so
# vendored trees inside .venv/node_modules are never registered. Worktree and
# submodule style `.git` files ARE registered — same as the catalogue path
# above registers personal worktrees.

- name: "Install: probe whether a work tree exists on this machine"
  ansible.builtin.stat:
    path: "{{ gita_work_root }}"
  register: gita_work_root_probe
  changed_when: false

- name: "Install: report the skipped work reconciliation on personal machines"
  ansible.builtin.debug:
    msg: >-
      No work tree at {{ gita_work_root }} — work reconciliation is skipped;
      the group and its registrations exist only where a work tree does.
  when: not gita_work_root_probe.stat.exists
  changed_when: false

- name: "Install: register repos that appeared under the work root (recursive walk)"
  ansible.builtin.command:
    cmd: gita add -r -g {{ gita_work_group }} {{ gita_work_root }}
  when: gita_work_root_probe.stat.exists
  # Re-adds of known repos warn harmlessly ("No new repos found!"); discovery
  # is gita's own state converging on disk truth, not a change this task owns.
  changed_when: false
  failed_when: false

- name: "Install: read gita's registrations (freeze is the first-party read)"
  ansible.builtin.command:
    cmd: gita freeze
  register: gita_freeze
  when: gita_work_root_probe.stat.exists
  changed_when: false

- name: "Install: collect the work-tree registration names"
  ansible.builtin.set_fact:
    gita_work_names: >-
      {%- set out = [] -%}
      {%- for line in gita_freeze.stdout_lines -%}
      {%-   set fields = line.split(',') -%}
      {%-   if fields | length >= 3 and fields[2].startswith(gita_work_root ~ '/') -%}
      {%-     set _ = out.append(fields[1]) -%}
      {%-   endif -%}
      {%- endfor -%}
      {{ out }}
  when: gita_work_root_probe.stat.exists

- name: "Install: sweep every work-tree registration into the single work group"
  ansible.builtin.command:
    cmd: gita group add -n {{ gita_work_group }} {{ gita_work_names | join(' ') }}
  when: gita_work_root_probe.stat.exists and gita_work_names | default([]) | length > 0
  # group add is a set-union: already-grouped members are a no-op, and the
  # pre-registered repos the walk skips (it reports "No new repos found!")
  # still land in the group here — this step is what makes the group complete.
  changed_when: false
  failed_when: false
