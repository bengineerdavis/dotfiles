---
# Verify externally observable behavior before side_effect removes the topic.
- name: Verify LoreAI in the Debian guest
  hosts: all
  gather_facts: true
  become: false
  tasks:
    - name: Assert a real Debian QEMU guest
      ansible.builtin.assert:
        that:
          - ansible_facts.distribution == "Debian"
          - ansible_facts.distribution_major_version == "12"
          - ansible_facts.service_mgr == "systemd"

    - name: Check the owned user service is running
      ansible.builtin.command:
        argv: [systemctl, --user, is-active, lore-gateway]
      changed_when: false

    - name: Check the owned user service is enabled
      ansible.builtin.command:
        argv: [systemctl, --user, is-enabled, lore-gateway]
      changed_when: false

    - name: Read the local gateway UI without using an LLM
      ansible.builtin.uri:
        url: http://127.0.0.1:3207/ui
        method: GET
        return_content: true
        status_code: 200
        timeout: 10
      register: loreai_gateway_ui

    - name: Assert the local HTTP response contains the Lore dashboard
      ansible.builtin.assert:
        that:
          - "'Lore' in loreai_gateway_ui.content"
          - loreai_gateway_ui.cookies == {}

    - name: Plant data that topic removal must preserve
      ansible.builtin.copy:
        content: "LoreAI scenario data must survive topic removal.\n"
        dest: "{{ ansible_env.HOME }}/.local/share/lore/molecule-test-preserved"
        mode: "0600"

    - name: Assert the rendered opencode config carries the X-Lore-Provider header
      # The header (DOT-242.1 / PR #134) is chezmoi-rendered in lore-plugin.jsonc
      # and must land under provider.openrouter.options.headers in the deployed
      # opencode.jsonc. The deployed file is JSONC, and the guest has no opencode
      # binary to run `debug config`, so strip // line comments before parsing —
      # then assert the exact nested path, not a bare substring (which would
      # false-positive on a comment or a stray key).
      ansible.builtin.shell:
        cmd: >-
          python3 -c 'import json,sys,re; s=open(sys.argv[1]).read();
          s=re.sub(r"^\s*//.*$","",s,flags=re.M); c=json.loads(s);
          print(c["provider"]["openrouter"]["options"]["headers"]["X-Lore-Provider"])'
          "{{ ansible_env.HOME }}/.config/opencode/opencode.jsonc"
        executable: /bin/bash
      register: loreai_header
      changed_when: false
      failed_when: loreai_header.stdout.strip() != "openrouter"
