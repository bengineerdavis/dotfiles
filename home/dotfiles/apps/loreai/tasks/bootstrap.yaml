# apps/loreai/tasks/bootstrap.yaml
# First-time setup of a system tool on a fresh machine. Confirmed, never silent.
#
# Only pkg-manager-tier topics typically need real content here. App-tier and
# runtime-manager topics leave this empty — they assume their dependencies have
# already been bootstrapped (the parent playbook's sanity check enforces this).
#
# Idempotent: safe to re-run.
# Do NOT put install, upgrade, or remove logic here.

