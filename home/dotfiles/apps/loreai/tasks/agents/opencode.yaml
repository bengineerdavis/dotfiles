# apps/loreai/tasks/agents/opencode.yaml — extension: opencode
#
# NOT a `lore setup opencode` run. chezmoi owns opencode.jsonc on this fleet
# (dot_config/opencode/), and when both opencode.json and .jsonc exist the
# .jsonc wins (measured 2026-09-12, recorded in that file's header) — setup's
# writes would be shadowed or reverted. The integration is instead the
# plugin fragment the chezmoi template includes from this topic
# (files/opencode/lore-plugin.jsonc).
#
# Registration in the deployed config is only the first of three states:
# registered, installed, loading. Measured 2026-10-27 (opencode 2.0.32 and
# 2.1.4): the shared server's in-process auto-install of a listed plugin
# can fail for hours on a long-lived server with no local symptom beyond a
# WARN in ~/.local/share/opencode/log/opencode.log (NpmInstallFailedError,
# then LockTimeoutError as retries collided) — a fresh `opencode plugin
# add @loreai/opencode` installed the same package immediately, and the
# wedged server needed `opencode service restart` to converge. And once
# installed, the v2 loader still rejected 0.40.0 ("Plugin must export a
# default definition with an id and an effect or setup function"): the
# package ships the pre-v2 function-shaped default export, so loading
# needs an upstream release (BYK/loreai), not a local change.
#
# Escalation (author ruling 2026-10-27: broken states raise, they do not
# whisper in a debug line): not-registered warns — render order (chezmoi
# apply vs this run) is not this topic's to enforce; registered-but-broken
# raises, classified by who can fix it. A wedged install stops the run:
# the fix is two local commands the operator should run now. A loader
# rejection is upstream, so it raises red without blocking unrelated
# topic work (`ignore_errors` keeps the recap at failed=0, ignored=1).
# chezmoi apply itself stays out of this: it owns the file, this topic
# owns the plugin's runtime state.

- name: "loreai: check the deployed opencode config for the lore plugin"
  ansible.builtin.command: >-
    grep -l "@loreai/opencode"
    {{ ansible_env.HOME }}/.config/opencode/opencode.jsonc
  register: loreai_opencode_plugin_check
  changed_when: false
  failed_when: false
  check_mode: false  # read-only grep; without it --check fabricates rc=0
                     # and reports the plugin registered unread

# `plugin list` rows come from the loaded module, not the config: a loaded
# local plugin lists id and version (git-ai), while an installed-but-
# unloadable npm plugin lists "- -" (measured 2026-10-27, @loreai/opencode
# 0.40.0 on opencode 2.1.4). Empty id ⇒ not installed or rejected at load.

- name: "loreai: check the opencode plugin's install and load state"
  ansible.builtin.command: opencode plugin list
  register: loreai_opencode_plugin_list
  changed_when: false
  failed_when: false
  check_mode: false

- name: "loreai: resolve the plugin row's load state"
  vars:
    loreai_plugin_row: >-
      {{ loreai_opencode_plugin_list.stdout_lines
         | select('search', '@loreai/opencode') | first | default('') }}
  ansible.builtin.set_fact:
    loreai_opencode_plugin_loaded: >-
      {{ (loreai_plugin_row.split() | length > 1)
         and (loreai_plugin_row.split()[0] != '-') }}
  check_mode: false

# The loader re-attempts on every session, so the newest failure line
# names the live cause — an old install-era line cannot masquerade as the
# current state while the plugin is installed-but-rejected. `shell`, not
# `command`: the tail needs a pipe.

- name: "loreai: pull the plugin's last server-log failure line"
  ansible.builtin.shell:
    cmd: >-
      grep -F "target=@loreai/opencode"
      {{ (ansible_env.HOME | quote) }}/.local/share/opencode/log/opencode.log
      | tail -n1
  register: loreai_opencode_plugin_log
  changed_when: false
  failed_when: false
  check_mode: false

- name: "loreai: classify the plugin's failure cause from the server log"
  vars:
    loreai_log_line: "{{ loreai_opencode_plugin_log.stdout | default('') }}"
  ansible.builtin.set_fact:
    loreai_opencode_plugin_cause: >-
      {{ 'loader' if 'PluginModule.LoadError' in loreai_log_line
         else 'install' if ('LockTimeoutError' in loreai_log_line
                            or 'NpmInstallFailedError' in loreai_log_line
                            or 'Package is not installed'
                               in loreai_log_line)
         else 'unknown' }}
  check_mode: false

# Locally fixable: the operator runs two commands and re-runs. Stopping
# the run is the point — a silent skip is how this stayed broken for a day.

- name: "loreai: fail the run when the registered plugin never installed"
  ansible.builtin.fail:
    msg: >-
      @loreai/opencode is registered in the deployed config but the shared
      server never completed its auto-install — sessions run without the
      gateway. Fix now, then re-run: `opencode plugin add @loreai/opencode`
      (a fresh process installs fine while the server is wedged), then
      `opencode service restart`. Server-log evidence:
      {{ loreai_opencode_plugin_log.stdout | default('(none)') }}
  when:
    - loreai_opencode_plugin_check.rc == 0
    - not loreai_opencode_plugin_loaded
    - loreai_opencode_plugin_cause == 'install'

# Upstream-shaped: nothing on this machine fixes it, so raise red without
# blocking the rest of the playbook — the recap's ignored=1 is the record.

- name: "loreai: raise the plugin's loader rejection (upstream fix)"
  ansible.builtin.fail:
    msg: >-
      @loreai/opencode is registered and installed but opencode's loader
      rejected it — the v2 loader requires a default export with an id and
      a setup/effect function, and pre-v2 releases (0.40.0) export a bare
      function. Fix is an upstream BYK/loreai release; nothing local to
      do. Server-log evidence:
      {{ loreai_opencode_plugin_log.stdout | default('(none)') }}
  when:
    - loreai_opencode_plugin_check.rc == 0
    - not loreai_opencode_plugin_loaded
    - loreai_opencode_plugin_cause in ['loader', 'unknown']
  ignore_errors: true

- name: "loreai: report opencode extension state"
  ansible.builtin.debug:
    msg: >-
      {% if loreai_opencode_plugin_check.rc != 0 %}
      opencode is installed, but @loreai/opencode is NOT in the deployed
      ~/.config/opencode/opencode.jsonc yet. The chezmoi template includes
      this topic's files/opencode/lore-plugin.jsonc behind a stat guard —
      run `chezmoi apply ~/.config/opencode` once the topic's commit is
      merged and deployed. Nothing on this machine is broken meanwhile;
      opencode just runs without the gateway until then.
      {% else %}
      opencode: @loreai/opencode is registered, installed, and loading —
      sessions route through the gateway.
      {% endif %}
  when: loreai_opencode_plugin_check.rc != 0 or loreai_opencode_plugin_loaded
