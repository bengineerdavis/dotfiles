# apps/loreai/tasks/agents/codex.yaml — extension: codex
# Included by agents.yaml only when codex was detected. lore setup is
# documented idempotent (re-running updates the fields it owns and preserves
# the rest); it is a converge operation, so changed_when stays false and the
# output is reported instead of parsed.

- name: "loreai: configure codex to route through the gateway"
  ansible.builtin.command: "{{ loreai_install_dir }}/lore setup codex"
  register: loreai_setup_codex
  changed_when: false

- name: "loreai: report the codex setup"
  ansible.builtin.debug:
    msg: >-
      lore setup codex: {{ loreai_setup_codex.stdout_lines | default([]) | join(' | ') }}
