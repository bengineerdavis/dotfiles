# apps/zim/tasks/remove.yaml
# Explicit uninstall tasks. Never run as part of provision or install.
# Only invoked via --tags remove.
# Mirror the install.yaml structure — one block per package manager.

# ── macOS (Homebrew) ──────────────────────────────────────────────────────────
- name: Remove Zim CLI via Homebrew (macOS)
  community.general.homebrew:
    name: zim
    state: absent
  when: ansible_facts['os_family'] == 'Darwin'

- name: Remove Zim dependencies via Homebrew (macOS)
  community.general.homebrew:
    name:
      - gtk-mac-integration
      - gtkspell3
      - python3
    state: absent
  when: ansible_facts['os_family'] == 'Darwin'

# TODO: verify placement
- name: Remove Zim.app wrapper (macOS)
  ansible.builtin.file:
    path: "{{ ansible_facts['user_dir'] }}/Applications/Zim.app"
    state: absent
  when: ansible_facts['os_family'] == 'Darwin'

# TODO: verify placement
- name: Remove Zim.zip download (macOS)
  ansible.builtin.file:
    path: "{{ ansible_facts['user_dir'] }}/Downloads/Zim.zip"
    state: absent
  when: ansible_facts['os_family'] == 'Darwin'
