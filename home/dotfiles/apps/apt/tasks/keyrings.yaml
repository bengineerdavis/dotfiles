# apps/apt/tasks/keyrings.yaml
# Keep the signing keyrings of already-configured third-party repos valid.
#
# Imported by prerequisites.yaml and upgrade.yaml, before either refreshes the
# cache: a missing or rotated key makes apt-get update exit 100, so repairing it
# afterwards is too late. That is how the previous home of this logic failed —
# deb-get's apt-auth.yaml ran in the app tier, after this topic's pkg-manager
# tier update had already died on the keys it would have fixed.
#
# The work is in files/apt_keyring.py, run in place from the role (nothing is
# installed, so there is nothing to tear down). It reads the destination from
# the source's signed-by=, dearmors, and validates with gpg before writing; the
# old get_url task wrote whatever came back and reported success.
#
# /usr/bin/python3 explicitly: under become, a mise or venv python on PATH is
# not guaranteed to exist for root.
#
# The helper needs gpg. On a fresh box it may not be installed yet, and
# installing it needs the very cache refresh a bad key breaks — so without gpg
# this step defers (apt_keyrings_deferred) and prerequisites.yaml re-imports it
# after the core packages, gnupg among them, are in.

- name: "Keyrings: check gpg is available"
  ansible.builtin.stat:
    # Debian's layout by default; apt_gpg_path exists so the task-level tests
    # can point the check at a stub and pin the repair path on machines
    # (macOS) whose gpg does not live at /usr/bin/gpg.
    path: "{{ apt_gpg_path | default('/usr/bin/gpg') }}"
  register: apt_keyrings_gpg

- name: "Keyrings: defer until gnupg is installed"
  ansible.builtin.set_fact:
    apt_keyrings_deferred: "{{ not apt_keyrings_gpg.stat.exists }}"

- name: "Keyrings: repair signing keyring"
  ansible.builtin.command:
    argv: >-
      {{
        ['/usr/bin/python3', role_path ~ '/files/apt_keyring.py',
         '--name', item.name, '--repo-host', item.repo_host, '--url', item.url,
         '--timeout', apt_keyring_timeout | string]
        + (item.require_keys | default([]) | map('regex_replace', '^', '--require-key=') | list)
        + (['--check'] if ansible_check_mode else [])
      }}
  loop: "{{ apt_keyrings }}"
  loop_control:
    label: "{{ item.name }}"
  register: apt_keyring_results
  # Inside a loop, changed_when sees the current item's result as the
  # registered name. The helper prints one JSON object; its "changed" wins.
  changed_when: (apt_keyring_results.stdout | from_json).changed
  check_mode: false
  when: not apt_keyrings_deferred
  become: true

- name: "Keyrings: report"
  ansible.builtin.debug:
    msg: >-
      {{ r.name }}: {{ r.status }}
      {%- if r.dest is defined %} -> {{ r.dest }}{% endif %}
      {%- if r.changed and r.before is defined %} (was {{ r.before }}){% endif %}
      {%- if r.detail is defined %} — {{ r.detail }}{% endif %}
  loop: "{{ apt_keyring_results.results }}"
  loop_control:
    label: "{{ item.item.name }}"
  when: not apt_keyrings_deferred
  vars:
    r: "{{ item.stdout | from_json }}"
