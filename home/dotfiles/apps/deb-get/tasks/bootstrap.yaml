# apps/deb-get/tasks/bootstrap.yaml
# First-time setup of deb-get on a Debian-family system.
# Confirmed, never silent, and fails loudly if GitHub auth is missing.

- name: "Bootstrap: check deb-get binary exists"
  ansible.builtin.stat:
    path: "{{ debget_bin }}"
  register: debget_bootstrap_stat

- name: "Bootstrap: deb-get already present"
  ansible.builtin.debug:
    msg: "✅ deb-get found at {{ debget_bin }} — no bootstrap needed."
  when: debget_bootstrap_stat.stat.exists

- name: "Bootstrap: require DEBGET_TOKEN before installing"
  ansible.builtin.fail:
    msg: |
      deb-get requires a GitHub Personal Access Token (PAT) in DEBGET_TOKEN.

      To fix:
        1. Create a GitHub PAT at https://github.com/settings/tokens
           (no scopes are required; public repo read is enough).
        2. Make it available to Ansible. Options, in order of preference:
             - Bitwarden (default): ensure `bw` is installed and unlocked,
               and add `export BW_SESSION=...` to ~/.localrc.
             - 1Password (work): pass -e debget_secrets_manager=1password and
               ensure `op` is signed in or OP_SERVICE_ACCOUNT_TOKEN is set.
             - ~/.localrc: add `export DEBGET_TOKEN=ghp_xxxxxxxxxxxxxxxxxxxx`.
             - Environment: export DEBGET_TOKEN=ghp_xxxxxxxxxxxxxxxxxxxx.
             - Override: re-run with -e debget_token=ghp_xxxxxxxxxxxxxxxxxxxx.
        3. Re-run this topic.

      The topic deliberately does not write the token to disk itself.
  when:
    - not debget_bootstrap_stat.stat.exists
    - debget_token | default('') | length == 0

- name: "Bootstrap: confirm deb-get installation"
  ansible.builtin.pause:
    prompt: |
      deb-get not found at {{ debget_bin }}.
      Install it from the official GitHub repository now? [y/N]
  register: debget_bootstrap_confirm
  when:
    - not debget_bootstrap_stat.stat.exists
    - not ansible_check_mode

- name: "Bootstrap: abort if installation declined"
  ansible.builtin.fail:
    msg: "deb-get installation declined. Cannot continue without it."
  when:
    - not debget_bootstrap_stat.stat.exists
    - not ansible_check_mode
    - debget_bootstrap_confirm.user_input | default('n') | lower != 'y'

- name: "Bootstrap: install deb-get via official installer"
  ansible.builtin.shell:
    cmd: |
      set -o pipefail
      curl -fsSL https://raw.githubusercontent.com/wimpysworld/deb-get/main/deb-get \
        | sudo -E bash -s install deb-get
      # Make sure the newly installed binary is on PATH for this play.
      hash -r
    executable: /bin/bash
  environment:
    DEBGET_TOKEN: "{{ debget_token | default('') }}"
  when:
    - not debget_bootstrap_stat.stat.exists
    - not ansible_check_mode
    - debget_bootstrap_confirm.user_input | default('n') | lower == 'y'

- name: "Bootstrap: verify deb-get installed successfully"
  ansible.builtin.stat:
    path: "{{ debget_bin }}"
  register: debget_post_install_stat
  when:
    - not debget_bootstrap_stat.stat.exists
    - not ansible_check_mode

- name: "Bootstrap: fail if deb-get still missing after install"
  ansible.builtin.fail:
    msg: "deb-get install script ran but {{ debget_bin }} still not found. Manual intervention required."
  when:
    - not debget_bootstrap_stat.stat.exists
    - not ansible_check_mode
    - not debget_post_install_stat.stat.exists
