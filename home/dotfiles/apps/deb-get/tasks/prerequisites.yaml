# apps/deb-get/tasks/prerequisites.yaml
# Core dependencies required before deb-get can install or upgrade.
#
# The official deb-get install script shells out to curl, jq, lsb-release and
# wget, and many deb-get package definitions also need them. Install them via
# apt before deb-get itself is touched.

- name: "Prerequisites: ensure deb-get helper packages are installed"
  ansible.builtin.apt:
    name: "{{ debget_prerequisite_packages }}"
    state: present
    update_cache: true
  become: true
