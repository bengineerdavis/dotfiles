---
# apps/deb-get/tests/topic-metadata.yaml
#
# Read-only test that topic.yml parses and satisfies the topic system contract
# documented in docs/TOPICS.md.
#
# Run: ansible-playbook apps/deb-get/tests/topic-metadata.yaml
# Safe: loads a YAML file and asserts on its contents.

- name: "Test deb-get topic metadata"
  hosts: localhost
  connection: local
  gather_facts: false
  become: false

  vars:
    debget_topic_file: "{{ playbook_dir }}/../topic.yml"

  tasks:
    - name: "Load topic.yml"
      ansible.builtin.slurp:
        src: "{{ debget_topic_file }}"
      register: debget_topic_raw

    - name: "Parse topic.yml"
      ansible.builtin.set_fact:
        debget_topic: "{{ debget_topic_raw.content | b64decode | from_yaml }}"

    - name: "Assert required keys are present and valid"
      ansible.builtin.assert:
        that:
          - debget_topic.topic_name == 'deb-get'
          - debget_topic.topic_tier == 'app'
          - "'Debian' in debget_topic.topic_os"
          - "'deb-get' in debget_topic.topic_provides"
          - "'apt' in debget_topic.topic_requires"
        success_msg: "PASS: deb-get topic metadata is valid"
        fail_msg: |
          FAIL: topic metadata invalid:
          {{ debget_topic | to_nice_json }}
