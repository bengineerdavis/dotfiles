# apps/claude-code/playbook.yaml
# Standalone runner for this topic role.
# Usage: ansible-playbook apps/claude-code/playbook.yaml [--tags install|provision|remove]
#   A bare run (no --tags) runs provision; remove is opt-in via --tags remove (tagged never).
#
# Assumes package managers are already bootstrapped.
# For a fresh machine use the parent playbook with --tags provision instead.

- name: "Run claude-code role standalone"
  hosts: localhost
  connection: local
  gather_facts: true
  become: false

  # Same vars block every cask-installing topic playbook carries, so the role
  # works standalone as well as under the parent playbook (which defines these
  # itself). Play vars outrank role defaults, so the parent still wins there.
  vars:
    homebrew_prefix: "{{ '/opt/homebrew' if ansible_facts['architecture'] == 'arm64' else '/usr/local' }}"
    user_appdir: "{{ ansible_facts['env']['HOME'] }}/Applications"

  roles:
    - role: apps/claude-code
