# apps/claude-code/tasks/upgrade.yaml
# Topic-level upgrade tasks. Refresh state this topic owns.
#
# Empty on purpose. Both artifacts are Homebrew casks, so the homebrew system
# role's cask upgrade pass refreshes them — see docs/TOPICS.md
# § "Presence vs currency". Applying that section's test to this topic: brew
# WILL move the CLI to the latest version of its channel, so the topic needs no
# upgrade path of its own. That is the opposite of apps/ori and apps/ollama,
# which install outside brew and therefore own theirs.
#
# Two things worth knowing rather than discovering:
#
# - The CLI does not update itself. Upstream: "Homebrew installations do not
#   auto-update." So skipping the upgrade pass means staying put, silently.
# - The desktop app does. Cask `claude` declares auto_updates, so Claude.app
#   keeps itself current between runs and brew's recorded version for it is
#   approximate. It is deliberately NOT added to homebrew_upgrade_cask_exclude:
#   that list exists for rancher's uninstall stanza shelling out to sudo, not
#   for self-updating apps in general.
#
# Idempotent: safe to re-run. No confirmation needed.
# Do NOT put install or remove logic here.
