# apps/visual-studio-code/tasks/remove.yaml
# Explicit uninstall tasks. Never run as part of provision or install.
# Only invoked via --tags remove.
#
# Extension teardown is gated (vscode_remove_extensions, default false) and
# runs BEFORE the cask: the code CLI dies with the cask, so the ordering is
# load-bearing. The gate preserves extension state by default — house
# pattern, cf. chrome_remove_browser.

- name: "Guard: the editors catalogue exists for teardown"
  ansible.builtin.stat:
    path: "{{ vscode_catalogue_path }}"
  register: vscode_remove_catalogue_stat

- name: "Fail with the fix when the gate is on but the catalogue is missing"
  ansible.builtin.fail:
    msg: >-
      vscode_remove_extensions is true but {{ vscode_catalogue_path }} was
      not found — the catalogue names what this topic may uninstall.
      Restore it, or turn the gate off. Nothing has been uninstalled.
  when:
    - vscode_remove_extensions | bool
    - not vscode_remove_catalogue_stat.stat.exists

- name: "Load the editors catalogue for teardown"
  ansible.builtin.include_vars:
    file: "{{ vscode_catalogue_path }}"
    name: vscode_remove_catalogue
  when: vscode_remove_extensions | bool

- name: "Resolve the claimed extension ids for teardown"
  ansible.builtin.set_fact:
    vscode_remove_ids: >-
      {{ ( vscode_remove_catalogue.editor_extensions | default([], true)
           | rejectattr('editors', 'defined')
           | map(attribute='id') | list
         + (vscode_remove_catalogue.editor_extensions | default([], true)
            | selectattr('editors', 'defined')
            | selectattr('editors', 'contains', 'visual-studio-code')
            | map(attribute='id') | list)
         + (vscode_extra_extensions | map(attribute='id') | list) )
         | reject('in', vscode_ignored_extensions) | list }}
  when: vscode_remove_extensions | bool

- name: "List installed extensions for teardown"
  ansible.builtin.command: code --list-extensions
  changed_when: false
  register: vscode_remove_installed_list
  when: vscode_remove_extensions | bool

- name: "Uninstall the claimed extensions (already-absent tolerated)"
  ansible.builtin.command: "code --uninstall-extension {{ item }}"
  loop: "{{ vscode_remove_ids
            | intersect(vscode_remove_installed_list.stdout_lines | default([], true)) }}"
  register: vscode_remove_results
  changed_when: true
  failed_when: false
  when: vscode_remove_extensions | bool

- name: "Report the teardown verdict per entry"
  ansible.builtin.debug:
    msg: "{{ item.item }}: {{ 'uninstalled' if item.rc == 0 else 'FAILED rc=' ~ item.rc }}"
  loop: "{{ vscode_remove_results.results | default([], true) | selectattr('rc', 'defined') | list }}"
  loop_control:
    label: "{{ item.item | default('-') }}"
  changed_when: false
  when: vscode_remove_extensions | bool

- name: "Fail once, naming every unresolved uninstall"
  ansible.builtin.fail:
    msg: >-
      {{ vscode_remove_results.results | default([], true)
         | selectattr('rc', 'defined') | selectattr('rc', 'ne', 0)
         | map(attribute='item') | length }} uninstall(s) failed and were
      NOT retried; the cask has not been removed yet. Fix the named ids or
      uninstall by hand, then re-run.
  when:
    - vscode_remove_extensions | bool
    - vscode_remove_results.results | default([], true)
      | selectattr('rc', 'defined') | selectattr('rc', 'ne', 0) | list | length > 0

# ── macOS (Homebrew Cask) ───────────────────────────────────────────────────
- name: "Remove visual-studio-code via Homebrew Cask (macOS)"
  community.general.homebrew_cask:
    name: visual-studio-code
    state: absent
  when: ansible_facts['os_family'] == 'Darwin'

# ── Linux (apt) ──────────────────────────────────────────────────────────────
- name: "Remove visual-studio-code via apt (Linux)"
  ansible.builtin.apt:
    name: code
    state: absent
  become: true
  when: ansible_facts['os_family'] == 'Debian'
