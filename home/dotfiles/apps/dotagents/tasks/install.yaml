# apps/dotagents/tasks/install.yaml
# The global agent-artifact declaration: initialise the manifest, approve the
# sources, sync them, and prove nothing else is installed.
#
# Config files are NOT here — chezmoi owns them, and dotagents owns
# `~/.agents/agents.toml` once it exists. This topic drives the CLI; it does
# not template the manager's state.
#
# Every piece of state created here has a matching teardown in remove.yaml,
# per the CRUD ownership invariant in docs/TOPICS.md.

# ── The pinned binary ────────────────────────────────────────────────────────
# `dotagents` is a mise tool (`npm:@sentry/dotagents` in
# apps/mise/files/config.toml). Calling the pinned binary rather than
# `npx @latest` keeps one version on the machine: the opencode topic used to
# run @latest, which is how a plugin feature arrived unannounced in 3.4.0 while
# mise still pinned 3.3.0.

# Both tasks carry `[dotagents_skills, upgrade]` because the upgrade path
# rebuilds every registered fact these tasks produce. A producer whose tags are
# a subset of its consumers' is the bug this guards against: the consumers ran
# under `--tags upgrade`, the producer did not, and Ansible failed the `when`
# with "'dotagents_manifest' is undefined" (measured 2026-11-08).
- name: "Check that the pinned dotagents binary is on PATH"
  ansible.builtin.command: dotagents --version
  environment:
    PATH: "{{ ansible_facts['env']['HOME'] }}/.local/share/mise/shims:{{ ansible_facts['env']['PATH'] }}"
  register: dotagents_version_check
  changed_when: false
  failed_when: false
  tags: [dotagents_skills, upgrade]

- name: "Fail with the fix when dotagents is absent"
  ansible.builtin.fail:
    msg: >-
      dotagents is not on PATH. It is a mise tool pinned in
      apps/mise/files/config.toml (`npm:@sentry/dotagents`); install it with
      `mise install` or re-run the mise topic, then retry. Nothing has been
      installed or moved.
  when: dotagents_version_check.rc != 0
  tags: [dotagents_skills, upgrade]

# ── Guard: the skills store must be migratable ───────────────────────────────
# dotagents relocates an agent's skills directory into ~/.agents/skills and
# aborts, on stderr, when a name already exists on both sides. Running this
# before the sync is the whole point; guarding after it guards nothing.

- name: "Guard against an agent skills directory dotagents cannot migrate"
  ansible.builtin.import_role:
    name: "roles/guards"
    tasks_from: dotagents-skills-migration.yaml
  vars:
    guard_caller: "apps/dotagents"
    guard_allow_skill_dir_conflicts: "{{ dotagents_allow_skill_dir_conflicts }}"
  tags: [dotagents_skills, upgrade]

# ── The manifest, only on a fresh machine ────────────────────────────────────
# `agents.toml` is dotagents' to write once it exists. First run only: a later
# `init --force` would delete the skills store (measured 2026-10-26 in a fake
# HOME: it removed every installed skill and every trust entry), so changing
# the agent list is a deliberate act, not something every install does.

- name: "Find the global agents manifest"
  ansible.builtin.stat:
    path: "{{ ansible_facts['env']['HOME'] }}/.agents/agents.toml"
  register: dotagents_manifest
  tags: [dotagents_skills, upgrade]

- name: "Initialise the global manifest with every supported agent"
  ansible.builtin.command:
    cmd: >-
      dotagents --user init --agents {{ dotagents_agents | join(',') }}
  environment:
    PATH: "{{ ansible_facts['env']['HOME'] }}/.local/share/mise/shims:{{ ansible_facts['env']['PATH'] }}"
  register: dotagents_init
  failed_when: false
  changed_when: dotagents_init.rc == 0
  when: not dotagents_manifest.stat.exists
  tags: [dotagents_skills, upgrade]

- name: "Fail with what dotagents init said"
  ansible.builtin.fail:
    msg: >-
      dotagents could not initialise {{ ansible_facts['env']['HOME'] }}/.agents.
      What it actually said:
      {{ dotagents_init.stderr | default('') | trim
         or dotagents_init.stdout | default('') | trim
         or 'nothing on stdout or stderr; re-run `dotagents --user init` by hand' }}
  when:
    - not dotagents_manifest.stat.exists
    - dotagents_init.rc | default(0) != 0
  tags: [dotagents_skills, upgrade]

- name: "Drop init's bootstrap skill"
  # `init` installs a `dotagents` skill from getsentry/dotagents (measured
  # 2026-10-26). That source is not in dotagents_sources, so leaving it would
  # fail the provenance guard on every fresh machine. The manager's own README
  # is not part of the declared set; remove it so the declared set is the whole
  # set. Reported as "not found" on a re-run, which is the desired end state.
  ansible.builtin.command:
    cmd: dotagents --user remove dotagents -y
  environment:
    PATH: "{{ ansible_facts['env']['HOME'] }}/.local/share/mise/shims:{{ ansible_facts['env']['PATH'] }}"
  register: dotagents_init_skill
  failed_when: false
  changed_when: "'Removed' in dotagents_init_skill.stdout"
  when: not dotagents_manifest.stat.exists
  tags: [dotagents_skills, upgrade]

- name: "Fail with anything init's bootstrap skill removal could not explain"
  vars:
    dotagents_init_skill_failures: >-
      {{ ([dotagents_init_skill] if dotagents_init_skill is defined else [])
         | rejectattr('rc', 'eq', 0)
         | rejectattr('stderr', 'search', 'not found|No skill|not declared') | list }}
  ansible.builtin.fail:
    msg: >-
      dotagents could not remove init's bootstrap skill. What it actually said:
      {{ dotagents_init_skill_failures | map(attribute='stderr') | map('trim')
         | select | join(' | ')
         | default('nothing on stderr; re-run the failing command by hand', true) }}
  when:
    - not dotagents_manifest.stat.exists
    - dotagents_init_skill_failures | length > 0
  tags: [dotagents_skills, upgrade]

# ── Approved sources ─────────────────────────────────────────────────────────
# dotagents enforces the allow-list itself: validateTrustedSource throws on any
# source outside the table, at both `add` and `install`. Done via the CLI rather
# than templating agents.toml, because that file is dotagents' to write.

- name: "Declare the approved sources to dotagents"
  # Adding an entry that is already present is a no-op that exits non-zero with
  # "already in ...". The reporting task below treats that as success rather
  # than making the second run of an idempotent task fail.
  ansible.builtin.command:
    cmd: dotagents --user trust add {{ item.source }}
  environment:
    PATH: "{{ ansible_facts['env']['HOME'] }}/.local/share/mise/shims:{{ ansible_facts['env']['PATH'] }}"
  loop: "{{ dotagents_sources }}"
  loop_control:
    label: "{{ item.source }}"
  register: dotagents_trust_add
  failed_when: false
  changed_when: "'Added' in dotagents_trust_add.stdout"
  tags: [dotagents_skills, upgrade]

- name: "Fail with every source dotagents would not trust"
  vars:
    dotagents_trust_failures: >-
      {{ dotagents_trust_add.results | default([])
         | rejectattr('rc', 'eq', 0)
         | rejectattr('stderr', 'search', 'already in') | list }}
  ansible.builtin.fail:
    msg: >-
      dotagents rejected
      {{ dotagents_trust_failures | map(attribute='item.source') | join(', ') }}.
      What it actually said:
      {{ dotagents_trust_failures | map(attribute='stderr') | map('trim')
         | select | join(' | ')
         | default('nothing on stderr; re-run the failing command by hand', true) }}
  when: dotagents_trust_failures | length > 0
  tags: [dotagents_skills, upgrade]

- name: "Sync every skill and plugin from each approved source"
  # `--all` declares the source as a wildcard dependency rather than naming
  # skills, so adding a skill upstream needs no edit here. A repository that
  # publishes a plugin marketplace (mattpocock/skills) installs as a plugin;
  # dotagents discovers plugins before skills, and refuses a named skill from
  # such a source. Re-adding an identical declaration refreshes the
  # installation, which is why this doubles as upgrade.
  ansible.builtin.command:
    cmd: dotagents --user add {{ item.source }} --all
  environment:
    PATH: "{{ ansible_facts['env']['HOME'] }}/.local/share/mise/shims:{{ ansible_facts['env']['PATH'] }}"
  loop: "{{ dotagents_sources }}"
  loop_control:
    label: "{{ item.source }}"
  register: dotagents_add
  # dotagents reports its errors on stderr and leaves stdout empty, so failing
  # here would discard the only diagnosis. See the reporting task below.
  failed_when: false
  changed_when: >-
    'Added skills' in dotagents_add.stdout
    or 'Added skill' in dotagents_add.stdout
    or 'Added plugins' in dotagents_add.stdout
    or 'Added plugin' in dotagents_add.stdout
    or 'Refreshed' in dotagents_add.stdout
  tags: [dotagents_skills, upgrade]

- name: "Fail with every source dotagents could not sync"
  ansible.builtin.fail:
    msg: >-
      dotagents could not sync
      {{ dotagents_add.results | rejectattr('rc', 'eq', 0)
         | map(attribute='item.source') | join(', ') }}.
      What it actually said:
      {{ dotagents_add.results | rejectattr('rc', 'eq', 0)
         | map(attribute='stderr') | map('trim') | select | join(' | ')
         | default('nothing on stderr; re-run the failing command by hand', true) }}
  when: dotagents_add.results | rejectattr('rc', 'eq', 0) | list | length > 0
  tags: [dotagents_skills, upgrade]

- name: "Veto each excluded skill from its approved source"
  # `remove <name>` on a wildcard-covered skill adds it to that wildcard's
  # exclude list and deletes the directory, so the veto survives the next sync
  # rather than being re-installed and re-removed forever. -y answers the
  # confirmation prompt, which has no terminal under Ansible.
  ansible.builtin.command:
    cmd: dotagents --user remove {{ item.1 }} -y
  environment:
    PATH: "{{ ansible_facts['env']['HOME'] }}/.local/share/mise/shims:{{ ansible_facts['env']['PATH'] }}"
  loop: "{{ dotagents_sources | subelements('exclude', skip_missing=True) }}"
  loop_control:
    label: "{{ item.1 }} ← {{ item.0.source }}"
  register: dotagents_veto
  failed_when: false
  changed_when: "'exclude list' in dotagents_veto.stdout"
  tags: [dotagents_skills, upgrade]

- name: "Fail with every skill dotagents could not veto"
  # An already-excluded skill is not installed, so `remove` reports it missing.
  # That is the desired end state on every run after the first, not an error.
  vars:
    dotagents_veto_failures: >-
      {{ dotagents_veto.results | default([]) | rejectattr('rc', 'eq', 0)
         | rejectattr('stderr', 'search', 'not found|No skill|not declared') | list }}
  ansible.builtin.fail:
    msg: >-
      dotagents could not veto
      {{ dotagents_veto_failures | map(attribute='item.1') | join(', ') }}.
      What it actually said:
      {{ dotagents_veto_failures | map(attribute='stderr') | map('trim')
         | select | join(' | ')
         | default('nothing on stderr; re-run the failing command by hand', true) }}
  when: dotagents_veto_failures | length > 0
  tags: [dotagents_skills, upgrade]

- name: "Report skill sync results"
  ansible.builtin.debug:
    msg: >-
      Approved sources {{ dotagents_sources | map(attribute='source') | join(', ') }}
      are trusted and declared as wildcards in ~/.agents/agents.toml;
      `dotagents list` reports which skills and plugins that resolved to.
  tags: [dotagents_skills, upgrade]

# ── Client plugin wiring ─────────────────────────────────────────────────────
# dotagents publishes the local marketplace in claude's native format
# (~/.agents/plugins/marketplace.json, name `dotagents-local`) but does not
# register it — plugin skills reached opencode only (measured 2026-10-28,
# dotagents 3.4.0; upstream #201 is a library API, not client wiring). Each
# client CLI registers the marketplace itself, so this topic drives the CLI
# rather than templating ~/.claude/settings.json, which is machine-local.
#
# The clients are machine-local and optional: `claude` comes from
# apps/claude-code, which is Darwin-only (Debian is DOT-141, open), and `codex`
# has no topic at all. A CLI that is absent is skipped and reported — the skill
# set still reaches every agent through ~/.agents/skills — while a CLI that is
# present and fails still fails the run. Probed rather than assumed, because
# the assumption is what aborted a Debian run (measured 2026-11-09).

- name: "Find the dotagents plugin marketplace"
  ansible.builtin.stat:
    path: "{{ ansible_facts['env']['HOME'] }}/.agents/plugins/marketplace.json"
  register: dotagents_claude_marketplace
  tags: [dotagents_skills, upgrade]

- name: "Read the marketplace's plugin list for both claude and codex"
  # One source of truth for every CLI that consumes dotagents-local: the
  # marketplace file dotagents generated, not a duplicated list in this topic.
  ansible.builtin.set_fact:
    dotagents_claude_marketplace_json: >-
      {{ lookup('file', ansible_facts['env']['HOME'] + '/.agents/plugins/marketplace.json') | from_json }}
  when: dotagents_claude_marketplace.stat.exists
  tags: [dotagents_skills, upgrade]

- name: "Probe for each optional client CLI"
  # `command -v` through the shell, not the command module: the command module
  # passes `||` as a literal operand and then resolves ANY token, so `a || b`
  # is a false-positive detector (roborev review, PR #70 — apps/loreai). The
  # probe runs whether or not the marketplace exists, because the report below
  # describes the machine, not this run's skipping.
  ansible.builtin.shell:
    cmd: command -v {{ item.probe | quote }} >/dev/null 2>&1
  environment:
    PATH: "{{ ansible_facts['env']['HOME'] }}/.local/share/mise/shims:{{ ansible_facts['env']['PATH'] }}"
  register: dotagents_client_probes
  changed_when: false
  failed_when: false
  check_mode: false  # read-only probe; keeps --check detection honest
  loop:
    - {client: claude, probe: claude, wire_var: dotagents_wire_claude}
    - {client: codex, probe: codex, wire_var: dotagents_wire_codex}
  loop_control:
    label: "{{ item.client }}"
  tags: [dotagents_skills, upgrade]

- name: "Record which clients are wired, declined, or absent"
  # One fact feeds both the per-client `when:` and the report, so the report
  # cannot disagree with what the run did. `declined` is a machine deciding not
  # to wire a client that IS installed — distinct from absent, and it must not
  # read as absent or the operator loses the distinction they asked for.
  ansible.builtin.set_fact:
    dotagents_client_state: >-
      {%- set state = {} -%}
      {%- for probe in dotagents_client_probes.results -%}
        {%- set installed = probe.rc == 0 -%}
        {#- `vars[...]` is refused inside a template; the lookup is the supported
            way to read a variable whose NAME is itself data. -#}
        {%- set wanted = lookup('vars', probe.item.wire_var, default=true) | bool -%}
        {%- set _ = state.update({
              probe.item.client:
                ('wired' if installed and wanted
                 else 'declined' if installed
                 else 'absent')}) -%}
      {%- endfor -%}
      {{ state }}
  tags: [dotagents_skills, upgrade]

- name: "Report client wiring on this machine"
  ansible.builtin.debug:
    msg: >-
      Client plugin wiring:
      {% for client, state in dotagents_client_state.items() %}
      {{ client }} is {{ state }}{{ ',' if not loop.last else '.' }}
      {% endfor %}
      {{ '' if 'absent' not in dotagents_client_state.values() else
         'An absent client is skipped, not an error: its CLI is not installed
         here, so there is nothing to register the marketplace with. Install the
         client (apps/claude-code is Darwin-only; Debian is DOT-141) and re-run
         the topic to wire it.' }}
      {{ '' if 'declined' not in dotagents_client_state.values() else
         'A declined client is installed but its dotagents_wire_<client> flag is
         off; set it true in defaults/main.yaml to wire it.' }}
  tags: [dotagents_skills, upgrade]

- name: "Register the dotagents marketplace with claude"
  # Re-running is a no-op that exits 0 with "already on disk", so this
  # converges on every run. When the marketplace file is absent (no plugin
  # sources declared, or sync failed above), skipping is the honest state:
  # claude cannot be pointed at a marketplace that does not exist.
  ansible.builtin.command:
    cmd: >-
      claude plugin marketplace add
      {{ ansible_facts['env']['HOME'] }}/.agents/plugins/marketplace.json
  environment:
    PATH: "{{ ansible_facts['env']['HOME'] }}/.local/share/mise/shims:{{ ansible_facts['env']['PATH'] }}"
  register: dotagents_claude_marketplace_add
  failed_when: false
  changed_when: "'Successfully added' in dotagents_claude_marketplace_add.stdout"
  when:
    - dotagents_claude_marketplace.stat.exists
    - dotagents_client_state.claude == 'wired'
  tags: [dotagents_skills, upgrade]

- name: "Fail with anything claude's marketplace registration could not explain"
  vars:
    dotagents_claude_marketplace_failures: >-
      {{ [dotagents_claude_marketplace_add] | selectattr('skipped', 'undefined')
         | rejectattr('rc', 'eq', 0) | list }}
  ansible.builtin.fail:
    msg: >-
      claude is installed but could not register the dotagents marketplace
      (~/.agents/plugins/marketplace.json). What it actually said:
      {{ dotagents_claude_marketplace_failures
         | map('client_said', 'nothing on stderr, stdout or msg; re-run `claude plugin marketplace add` by hand')
         | join(' | ') }}
  when:
    - dotagents_claude_marketplace.stat.exists
    - dotagents_client_state.claude == 'wired'
    - dotagents_claude_marketplace_add.rc | default(0) != 0
  tags: [dotagents_skills, upgrade]

- name: "Install every declared dotagents plugin into claude"
  # The plugin name lives in the marketplace entry dotagents generated, so it
  # is read from that file rather than duplicated here. Re-running exits 0
  # with "already installed", so this converges.
  ansible.builtin.command:
    cmd: claude plugin install {{ item.name }}@dotagents-local
  environment:
    PATH: "{{ ansible_facts['env']['HOME'] }}/.local/share/mise/shims:{{ ansible_facts['env']['PATH'] }}"
  loop: "{{ dotagents_claude_marketplace_json.plugins }}"
  loop_control:
    label: "{{ item.name }}@dotagents-local"
  register: dotagents_claude_plugin_install
  failed_when: false
  changed_when: "'Successfully installed' in dotagents_claude_plugin_install.stdout"
  when:
    - dotagents_claude_marketplace.stat.exists
    - dotagents_client_state.claude == 'wired'
  tags: [dotagents_skills, upgrade]

- name: "Fail with every dotagents plugin claude could not install"
  vars:
    dotagents_claude_plugin_failures: >-
      {{ dotagents_claude_plugin_install.results | default([])
         | rejectattr('rc', 'eq', 0) | list }}
  ansible.builtin.fail:
    msg: >-
      claude is installed but could not install
      {{ dotagents_claude_plugin_failures | map(attribute='item.name') | join(', ') }}.
      What it actually said:
      {{ dotagents_claude_plugin_failures
         | map('client_said', 'nothing on stderr, stdout or msg; re-run `claude plugin install <name>@dotagents-local` by hand')
         | join(' | ') }}
  when:
    - dotagents_claude_marketplace.stat.exists
    - dotagents_client_state.claude == 'wired'
    - dotagents_claude_plugin_failures | default([]) | length > 0
  tags: [dotagents_skills, upgrade]

# ── Codex plugin wiring ──────────────────────────────────────────────────────
# Same mechanism as claude, a different CLI: dotagents 3.4.0 registers
# `dotagents-local` in codex's marketplace list (measured 2026-10-28 in
# `codex plugin list`), but does not install the plugin. `codex plugin add`
# reads the shared plugin clone in place and is idempotent on re-run.

- name: "Install every declared dotagents plugin into codex"
  ansible.builtin.command:
    cmd: codex plugin add {{ item.name }}@dotagents-local
  environment:
    PATH: "{{ ansible_facts['env']['HOME'] }}/.local/share/mise/shims:{{ ansible_facts['env']['PATH'] }}"
  loop: "{{ dotagents_claude_marketplace_json.plugins }}"
  loop_control:
    label: "{{ item.name }}@dotagents-local (codex)"
  register: dotagents_codex_plugin_install
  failed_when: false
  changed_when: "'Added plugin' in dotagents_codex_plugin_install.stdout"
  when:
    - dotagents_claude_marketplace.stat.exists
    - dotagents_client_state.codex == 'wired'
  tags: [dotagents_skills, upgrade]

- name: "Fail with every dotagents plugin codex could not install"
  vars:
    dotagents_codex_plugin_failures: >-
      {{ dotagents_codex_plugin_install.results | default([])
         | rejectattr('rc', 'eq', 0) | list }}
  ansible.builtin.fail:
    msg: >-
      codex is installed but could not install
      {{ dotagents_codex_plugin_failures | map(attribute='item.name') | join(', ') }}.
      What it actually said:
      {{ dotagents_codex_plugin_failures
         | map('client_said', 'nothing on stderr, stdout or msg; re-run `codex plugin add <name>@dotagents-local` by hand')
         | join(' | ') }}
  when:
    - dotagents_claude_marketplace.stat.exists
    - dotagents_client_state.codex == 'wired'
    - dotagents_codex_plugin_failures | default([]) | length > 0
  tags: [dotagents_skills, upgrade]

- name: "Guard that every installed skill came from an approved source"
  # After the sync, not before: the question is what is on the machine now, and
  # an undeclared directory is only visible once the declared ones are in place.
  # It is also the LAST task in this file, so every other topic converges before
  # the gate can fail — one undeclared skill must not block the rest of the
  # install from completing.
  ansible.builtin.import_role:
    name: "roles/guards"
    tasks_from: dotagents-approved-sources.yaml
  vars:
    guard_caller: "apps/dotagents"
    guard_approved_sources: "{{ dotagents_sources | map(attribute='source') | list }}"
    guard_vendored_skills: "{{ dotagents_vendored | map(attribute='name') | list }}"
    guard_skill_excludes: >-
      {{ dict(dotagents_sources | map(attribute='source')
              | zip(dotagents_sources | map(attribute='exclude', default=[]))) }}
    guard_allow_unapproved_skills: "{{ dotagents_allow_unapproved_skills }}"
    guard_foreign_buckets: "{{ dotagents_skill_foreign }}"
  tags: [dotagents_skills, upgrade]
