# apps/dotagents/topic.yml
#
# Topic metadata read by the parent playbook. See docs/TOPICS.md.
#
# Lives at the role root (not under meta/) because Ansible reserves
# meta/main.yml for galaxy_info / role dependencies and rejects unknown
# top-level keys there.

topic_name: dotagents

# Other topics may require `dotagents` to order themselves after the global
# skill sync. Nothing installs skills itself any more; they consume this.
topic_provides: [dotagents]

# The binary is a mise tool (`npm:@sentry/dotagents` in
# apps/mise/files/config.toml), so node is the dependency this topic needs at
# install and upgrade time. `dotagents` itself is probed by the first task,
# which names `mise install` in the failure — a PATH membership check here
# would report NO_TOPIC for a tool this repo installs.
topic_requires: [node]

topic_os: [Darwin, Debian]

topic_tier: app
