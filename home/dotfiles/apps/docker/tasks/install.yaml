# apps/docker/tasks/install.yaml
# Package installation tasks. Be explicit about which package manager is used.
# Use when: conditions to guard each block by OS/arch.
# Do NOT put upgrade logic here — upgrades are owned by system roles (homebrew, apt).
# Do NOT put config/symlink tasks here — those are owned by chezmoi.

# macOS is intentionally NOT handled here — Rancher Desktop provides `docker`
# on Darwin (apps/rancher-desktop). This topic is Debian-only (topic.yml).

# ── Linux (apt, Docker's official repository) ─────────────────────────────────
# Install the docker-ce stack from download.docker.com — NOT Ubuntu's docker.io.
# The two stacks are mutually exclusive: docker.io depends on Ubuntu's
# `containerd`, which conflicts with Docker's `containerd.io` (and docker.io
# conflicts with docker-ce). Until 2026-11-02 this task installed docker.io +
# docker-compose-v2, and on any host already running the official stack apt
# died with "E: Error, pkgProblemResolver::Resolve generated breaks".
#
# docker-compose-plugin is the `docker compose` plugin that self-hosted
# requires (>= 2.32.2). docker-buildx-plugin ships only from this repo.
# docker-ce-rootless-extras is only a Recommends of docker-ce — named
# explicitly so rootless mode is present even with Install-Recommends off.
- name: "Docker (Debian): ensure apt keyrings dir"
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    mode: "0755"
  become: true
  when: ansible_facts['os_family'] == 'Debian'

- name: "Docker (Debian): add Docker's official signing key"
  # Docker serves an ASCII-armoured key at .../gpg. apt 2.4 loads a
  # `signed-by` keyring as BINARY, and a `.asc`-named file holding armoured
  # (or, after the keyring-repair helper runs, binary) content is the exact
  # mismatch that made apt report NO_PUBKEY while gpgv verified the same
  # InRelease fine — measured 2026-11-08. Download the armoured key to a
  # temp name, then dearmour it into a `.gpg` file so the extension matches
  # the binary content.
  ansible.builtin.get_url:
    url: "https://download.docker.com/linux/{{ docker_apt_distro }}/gpg"
    dest: /etc/apt/keyrings/docker.asc
    mode: "0644"
  become: true
  when: ansible_facts['os_family'] == 'Debian'
  register: docker_key_download

- name: "Docker (Debian): check whether the binary key already exists"
  ansible.builtin.stat:
    path: /etc/apt/keyrings/docker.gpg
  become: true
  when: ansible_facts['os_family'] == 'Debian'
  register: docker_gpg_present

- name: "Docker (Debian): check gpg is available"
  # gpg is provided by the apt topic's prerequisites (gnupg), which runs
  # first in the pkg-manager tier. A scoped `run-role.sh docker` has no such
  # guarantee, so preflight it and fail before the dearmour command with the
  # fix named — a bare command on a missing gpg fails with a generic
  # "Error executing command" and never reaches the explanatory task.
  ansible.builtin.stat:
    path: /usr/bin/gpg
  become: true
  when: ansible_facts['os_family'] == 'Debian'
  register: docker_gpg_bin

- name: "Docker (Debian): fail with the fix if gpg is missing"
  # Only fail when the dearmour command would actually run: a converged host
  # with docker.gpg present and an unchanged download skips dearmour, so a
  # missing gpg there is not a problem and must not fail the role.
  ansible.builtin.fail:
    msg: >-
      Docker's key dearmour needs gpg, which the apt topic installs
      (gnupg). Run the apt topic first, or `sudo apt-get install -y gnupg`.
  when:
    - ansible_facts['os_family'] == 'Debian'
    - not docker_gpg_bin.stat.exists
    - docker_key_download is changed or not docker_gpg_present.stat.exists

- name: "Docker (Debian): dearmour the signing key to a binary .gpg"
  # changed_when reports true only when the command actually recreated the
  # key (a fresh create or a replaced download), so callers see the real state.
  ansible.builtin.command:
    cmd: "gpg --dearmor --yes --output /etc/apt/keyrings/docker.gpg /etc/apt/keyrings/docker.asc"
  become: true
  when:
    - ansible_facts['os_family'] == 'Debian'
    - docker_key_download is changed or not docker_gpg_present.stat.exists
  changed_when: docker_key_download is changed or not docker_gpg_present.stat.exists

- name: "Docker (Debian): re-check the binary key exists"
  # gpg may create docker.gpg with a restrictive become umask (0600), which
  # apt's unprivileged _apt reader cannot open — NO_PUBKEY persists despite a
  # successful dearmour. Re-stat after dearmour so a freshly created key (not
  # present in the pre-run snapshot) still gets the mode. Match the 0644 the
  # Python helper and the armoured download both write.
  ansible.builtin.stat:
    path: /etc/apt/keyrings/docker.gpg
  become: true
  when: ansible_facts['os_family'] == 'Debian'
  register: docker_gpg_after

- name: "Docker (Debian): enforce 0644 on the binary key"
  ansible.builtin.file:
    path: /etc/apt/keyrings/docker.gpg
    mode: "0644"
  become: true
  when:
    - ansible_facts['os_family'] == 'Debian'
    - docker_gpg_after.stat.exists

- name: "Docker (Debian): retire legacy one-line source"
  # Pre-managed hosts have the repo as a hand-made docker.list. The deb822
  # source below is the same repo; if both files exist apt warns it is
  # "configured multiple times". Absent on fresh machines, so a no-op there.
  ansible.builtin.file:
    path: /etc/apt/sources.list.d/docker.list
    state: absent
  become: true
  when: ansible_facts['os_family'] == 'Debian'

- name: "Docker (Debian): add Docker's official apt repository"
  ansible.builtin.deb822_repository:
    name: docker
    types: [deb]
    uris: "https://download.docker.com/linux/{{ docker_apt_distro }}"
    suites: ["{{ ansible_facts['distribution_release'] }}"]
    components: [stable]
    architectures: "{{ docker_apt_arch }}"
    signed_by: /etc/apt/keyrings/docker.gpg
    state: present
  become: true
  when: ansible_facts['os_family'] == 'Debian'

- name: "Install Docker engine + compose plugin via apt (Linux)"
  ansible.builtin.apt:
    name:
      - docker-ce
      - docker-ce-cli
      - containerd.io
      - docker-buildx-plugin
      - docker-compose-plugin
      - docker-ce-rootless-extras
    state: present
    update_cache: true
    lock_timeout: "{{ docker_apt_lock_timeout }}"
  become: true
  when: ansible_facts['os_family'] == 'Debian'
