# apps/docker/tasks/bootstrap.yaml
# Explicit presence check for the Docker engine — no drift tolerated.
#
# This topic is Debian-only (topic.yml); on macOS the `docker` provider is
# apps/rancher-desktop instead, so there is no macOS logic here. The actual
# install lives in install.yaml (apt docker.io + docker-compose-v2) — bootstrap
# only verifies and reports.

- name: "Bootstrap: check Docker CLI is available"
  ansible.builtin.shell: command -v docker
  register: docker_cli
  changed_when: false
  failed_when: false
  check_mode: false  # read-only probe; must run even under --check so the report below has data

- name: "Bootstrap: report Docker CLI status"
  ansible.builtin.debug:
    msg: >-
      {{ '✅ Docker CLI found at ' ~ docker_cli.stdout
         if docker_cli.rc == 0
         else '⚠️  Docker CLI not found — the install phase adds it via apt (docker.io).' }}
