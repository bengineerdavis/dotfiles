# apps/rancher-desktop/tasks/service-mode.yaml
#
# Shared by install.yaml and upgrade.yaml, like path-management.yaml and for the
# same reason: an app update can reset these, so the upgrade pass re-asserts them.
#
# What "service" means here. Rancher Desktop is a GUI app that happens to carry a
# container engine. We want the opposite emphasis — the engine is the point and
# the window is incidental — so the container CLIs (`docker`, `docker compose`)
# are the interface and Rancher is infrastructure you never open.
#
# Three settings, and the third is the one that is easy to get backwards:
#
#   auto-start          start at login, so the engine is up before you need it
#   start-in-background  start with no window
#   quit-on-close=false  closing the window leaves the engine RUNNING
#
# `quit-on-close: true` would terminate the whole app when the window closes,
# which is exactly what a service must not do. It is already false by default;
# it is asserted here anyway, because a default that is load-bearing and
# unstated is one an update is free to change.
#
# NOT set here: Kubernetes. Rancher runs a full control plane when
# `kubernetes.enabled` is true — on this machine that was five permanently
# resident containers (coredns, traefik, metrics-server, local-path-provisioner
# and its pause containers). That is the standing memory cost of the VM, and
# whether to pay it is a decision about what you use the machine for, not a
# property of running the engine as a service. See README.md.

# Its own stat, deliberately. path-management.yaml also registers this, but a
# task file that only works when another one ran first is a trap: reorder the
# imports and this silently stops setting anything, because the `when` falls
# back to false rather than failing.
- name: "Rancher: check for rdctl (service mode)"
  ansible.builtin.stat:
    path: "{{ rancher_rdctl }}"
  register: rancher_service_rdctl_stat
  when: ansible_facts['os_family'] == 'Darwin'

- name: "Rancher: read current application settings"
  ansible.builtin.slurp:
    src: "{{ rancher_settings_json }}"
  register: rancher_service_settings_raw
  failed_when: false
  when: ansible_facts['os_family'] == 'Darwin'

- name: "Rancher: resolve current service-mode settings"
  ansible.builtin.set_fact:
    rancher_current_service: >-
      {{ (rancher_service_settings_raw.content | default('') | b64decode | from_json)
         .get('application', {})
         if (rancher_service_settings_raw.content is defined) else {} }}
  when: ansible_facts['os_family'] == 'Darwin'

- name: "Rancher: report what this run found"
  ansible.builtin.debug:
    msg: >-
      autoStart={{ rancher_current_service.get('autoStart', 'unknown') }}
      (want {{ rancher_auto_start }}),
      startInBackground={{ rancher_current_service.get('startInBackground', 'unknown') }}
      (want {{ rancher_start_in_background }}),
      window.quitOnClose={{ rancher_current_service.get('window', {}).get('quitOnClose', 'unknown') }}
      (want {{ rancher_quit_on_close }}).
  when: ansible_facts['os_family'] == 'Darwin'

# One rdctl call, not three. rdctl restarts the backend after a `set`, so three
# calls would restart it three times and each restart tears down every running
# container. Batched, that cost is paid once.
#
# The flags are rdctl's own, verified with `rdctl set --help` rather than taken
# from memory: --application.auto-start, --application.start-in-background,
# --application.window.quit-on-close.
- name: "Rancher: put the engine into service mode via rdctl"
  ansible.builtin.command:
    cmd: >-
      {{ rancher_rdctl }} set
      --application.auto-start={{ rancher_auto_start | bool | lower }}
      --application.start-in-background={{ rancher_start_in_background | bool | lower }}
      --application.window.quit-on-close={{ rancher_quit_on_close | bool | lower }}
  register: rancher_service_set
  failed_when: false
  changed_when: rancher_service_set.rc == 0
  when:
    - ansible_facts['os_family'] == 'Darwin'
    - rancher_service_rdctl_stat.stat.exists | default(false)
    - >-
      rancher_current_service.get('autoStart') != (rancher_auto_start | bool)
      or rancher_current_service.get('startInBackground') != (rancher_start_in_background | bool)
      or rancher_current_service.get('window', {}).get('quitOnClose') != (rancher_quit_on_close | bool)

# rdctl exits non-zero when the app is not running, because it talks to the
# app's API. Same reasoning as path-management.yaml: say so rather than fail the
# play, since the next run or a launch settles it. Silence would leave someone
# wondering why the engine still needs starting by hand.
- name: "Rancher: report that rdctl could not reach the app"
  ansible.builtin.debug:
    msg: >-
      [rancher] Could not set service mode — rdctl exited
      {{ rancher_service_set.rc }}. rdctl needs Rancher Desktop to be RUNNING.
      Launch it once and re-run `--tags install`. Until then the engine will not
      come up at login and you will keep starting it by hand.
      stderr: {{ rancher_service_set.stderr | default('') | trim }}
  when:
    - ansible_facts['os_family'] == 'Darwin'
    - rancher_service_set is defined
    - rancher_service_set.rc is defined
    - rancher_service_set.rc != 0
