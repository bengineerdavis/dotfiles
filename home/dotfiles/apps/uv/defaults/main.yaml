# apps/uv/defaults/main.yaml
---
# Minimum uv version the repo's pyproject.toml requires (uv itself refuses
# older binaries inside project runs via required-version). The install task
# fails at provisioning time with the fix named if the machine's astral
# install is older. Keep in sync with pyproject.toml [tool.uv] required-version
# and the floor in dot_config/uv/uv.toml.tmpl.
uv_min_version: "0.12.17"

# Where the astral installer puts the binary (bootstrap.sh installs latest
# there; the installer honours UV_INSTALL_DIR, which bootstrap does not set).
uv_bin: "{{ ansible_facts['env']['HOME'] }}/.local/bin/uv"

# Machine-local environment file sourced by zsh (dot_zshrc.tmpl). The topic
# writes/updates ONLY its own marker-delimited block; existing lines are never
# touched.
uv_localrc_file: "{{ ansible_facts['env']['HOME'] }}/.localrc"
uv_localrc_marker: "uv private index (apps/uv topic)"

# Opt-in teardown: uv predates this topic on existing machines, so remove
# never uninstalls the binary unless asked. The ~/.localrc block is always
# removed (it is state this topic created).
uv_remove_binary: false

# ── work-machine vault capture ──────────────────────────────────────────────
# Which secrets backend establishes the session (secrets-session role). The
# item references are configuration, not secrets; the values they resolve to
# are written to ~/.localrc with no_log and never echoed.
uv_secrets_manager: onepassword
uv_private_index_url_item: "op://Private/uv-private-index/url"
uv_private_index_username_item: "op://Private/uv-private-index/username"
uv_private_index_password_item: "op://Private/uv-private-index/password"
