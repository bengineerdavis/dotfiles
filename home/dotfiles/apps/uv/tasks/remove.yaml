# apps/uv/tasks/remove.yaml
#
# Teardown mirrors install (CRUD ownership, docs/TOPICS.md):
#   - the ~/.localrc block this topic wrote → removed unconditionally
#   - the binary → opt-in only; it predates the topic on existing machines
#
# uv.toml is NOT removed here: it is chezmoi state (dot_config/uv). Removing
# the topic's env block makes the next `chezmoi apply` render the file
# public-only on its own — config follows the machine, and no second owner
# deletes it.
- name: "Remove: drop the uv block from ~/.localrc"
  ansible.builtin.blockinfile:
    path: "{{ uv_localrc_file }}"
    state: absent
    marker: "# {mark} {{ uv_localrc_marker }}"

- name: "Remove: uninstall the astral uv binary (opt-in)"
  ansible.builtin.command: "{{ uv_bin }} self uninstall"
  when: uv_remove_binary | bool

- name: "Remove: report what was kept"
  ansible.builtin.debug:
    msg: >-
      Left the uv binary at {{ uv_bin }} (it may predate this topic). Remove
      it with `-e uv_remove_binary=true`. The chezmoi-managed
      ~/.config/uv/uv.toml follows the machine on the next apply.
