# apps/uv/tasks/upgrade.yaml
#
# The astral install self-updates; that is the whole job. Unlike brew/apt
# tiers there is no external package manager racing this binary.
- name: "Upgrade: self-update the astral uv"
  ansible.builtin.command: "{{ uv_bin }} self update"
  register: uv_self_update
  changed_when: "'Upgraded' in uv_self_update.stdout"

- name: "Upgrade: report the result"
  ansible.builtin.debug:
    msg: >-
      {{ 'uv upgraded: ' ~ (uv_self_update.stdout | regex_search('Upgraded uv from v[0-9.]+ to v[0-9.]+'))
         if uv_self_update.changed else 'uv already up to date' }}
