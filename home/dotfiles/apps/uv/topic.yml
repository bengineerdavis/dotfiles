# apps/uv/topic.yml
#
# uv is the Python package/install manager (pyproject.toml, uv.lock, uv run).
# The binary is deliberately astral-installed at the system level, NOT mise-
# managed and NOT in Homebrew: `mise upgrade` must never churn the uvx that
# builds the pipx: backends (docs/REFERENCES.md, mise Python cookbook row).
# Bootstrap installs it first (dotfiles/bootstrap/bootstrap.sh, latest or
# UV_VERSION); this topic maintains it from then on.
#
# Per-machine context (work vs personal) is read from the chezmoi source's
# .chezmoidata/uv.yaml so chezmoi and Ansible share one signal. The private
# index URL itself lives only in ~/.localrc, captured from the vault —
# never in git (spec.md § Data).
topic_name: uv

topic_provides: [uv]

# The astral installer needs only curl. No package manager is declared: a
# Debian-capable topic must not require Homebrew (AGENTS.md § Cross-platform).
topic_requires: []

topic_os: [Darwin, Debian]

topic_tier: app
