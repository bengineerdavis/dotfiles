# apps/chrome/tasks/git-refs-guard.yaml
#
# Shared pre-check imported by both install.yaml and upgrade.yaml, so the two
# paths cannot drift apart on the one question that matters before fetching:
# does the pinned ref still mean what it meant?
#
# A force-moved tag is the single way a pinned ref stops being a pin. git
# refuses the fetch on its own ("would clobber existing tag") but the error
# explains nothing and names no commits. This detects the case first and fails
# with both SHAs, so the diff can be read before anything is swapped.
#
# Never auto-clobber. For an extension whose content scripts run over customer
# conversations, replacing the code under an unchanged version string is exactly
# the silent substitution pinning exists to prevent. Accepting a move is opt-in
# per run via chrome_allow_moved_refs — see defaults/main.yaml.

- name: "Detect pinned tags that moved upstream"
  ansible.builtin.shell:
    cmd: |
      set -uo pipefail
      dir={{ (chrome_unpacked_root ~ '/' ~ item.slug) | quote }}
      if [ ! -d "$dir/.git" ]; then exit 0; fi
      cd "$dir"
      # ^{} dereferences an annotated tag to the commit it points at; comparing
      # tag-object SHAs would report a move for a mere re-annotation.
      local_c=$(git rev-parse "{{ item.ref }}^{}" 2>/dev/null || true)
      remote_c=$(git ls-remote origin "refs/tags/{{ item.ref }}^{}" 2>/dev/null | cut -f1)
      if [ -z "$local_c" ] || [ -z "$remote_c" ]; then exit 0; fi
      if [ "$local_c" != "$remote_c" ]; then
        echo "MOVED local=$local_c remote=$remote_c"
      fi
  args:
    executable: /bin/bash
  loop: "{{ chrome_extensions | default([]) | selectattr('source', 'eq', 'git') | list }}"
  loop_control:
    label: "{{ item.name }} @ {{ item.ref }}"
  register: chrome_git_moved
  changed_when: false
  failed_when: false
  when: ansible_facts['os_family'] == 'Darwin'

- name: "Fail clearly when a pinned tag moved (unless explicitly allowed)"
  ansible.builtin.fail:
    msg: >-
      [moved-ref] '{{ item.item.name }}' is pinned to {{ item.item.ref }}, but
      that tag now points at a different commit upstream than the one in your
      clone ({{ item.stdout | default('') | trim }}). The version string did not
      change; the code did. Nothing has been fetched or rebuilt.
      Inspect the diff in {{ chrome_unpacked_root }}/{{ item.item.slug }}, then
      either re-pin the manifest to a new tag, or accept this move for one run
      with -e chrome_allow_moved_refs=true.
  loop: "{{ chrome_git_moved.results | default([]) }}"
  loop_control:
    label: "{{ item.item.name }}"
  when:
    - ansible_facts['os_family'] == 'Darwin'
    - not (chrome_allow_moved_refs | bool)
    - "'MOVED' in (item.stdout | default(''))"
