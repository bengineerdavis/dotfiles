# apps/chrome/tasks/remove.yaml
# Explicit uninstall tasks. Never run as part of provision or install.
# Only invoked via --tags remove.
# Mirrors install.yaml — one teardown per piece of state it created.

# ── Seed JSONs ──────────────────────────────────────────────────────────────
# Removing a seed stops Chrome offering the extension on a fresh profile. It
# does NOT uninstall an extension already installed — Chrome treats that as the
# user's own copy from that point on. Reported below rather than left implicit.

- name: "Remove the seed JSON for each store extension"
  ansible.builtin.file:
    path: "{{ chrome_external_extensions_dir }}/{{ item.id }}.json"
    state: absent
  loop: "{{ chrome_extensions | selectattr('source', 'eq', 'store') | list }}"
  loop_control:
    label: "{{ item.name }} ({{ item.id }})"
  when: ansible_facts['os_family'] == 'Darwin'

- name: "Check whether the External Extensions directory is now empty"
  ansible.builtin.find:
    paths: "{{ chrome_external_extensions_dir }}"
    file_type: any
  register: chrome_extdir_remaining
  failed_when: false
  when: ansible_facts['os_family'] == 'Darwin'

# Only remove the directory if this topic left nothing behind in it. Something
# else may have seeded an extension there; an empty check is cheap insurance.
- name: "Remove the External Extensions directory if empty"
  ansible.builtin.file:
    path: "{{ chrome_external_extensions_dir }}"
    state: absent
  when:
    - ansible_facts['os_family'] == 'Darwin'
    - (chrome_extdir_remaining.files | default([])) | length == 0

- name: "Report extensions that remain installed after seed removal"
  ansible.builtin.debug:
    msg: >-
      [remove] Seeds deleted. Any of these already installed in a profile stay
      installed — Chrome does not uninstall an extension when its seed goes
      away. Remove them from chrome://extensions by hand if that is the intent:
      {{ chrome_extensions | selectattr('source', 'eq', 'store')
         | map(attribute='name') | join(', ') }}
  when: ansible_facts['os_family'] == 'Darwin'

# ── Cloned git extension source ─────────────────────────────────────────────
# Off by default. A clone is a working tree that may hold uncommitted local
# work, and deleting one during a teardown is not a surprise anyone should get.
# The unpacked-root directory itself is left alone regardless — it lives under
# the user's own code tree, not in state this topic invented.

- name: "Remove cloned git extension source (opt-in only)"
  ansible.builtin.file:
    path: "{{ chrome_unpacked_root }}/{{ item.slug }}"
    state: absent
  loop: "{{ chrome_extensions | selectattr('source', 'eq', 'git') | list }}"
  loop_control:
    label: "{{ item.name }}"
  when:
    - ansible_facts['os_family'] == 'Darwin'
    - chrome_remove_git_clones | bool

- name: "Report cloned git extension source left in place"
  ansible.builtin.debug:
    msg: >-
      [remove] Clone left at {{ chrome_unpacked_root }}/{{ item.slug }}
      (chrome_remove_git_clones is false). Chrome will show it as an error card
      once you remove the extension in chrome://extensions, or keep loading it
      if you do not. Set chrome_remove_git_clones=true to delete the tree —
      check for uncommitted work first.
  loop: "{{ chrome_extensions | selectattr('source', 'eq', 'git') | list }}"
  loop_control:
    label: "{{ item.name }}"
  when:
    - ansible_facts['os_family'] == 'Darwin'
    - not (chrome_remove_git_clones | bool)

# ── The audit CLI ───────────────────────────────────────────────────────────

- name: "Remove the browser-ext CLI symlink"
  ansible.builtin.file:
    path: "{{ ansible_facts['env']['HOME'] }}/bin/browser-ext"
    state: absent
  when: ansible_facts['os_family'] == 'Darwin'

# ── The browser ─────────────────────────────────────────────────────────────
# Guarded off by default. Chrome here is Keystone/MDM-managed and carries the
# Chrome Browser Cloud Management enrollment; uninstalling it from a dotfiles
# teardown would fight IT. Only runs where this topic actually installed it.

- name: "Remove google-chrome via Homebrew Cask (opt-in only)"
  community.general.homebrew_cask:
    name: google-chrome
    state: absent
  when:
    - ansible_facts['os_family'] == 'Darwin'
    - chrome_remove_browser | bool

- name: "Note that the browser was deliberately left installed"
  ansible.builtin.debug:
    msg: >-
      [remove] Google Chrome left installed (chrome_remove_browser is false).
      It is managed by Google Keystone under MDM and carries the Chrome Browser
      Cloud Management enrollment. Set chrome_remove_browser=true only on a
      machine where this topic installed the cask itself.
  when:
    - ansible_facts['os_family'] == 'Darwin'
    - not (chrome_remove_browser | bool)
