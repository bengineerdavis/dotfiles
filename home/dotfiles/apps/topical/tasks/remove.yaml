# apps/topical/tasks/remove.yaml
# Explicit uninstall tasks. Never run as part of provision or install.
# Only invoked via --tags remove.
# CRUD invariant: anything install.yaml creates, this file tears down.

- name: "List installed uv tools"
  ansible.builtin.command: uv tool list
  register: topical_uv_tools_remove
  changed_when: false
  check_mode: false  # read-only probe; --check must see it to gate on it

- name: "Uninstall topical"
  ansible.builtin.command: uv tool uninstall topical
  when: topical_uv_tools_remove.stdout is search("^topical v", multiline=True)
