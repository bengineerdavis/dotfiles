---
# apps/1password/tests/topic-metadata.yaml

- name: "Test 1password topic metadata"
  hosts: localhost
  connection: local
  gather_facts: false
  become: false

  vars:
    onepassword_topic_file: "{{ playbook_dir }}/../topic.yml"

  tasks:
    - name: "Load topic.yml"
      ansible.builtin.slurp:
        src: "{{ onepassword_topic_file }}"
      register: onepassword_topic_raw

    - name: "Parse topic.yml"
      ansible.builtin.set_fact:
        onepassword_topic: "{{ onepassword_topic_raw.content | b64decode | from_yaml }}"

    - name: "Assert required keys are present and valid"
      ansible.builtin.assert:
        that:
          - onepassword_topic.topic_name == '1password'
          - onepassword_topic.topic_tier == 'app'
          - "'Debian' in onepassword_topic.topic_os"
          - "'Darwin' in onepassword_topic.topic_os"
          - "'1password' in onepassword_topic.topic_provides"
          - "'mise' in onepassword_topic.topic_requires"
        success_msg: "PASS: 1password topic metadata is valid"
        fail_msg: |
          FAIL: topic metadata invalid:
          {{ onepassword_topic | to_nice_json }}
