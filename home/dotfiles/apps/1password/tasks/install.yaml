# apps/1password/tasks/install.yaml
#
# Two things, one topic:
#   • the 1Password CLI (`op`) — verified here, installed and upgraded by the
#     mise topic (see apps/mise/files/config.toml)
#   • the 1Password desktop app (macOS) — installed here as a Homebrew cask,
#     kept current by its own updater, and restarted by this topic when an
#     update left the old process running
#
# Every piece of state created here has a matching teardown in remove.yaml,
# per the CRUD ownership invariant in docs/TOPICS.md.

- name: "Install: verify 1Password CLI is on PATH"
  ansible.builtin.shell:
    cmd: command -v op >/dev/null 2>&1
    executable: /bin/bash
  register: onepassword_cli_probe
  changed_when: false
  failed_when: false
  check_mode: false

- name: "Install: fail loudly if op is missing"
  ansible.builtin.fail:
    msg: |
      The 1Password CLI (`op`) is not on PATH.

      The binary is managed by the mise topic; ensure this line is present in
      apps/mise/files/config.toml under [tools]:

          "1password-cli" = "latest"

      Then run the mise topic first:

          ./run-role.sh mise

      After mise installs `op`, re-run this topic.
  when: onepassword_cli_probe.rc != 0

- name: "Install: report 1Password CLI version"
  ansible.builtin.command:
    cmd: op --version
  changed_when: false
  check_mode: false

# ── macOS: the desktop app ───────────────────────────────────────────────────
# topic_requires does not list homebrew: this topic also runs on Debian, where
# that would make it unschedulable (AGENTS.md § Cross-platform). On macOS the
# homebrew topic runs first, in the pkg-manager tier; this guard names the fix
# if it did not.

- name: "Install: check that brew is on PATH (macOS)"
  ansible.builtin.command: brew --version
  register: onepassword_brew_check
  changed_when: false
  failed_when: false
  check_mode: false
  when: ansible_facts['os_family'] == 'Darwin'

- name: "Install: fail with the fix if brew is absent (macOS)"
  ansible.builtin.fail:
    msg: >-
      brew not found on PATH, so the 1Password desktop app cannot be installed.
      Run the homebrew topic's bootstrap (apps/homebrew, --tags bootstrap), then
      re-run this topic.
  when:
    - ansible_facts['os_family'] == 'Darwin'
    - onepassword_brew_check.rc != 0

- name: "Install: 1Password desktop app via Homebrew Cask, adopting an existing copy (macOS)"
  # `adopt` takes over an app that is already at the target rather than
  # refusing ("It seems there is already an App at ...") or, with `force`,
  # overwriting it. For an auto_updates cask like this one, Homebrew 7.0.6
  # skips the version comparison it would otherwise make, so a copy that has
  # self-updated past the cask version is still adopted, and left untouched
  # (read in Library/Homebrew/cask/artifact/moved.rb).
  #
  # `appdir` on the command line wins over the ~/Applications default that
  # HOMEBREW_CASK_OPTS sets (explicit config beats env, cask/config.rb).
  # Without it, brew would install a second copy in ~/Applications.
  # Why /Applications: see onepassword_appdir in defaults/main.yaml.
  community.general.homebrew_cask:
    name: 1password
    state: present
    install_options:
      - adopt
      - "appdir={{ onepassword_appdir }}"
  when: ansible_facts['os_family'] == 'Darwin'

# ── macOS: restart the app if an update left it on the old binary ────────────
# 1Password updates itself (the cask is auto_updates), and an update can
# replace the bundle while the old process keeps running. roles/restart-stale
# quits it gracefully and reopens it; it never force-quits. Last in the file,
# and tagged `upgrade` so `--tags upgrade` reaches it — upgrade.yaml says why
# brew itself does not upgrade this app.
- name: "Restart the 1Password app if it predates its binary (macOS)"
  ansible.builtin.import_role:
    name: "roles/restart-stale"
  vars:
    restart_stale_caller: "apps/1password"
    restart_stale_kind: app
    restart_stale_app_name: "1Password"
    restart_stale_binary: "{{ onepassword_appdir }}/1Password.app/Contents/MacOS/1Password"
  when: ansible_facts['os_family'] == 'Darwin'
  tags: [upgrade]
