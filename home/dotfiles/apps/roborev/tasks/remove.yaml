# apps/roborev/tasks/remove.yaml
# Teardown for everything install.yaml creates, per the CRUD ownership
# invariant in docs/TOPICS.md. One piece of shared state (the tap) is
# deliberately guarded behind a flag, mirroring apps/opencode.

# ── Darwin: the tap install ─────────────────────────────────────────────────
- name: "Uninstall roborev from the tap"
  community.general.homebrew:
    name: "{{ roborev_tap }}/roborev"
    state: absent
  when: ansible_facts['os_family'] == 'Darwin'
  tags: [roborev, remove]

- name: "Untap {{ roborev_tap }}"
  community.general.homebrew_tap:
    name: "{{ roborev_tap }}"
    state: absent
  # Off by default. The tap is shared infrastructure: any other formula
  # could come from it later. Flip roborev_remove_tap deliberately.
  when:
    - ansible_facts['os_family'] == 'Darwin'
    - roborev_remove_tap | bool
  tags: [roborev, remove]

# Install leaves TWO trust entries, not one: `brew trust --tap` writes the
# tap entry, and `brew install` then writes a formula entry of its own
# (kenn-io/tap/roborev). Measured on Homebrew 7.0.1 by apps/opencode
# (2026-09-14): `brew untrust --tap` removes only the tap entry and leaves
# the formula one behind, so tearing down trust takes both commands. Both
# are idempotent — an entry that is already gone reports "Not trusted" and
# exits 0. Both are gated on the same flag as the untap, because tap, trust
# and formula trust are one unit: a trusted tap that is no longer tapped is
# harmless, but revoking trust while the tap is still present would break
# every other formula installed from it.

- name: "Stop trusting the roborev formula from {{ roborev_tap }}"
  ansible.builtin.command:
    cmd: "brew untrust --formula {{ roborev_tap }}/roborev"
  register: roborev_untrust_formula
  changed_when: "'Not trusted' not in roborev_untrust_formula.stdout"
  when:
    - ansible_facts['os_family'] == 'Darwin'
    - roborev_remove_tap | bool
  tags: [roborev, remove]

- name: "Stop trusting the tap: {{ roborev_tap }}"
  # Last, mirroring the install order (trust → tap → install) in reverse.
  ansible.builtin.command:
    cmd: "brew untrust --tap {{ roborev_tap }}"
  register: roborev_untrust_tap
  changed_when: "'Not trusted' not in roborev_untrust_tap.stdout"
  when:
    - ansible_facts['os_family'] == 'Darwin'
    - roborev_remove_tap | bool
  tags: [roborev, remove]

# ── Debian: the .deb install ────────────────────────────────────────────────
- name: "Remove the roborev package"
  ansible.builtin.apt:
    name: roborev
    state: absent
  become: true
  when: ansible_facts['os_family'] == 'Debian'
  tags: [roborev, remove]

- name: "Delete the cached .deb download"
  # The cache dir belongs to this topic — it created it, it removes it.
  ansible.builtin.file:
    path: "{{ roborev_deb_cache_dir }}"
    state: absent
  when: ansible_facts['os_family'] == 'Debian'
  tags: [roborev, remove]

# ── What is intentionally NOT removed here ──────────────────────────────────
# Per-repository state that `roborev init` created — the git hook in each
# initialized repo and the daemon's review database — belongs to those
# repositories and to the user, not to this topic. A fleet teardown has no
# business walking arbitrary git repos; removing roborev's hooks from a
# repository is per-repository work. See the roborev docs on hook
# maintenance.

- name: "Note what remove leaves in place"
  ansible.builtin.debug:
    msg: >-
      Binary removed. Per-repository git hooks and review history (the
      daemon database) were left in place — those belong to the repositories
      `roborev init` was run in, not to this topic. The tap was
      {{ 'untapped and untrusted' if roborev_remove_tap | bool
         else 'kept (roborev_remove_tap is false)' }}.
  tags: [roborev, remove]
