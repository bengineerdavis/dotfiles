# apps/roborev/topic.yml
#
# Topic metadata read by the parent playbook. See docs/TOPICS.md.
#
# Lives at the role root (not under meta/) because Ansible reserves
# meta/main.yml for galaxy_info / role dependencies and rejects unknown
# top-level keys there.

topic_name: roborev

# App-tier: provides nothing to other topics.
topic_provides: []

# Empty on purpose. Darwin installs through Homebrew, but declaring
# `homebrew` here would make the topic unschedulable on the Debian box —
# the dependency check runs on every OS and no Debian topic provides
# homebrew (the box has no linuxbrew). The brew tasks are instead guarded
# by os_family in-task, the same pattern apps/ollama uses for its package
# manager. Debian needs nothing this repo does not already have: the .deb
# route uses the apt module and network access.
topic_requires: []

topic_os: [Darwin, Debian]

topic_tier: app
