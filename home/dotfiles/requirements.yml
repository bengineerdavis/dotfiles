# Ansible collections required by this dotfiles repo.
#
# Install with:
#   ansible-galaxy collection install -r requirements.yml
#
# Run the parent playbook only after these are installed.
#
# PIN POLICY (O1, decided 2026-09-19 by the requirements-pin pilot —
# ai-prompt-library skills/research/pilots/2026-09-19-requirements-pin.md):
# exact pins to the versions the support grades were recorded against; a
# bump is a deliberate re-grade — edit both versions here, commit (this
# file is the captured state), reinstall, re-run the affected topics' test
# suites, and re-stamp the grade records. The bump SIGNAL lives in
# docs/REFERENCES.md (collections row, quarter-boundary habit). Renovate
# automation was deferred with a reopen trigger (see TASKS.md): adopt it
# when the collection set grows, a missed-update incident occurs, or the
# queued scheduled-runner service lands and wants a job.

collections:
  - name: community.general    # homebrew, homebrew_cask, homebrew_tap, snap, launchd modules; bitwarden/onepassword lookups
    version: "13.0.1"
  - name: community.docker     # docker_image module
    version: "5.2.1"
  - name: community.vagrant    # the molecule vagrant driver's required collection (molecule_plugins/vagrant/driver.py)
    version: "1.0.1"
