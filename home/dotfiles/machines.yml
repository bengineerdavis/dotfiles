# machines.yml — per-machine provisioning answers, in two tiers.
#
# Standard: docs/LAYOUT.md § "Provisioning answers" (settled 2026-11-04;
# decision-1 in backlog/decisions/). Plain data, self-loaded by each topic
# that has first-install answers — the same resolution path under a
# parent-driven fleet run and a standalone `run-role.sh` run.
#
# THE KEY RULE (2026-11-04, correcting decision-1's original clause): a
# machine key is its `ansible_hostname`, and only where that hostname passes
# spec.md § Data's string test — "could I have found or used this without
# being part of a company?" A default OS hostname (pop-os) passes: anyone's
# box could be called that. A hardware serial does not: it traces to one
# physical device and its owner. A machine whose hostname fails the test
# carries NO committed key and puts its machine tier in the local overlay
# (~/.config/<topic>/answers.yaml, unversioned) instead.
#
# Repo membership is NOT here. It lives in config/repos.yaml (one shared
# catalogue, dot-171's contract); gita reports a declared-but-absent repo per
# machine rather than declaring different sets per machine.
#
# Work repos are NOT named anywhere in this repo — spec.md § Data forbids
# committing employer-identifying strings.
provisioning:
  shared:
    # Fleet defaults, written once. A machine inherits these unless it
    # overrides them in the machine tier below or in its local overlay.
    loreai:
      telemetry: 1
      inference: openrouter
      worker_model: openrouter/z-ai/glm-5.3-flash
machines:
  # Keyed by ansible_hostname, per the key rule above.
  pop-os:
    provisioning:
      # Inherits every shared answer above. An entry here documents that the
      # machine is registered; add overrides only when it must diverge.
      loreai: {}
