[scriv]
# Markdown, not scriv's rst default — everything else in this repo is markdown.
format = md

# Keep a Changelog's categories, which are also scriv's defaults. Named
# explicitly so a scriv upgrade cannot change them underneath us.
categories = Added, Changed, Deprecated, Removed, Fixed, Security

# Collected sections start at h2. The file's own title is the only h1, and two
# h1s in one document is a structure error, not a style preference.
md_header_level = 2
