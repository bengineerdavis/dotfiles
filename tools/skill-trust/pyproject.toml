[project]
name = "skill-trust"
version = "0.1.0"
description = "Decide whether an agent skill may be installed, by source ban, approval, or licence."
requires-python = ">=3.11"
dependencies = ["pyyaml>=6"]

# The point of this file is graduation. When this tool outgrows the dotfiles
# repo, `git subtree split` on tools/skill-trust/ yields a repo that already
# builds and installs — `uv tool install skill-trust` — rather than one that
# needs a packaging pass first. Nothing here imports from outside this directory,
# which is what keeps that true.
[project.scripts]
skill-trust = "skill_trust.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["skill_trust"]
