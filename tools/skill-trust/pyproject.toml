[project]
name = "skill-trust"
version = "0.1.0"
description = "Decide whether an agent skill may be installed, by source ban, approval, or licence."
# 3.14, matching the repo floor, not the aspirational 3.11 this once had:
# the repo formatter targets py314 and rewrites `except (A, B):` to the
# comma form, which 3.11-3.13 cannot parse — b1a5215 shipped that mangling
# and the uv tool venv (3.13) could not start. A floor the toolchain
# actively rewrites against is not a floor; this one matches what runs.
requires-python = ">=3.14"
dependencies = ["pyyaml>=6"]

# The point of this file is graduation. When this tool outgrows the dotfiles
# repo, `git subtree split` on tools/skill-trust/ yields a repo that already
# builds and installs — `uv tool install skill-trust` — rather than one that
# needs a packaging pass first. Nothing here imports from outside this directory,
# which is what keeps that true.
[project.scripts]
skill-trust = "skill_trust.cli:main"

# Ruff resolves each file against its NEAREST pyproject that has a
# [tool.ruff] section — this one had none, so the code was judged by the
# root repo config, whose target-version is py310 (the Ansible payload's
# /usr/bin/python3 floor). That flagged this tool's deliberate PEP 758
# `except A, B:` syntax as invalid-syntax (measured 2026-11-04). A floor the
# linter rewrites against is not a floor: this section mirrors the root lint
# settings but pins the target to what actually runs here.
[tool.ruff]
line-length = 88
target-version = "py314"

[tool.ruff.lint]
select = ["E", "W", "D"]
ignore = [
  # Conflicts with ruff format (Black style). W503 does not exist in ruff.
  "E203",
  "D100", "D101", "D102", "D103", "D104", "D105", "D106", "D107",
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.pycodestyle]
max-doc-length = 72

[tool.ruff.lint.per-file-ignores]
# Doc-line campaign grandfather: each entry shrinks as the file is next
# edited to the standard.
"skill_trust/**" = ["W505", "D205"]
"tests/**" = ["E402", "W505", "D205"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["skill_trust"]
