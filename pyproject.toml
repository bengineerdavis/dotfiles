[project]
name = "dotfiles"
version = "0"               # never released; the spec requires a version
requires-python = ">=3.14"  # what both machines run; scripts keep their own floors
dependencies = []           # nothing installs this; scripts declare their own deps

[dependency-groups]
test = ["pytest>=9", "hypothesis", "typer", "questionary", "pyyaml", "pillow", "jinja2"]
test-llm = ["llm", "files-to-prompt"]   # opt-in: pulls ~34 packages
lint = ["ruff", "ty"]
dev = [
    { include-group = "test" },
    { include-group = "lint" },
]
test-vm = [
    "ansible-core==2.21.5",
    "molecule==26.9.0",
    "molecule-plugins[vagrant]==26.9.28",
    "pytest-testinfra==10.2.2",
]

[tool.uv]
package = false             # never build or install the repo itself
environments = ["sys_platform == 'darwin'", "sys_platform == 'linux'"]
required-version = ">=0.12.17"

[tool.ruff]
line-length = 88
# Vendored application bundle, not repo Python.
extend-exclude = [
    # Vendored application bundles - not repo Python.
    "dotfiles/apps/zim",
    ".bats",
]

[tool.ruff.lint]
# pycodestyle (E/W) plus pydocstyle under the Google convention. The
# missing-docstring rules (D100-D107) are deliberately not selected: the
# existing corpus predates the docstring standard, and requiring docstrings
# everywhere is a content campaign, not a formatting fix.
select = ["E", "W", "D"]
ignore = [
  # Conflicts with ruff format (Black style). W503 does not exist in ruff.
  "E203",
  "D100", "D101", "D102", "D103", "D104", "D105", "D106", "D107",
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.pycodestyle]
# PEP 8: when the line limit is raised, comments and docstrings still wrap at 72.
max-doc-length = 72

[tool.ruff.lint.per-file-ignores]
# Imports after pytest.importorskip are the deliberate optional-dependency
# pattern; ruff exempts them, but explicit here for reviewers.
"tests/**" = ["E402"]
# PR #31 (restart-stale style) owns these six files' cleanup; remove this
# grandfather when it merges.
"dotfiles/roles/restart-stale/**" = ["E", "W", "D", "W505"]
"tests/restart_stale/**" = ["E", "W", "D", "W505"]
# Trace fixtures are verbatim third-party output - the long lines ARE the
# data, and an end-of-line noqa would become part of the traced content.
# Same for embedded Ansible/YAML fixture strings: splitting them changes the
# fixture the test asserts on.
# The apt source-audit fixture is verbatim apt output for the same reason:
# its over-88-col lines are data, not prose.
"tests/topics/test_apt_source_audit.py" = ["E501"]
# ── doc-line campaign grandfather (2026-10-01) ──────────────────────────
# W505 (72-col doc lines) and D205 (blank line after summary) are selected
# and enforced; these paths still fail them. Each entry shrinks as the
# file is next edited to the standard; delete the entry when its dir is
# clean (uv run --with ruff ruff check --select W505,D205 <dir>).
"scripts/**" = ["W505", "D205"]
"smartparts/python/**" = ["W505", "D205"]
"tests/binned/**" = ["W505", "D205"]
"tests/chezmoi/**" = ["W505", "D205"]
"tests/clipped/**" = ["W505", "D205"]
"tests/commit_proportionality/**" = ["W505", "D205"]
"tests/config/**" = ["W505", "D205"]
"tests/docs/**" = ["W505", "D205"]
"tests/guards/**" = ["W505", "D205"]
"tests/herdr/**" = ["W505", "D205"]
"tests/ollama_evals/**" = ["W505", "D205"]
"tests/permissions/**" = ["W505", "D205"]
"tests/pii_redactor/**" = ["W505", "D205"]
"tests/policy/**" = ["W505", "D205"]
"tests/quarantine/**" = ["W505", "D205"]
"tests/suite/**" = ["W505", "D205"]
"tests/tasks_doc/**" = ["W505", "D205"]
"tests/topic_resolution/**" = ["E501", "W505", "D205"]
"tests/topics/**" = ["W505", "D205"]
"tests/trace_public/**" = ["E501", "W505", "D205"]
"tests/uv/**" = ["W505", "D205"]
"tests/triage/**" = ["W505", "D205"]
"tools/skill-trust/skill_trust/**" = ["W505", "D205"]
"tools/skill-trust/tests/**" = ["W505", "D205"]


[tool.pytest]
testpaths = ["tests", "tools"]
# Makes tools/<name>/ importable when the repo suite collects its tests,
# without a conftest.py whose module name would collide with another one.
pythonpath = ["tools/skill-trust"]
python_files = ["test_*.py"]
# Model-calling tests are opt-in. Run with `pytest -m llm_judge` to override.
addopts = ["-m", "not llm_judge"]
markers = [
    "llm_judge: tests that call real LLM APIs — slow, costs tokens (run with -m llm_judge)",
]

[tool.pyrefly]
# Modules loaded via sys.path at runtime, invisible to packaging: the harness
# beside each suite that needs one (tests/restart_stale, tests/ollama_gpu_confirm,
# tests/run_molecule) and skill-trust (pytest resolves it through
# [tool.pytest] pythonpath; pyrefly needs it named here so the pre-commit
# hook's environment - which differs from a login shell - resolves the same
# modules the same way).
search-path = ["tests/restart_stale", "tests/ollama_gpu_confirm", "tests/run_molecule", "tools/skill-trust"]
project-includes = [
    "**/*.py*",
    "**/*.ipynb",
]
# Molecule scenario tests import testinfra, which lives in the opt-in
# test-vm group — unresolvable in any default environment, so project-state
# checking must skip them or every commit fails on machines without the
# group. Their verification runs inside the VM, not under pyrefly.
project-excludes = ["dotfiles/apps/opencode/molecule"]
