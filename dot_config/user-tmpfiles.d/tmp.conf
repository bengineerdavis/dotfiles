# Purge user temp dir (TMPDIR default per ~/.zshenv) after 30 days of
# inactivity. Age applies only via systemd-tmpfiles-clean.timer — enabled and started
# per-user 2026-10-14 (systemctl --user enable --now; verified active with
# next fire scheduled; ansible topics may promote to --global for other
# machines later).
q %h/.cache/tmp - - - 30d
