# worktrunk — user-level configuration (chezmoi-managed)
# Applies to every repository; project-level policy lives in each repo's
# committed .config/wt.toml (stamped by agentic-project-template).

# Worktrees live inside the repository, gitignored (.worktrees/).
worktree-path = "{{ repo_path }}/.worktrees/{{ branch | sanitize }}"

# Merge policy: a task's commit series survives the merge — one reviewable
# decision per commit is the house rule. worktrunk places merge policy at
# user level, so this cannot be stamped into projects; the wildcard covers
# every repository under the maintainer's GitHub namespace.
[projects."github.com/bengineerdavis/*"]
merge.squash = false
