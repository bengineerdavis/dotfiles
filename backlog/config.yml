projectName: dotfiles
statuses:
- To Do
- In Progress
- Done
defaultStatus: To Do
dateFormat: yyyy-mm-dd
includeDatetimeInDates: true
defaultPort: 6420
autoOpenBrowser: true
remoteOperations: false
autoCommit: false
bypassGitHooks: false
# Temporary DOT-353 repair: stale queue records on other sessions' branches
# shadow current tasks. DOT-286 owns the scanner fix and safe re-enablement.
checkActiveBranches: false
activeBranchDays: 30
prefixes:
  task: DOT
