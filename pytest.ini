[pytest]
testpaths = tests tools
# Makes tools/<name>/ importable when the repo suite collects its tests,
# without a conftest.py whose module name would collide with another one.
pythonpath = tools/skill-trust
python_files = test_*.py
markers =
    llm_judge: tests that call real LLM APIs — slow, costs tokens (run with -m llm_judge)
    slow: marks tests as slow
