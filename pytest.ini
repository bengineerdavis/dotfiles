[pytest]
testpaths = tests tools
# Makes tools/<name>/ importable when the repo suite collects its tests,
# without a conftest.py whose module name would collide with another one.
pythonpath = tools/skill-trust
python_files = test_*.py
# Model-calling tests are opt-in. They load local models (a cold load can
# exceed a minute and can kill the shared Ollama daemon), cost tokens on
# hosted judges, and append to the shared `llm` log — so a bare `pytest` must
# stay fast and free of side effects. Run them with `pytest -m llm_judge`,
# which overrides this filter (the last -m wins).
addopts = -m "not llm_judge"
markers =
    llm_judge: tests that call real LLM APIs — slow, costs tokens (run with -m llm_judge)
